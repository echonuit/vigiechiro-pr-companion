# Les épingles de la plateforme de test (#5661, #6060), et le SEUL endroit où elles vivent.
#
# L'ADR 5641 fait de l'épingle de l'API le remède d'une dérive : quand un test passe sur la
# plateforme de test et rougit sur la plateforme nationale, et que la cause est une évolution de la
# plateforme, on remonte cette révision. C'est une décision, pas une mise à jour, et elle se dit dans
# la demande de fusion qui la porte.
#
# `api.Dockerfile` la reçoit en argument de construction, sans valeur par défaut qui la dupliquerait.
# L'extension JUnit de #5663 lit ce fichier pour construire l'image et démarrer Mongo.

# La révision de `vigiechiro-api`, par SHA complet : l'archive GitHub d'un SHA court est ambiguë dès
# qu'un second commit partage son préfixe.
api.revision=5e924b1e529f7746544218ef6624a68702f8364c

# La révision de `vigiechiro-front`, par SHA complet, pour la même raison (#6060). `api.Dockerfile` le
# construit et le copie dans l'image de l'API, qui le sert à sa racine : la fiche web d'une
# participation se relit alors à la même origine que l'API.
front.revision=ad8e7f5532b3fe9fed387162d2450d36a31298d8

# Le navigateur qui lit la fiche web (#6061), l'image officielle de Selenium, par digest comme Mongo :
# une étiquette de Chrome suit les correctifs et désignerait une autre image d'un mois à l'autre.
navigateur.image=selenium/standalone-chrome:153.0@sha256:7efe71e7e4a83bdf574b26bd354690928075e8f443223d2ced16a2c208eae1d7

# Mongo par digest, jamais par étiquette : `mongo:7` a désigné deux images différentes le même jour
# (relevé le 2026-09-30). Mongo 7 tourne avec le pymongo 3.12 de l'API, mesuré par #4444, bien qu'il
# soit hors de la matrice officielle de pymongo 3.12 : le digest protège de la version suivante.
mongo.image=mongo:7@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
