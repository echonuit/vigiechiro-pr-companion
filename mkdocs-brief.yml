site_name: VigieChiro Companion · Brief projet
site_description: >-
  Dossier de conception de VigieChiro Companion : besoin, modèle de données,
  parcours utilisateurs, maquettes et story mapping.
site_url: https://brief.echonuit.fr/
repo_url: https://github.com/echonuit/vigiechiro-pr-companion
repo_name: echonuit/vigiechiro-pr-companion
edit_uri: edit/main/brief/docs/

# Les sources du brief vivent désormais dans ce dépôt, aux côtés de `docs/` (guide
# utilisateur) et `dev-docs/` (documentation développeur) : une conception qui bouge
# en même temps que le produit ne demande plus deux mises à jour dans deux dépôts.
# `echonuit/brief` ne reçoit plus que le site construit, comme `companion` et
# `companion-dev`. L'historique des 129 commits d'origine a été greffé sous `brief/`.
docs_dir: brief/docs
site_dir: site-brief

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Mode clair
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: fr

extra_css:
  - stylesheets/extra.css

