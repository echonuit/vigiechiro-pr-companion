# Le lanceur `vigiechiro` sous Windows (#4071) : le même que `lanceur-cli.properties`, plus la console.
#
# ⚠️ Les deux fichiers sont séparés parce que `win-console` ne s'applique QU'ICI. Le lanceur graphique
# ne doit pas en gagner : il ouvrirait une console noire à chaque lancement depuis le menu Démarrer,
# que `--win-menu` installe. C'est la raison d'être des deux enveloppes.
#
# Le pom choisit ce fichier par `${jpackage.lanceurCli}`, surchargé dans le profil `jpackage-windows`,
# même patron que `${jpackage.icon}` qui y devient un `.ico`.
#
# ⚠️ `arguments` est OBLIGATOIRE : sans cette clé, le lanceur hérite de l'`arguments=ihm` du principal
# et `vigiechiro` tapé seul ouvrirait la fenêtre au lieu de rendre l'aide.
description=Ligne de commande du compagnon VigieChiro
arguments=--help
win-console=true
