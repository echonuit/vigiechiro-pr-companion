# Le lanceur `vigiechiro` : la ligne de commande du produit installé (#4071).
#
# Ce n'est PAS un second point d'entrée. Le `main-jar` et la `main-class` s'héritent du lanceur
# principal, donc les deux exécutables mènent au même `fr.univ_amu.iut.Launcher`, qui aiguille sur le
# mot reçu. Ce fichier ne déclare que ce qui DIFFÈRE entre les deux portes.
#
# Il existe parce que `--name VigieChiroCompanion` produit un `bin/VigieChiroCompanion`, que personne
# ne tape sous Unix, et parce que sous Windows le sous-système d'un exécutable est inscrit dans son
# en-tête PE à l'édition de liens : un binaire graphique n'y a pas de sortie standard, et aucun code
# Java ne peut le reprendre à l'exécution. D'où deux enveloppes, comme `java` et `javaw`.
#
# `arguments` est OBLIGATOIRE ici, et sa valeur n'est pas cosmétique : sans cette clé, le lanceur
# HÉRITE de l'`arguments=ihm` du principal - mesuré - et `vigiechiro` tapé seul dans une console
# ouvrirait la fenêtre au lieu de rendre l'aide.
description=Ligne de commande du compagnon VigieChiro
arguments=--help
