version: 2
updates:
  # Dépendances Maven (junit, assertj, mockito, approvaltests, plugins...)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "maven"
    commit-message:
      prefix: "chore(deps)"
    # Ne bump PAS JavaFX ni javafx-maven-plugin automatiquement :
    # ces bumps ont un impact fort (rendu, plugin communautaire) et
    # doivent être décidés à la main par l'enseignant·e.
    ignore:
      - dependency-name: "org.openjfx:*"

  # Actions GitHub utilisées dans les workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    # `init` et `analyze` sont deux dépendances pour Dependabot et une seule pour CodeQL, qui
    # refuse une paire dépareillée : « Loaded a configuration file for version '4.37.6', but
    # running version '4.37.9' ». Montées séparément, les deux demandes se cassent l'une l'autre,
    # aucune ne peut passer au vert, et fusionner la première laisse `main` rouge jusqu'à la
    # seconde. Mesuré sur #5062 et #5063. Elles arrivent donc en une seule demande.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Outillage de publication (semantic-release et ses greffons), figé par lockfile depuis #2738.
  # Sans cette entrée, le lockfile fige aussi les correctifs de sécurité : figer sans surveiller
  # échange un risque contre un autre.
  - package-ecosystem: "npm"
    directory: "/.github/release"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
