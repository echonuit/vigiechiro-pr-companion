version: 2
updates:
  # Dépendances Maven (junit, assertj, mockito, approvaltests, plugins...)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "maven"
    commit-message:
      prefix: "chore(deps)"
    # Ne bump PAS JavaFX ni javafx-maven-plugin automatiquement :
    # ces bumps ont un impact fort (rendu, plugin communautaire) et
    # doivent être décidés à la main par l'enseignant·e.
    ignore:
      - dependency-name: "org.openjfx:*"

  # Actions GitHub utilisées dans les workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    # `init` et `analyze` sont deux dépendances pour Dependabot et une seule pour CodeQL, qui
    # refuse une paire dépareillée : « Loaded a configuration file for version '4.37.6', but
    # running version '4.37.9' ». Montées séparément, les deux demandes se cassent l'une l'autre,
    # aucune ne peut passer au vert, et fusionner la première laisse `main` rouge jusqu'à la
    # seconde. Mesuré sur #5062 et #5063. Elles arrivent donc en une seule demande.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Outillage de publication (semantic-release et ses greffons), figé par lockfile depuis #2738.
  # Sans cette entrée, le lockfile fige aussi les correctifs de sécurité : figer sans surveiller
  # échange un risque contre un autre.
  - package-ecosystem: "npm"
    directory: "/.github/release"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"

  # Outillage de spécification vivante (`@fission-ai/openspec`), figé par lockfile depuis #4512.
  # Le README de ce dossier a écrit pendant six semaines que Dependabot suivait ce manifeste, et
  # cette entrée n'existait pas : l'épinglage a vieilli de deux versions sans que rien ne le dise
  # (#6084).
  #
  # Une demande ouverte par cette entrée NE SE FUSIONNE PAS telle quelle. Elle déplace le manifeste
  # et le lockfile sans toucher le `generatedBy` des douze compétences, donc
  # `scripts/methode/verifie-version-openspec.py` rougit sur elle. C'est le signal voulu : elle dit
  # qu'une version existe, et le geste de montée est dans `.github/openspec/README.md`.
  # Une seule demande à la fois : le manifeste ne déclare qu'une dépendance directe.
  #
  # Une seule étiquette, celle qui existe. Dependabot commente chaque demande dont une étiquette
  # manque au dépôt, mesuré sur #5756 : « The following labels could not be found ».
  - package-ecosystem: "npm"
    directory: "/.github/openspec"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
