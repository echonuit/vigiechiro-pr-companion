# Release : version + CHANGELOG (semantic-release) puis installeurs natifs par OS (jpackage).
#
# - release : au TRAIN du mercredi (ADR 2744) ou sur déclenchement manuel - plus au push sur `main` -,
#   semantic-release analyse les Conventional Commits, calcule la version, crée le tag vX.Y.Z + la
#   Release GitHub + met à jour CHANGELOG.md (cf. .releaserc.json).
#   DORMANT tant que la variable de dépôt ENABLE_RELEASE != 'true' : à activer quand le dépôt est
#   public et que `main` est la branche consolidée (après la migration #169). Tant que c'est dormant,
#   rien ne tourne (et donc aucune release accidentelle sur le `main` étudiant régénéré).
# - installers : matrice ubuntu/macos/windows qui construit l'installeur natif (profil -Pinstaller)
#   pour le tag fraîchement créé et le téléverse sur la Release. C'est ici que le packaging se
#   valide réellement par OS (le fat-jar embarque les natifs JavaFX de l'OS de build).
#
# Anti-récursion : @semantic-release/git committe CHANGELOG.md avec `[skip ci]`, donc le push qui en
# résulte ne redéclenche pas ce workflow.
name: release

# TRAIN DE PUBLICATION (#2744, ADR 2744) : une cadence fixe, plus un déclenchement au commit.
#
# Ce workflow partait à CHAQUE fusion sur `main`. Mécaniquement, le dépôt publiait 3 à 37 versions par
# jour - 497 tags, jusqu'à 31 dans la même journée. Chacune portait un vrai changement (95 % de `feat`
# et `fix` sur les 120 dernières), mais une seule : aucune version ne correspondait à un état qu'on
# puisse décrire, ni valider par la recette (#1363), et les canaux de packaging avaient dû être
# débranchés pour ne pas suivre ce rythme.
#
# Mercredi : ni le lundi (la semaine n'a rien produit encore), ni le vendredi (personne ne corrige le
# samedi). Un défaut découvert le mercredi a deux jours ouvrés devant lui.
#
# `workflow_dispatch` reste : un correctif urgent n'attend pas le train.
#
# ⚠️ CONTOURNEMENT DE LA GARDE DES PLATEFORMES (#3561, passe 0). L'ADR 0041 pose la règle qu'on avait
# sautée : « avant de rendre un check obligatoire, inventorier tous les chemins d'écriture vers `main`
# [...] un chemin sans réponse est un blocage permanent ». L'inventaire tient en deux lignes - le train
# du mercredi, et ce dispatch - et la seconde était vide : la garde de #3526 retenait aussi le
# correctif urgent, alors que l'ADR 2744 décide l'inverse en toutes lettres.
#
# Le cas qui a tranché n'est pas le retard : c'est qu'un test **instable et sans rapport** (#3773 en
# documente dix candidats) aurait retenu un correctif de sécurité. On ne rend donc pas l'échappatoire
# impossible, et on ne la rend pas invisible non plus : elle exige une raison écrite, qui part dans le
# titre du run et dans son résumé.
on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:
    inputs:
      raison_du_contournement:
        description: >-
          Publier SANS preuve des plateformes. Laisser VIDE en temps normal ; une raison ici saute la
          garde et reste inscrite au titre du run.
        required: false
        type: string
        default: ""

# Le contournement se lit dans l'historique des runs, pas seulement dans les logs d'un job.
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch' && inputs.raison_du_contournement != '')
      && format('⚠️ publication SANS preuve des plateformes - {0}', inputs.raison_du_contournement)
      || 'publication' }}

# Plancher du workflow : LECTURE seule. Chaque job déclare ce qu'il lui faut de plus (#2739).
# Auparavant ce bloc accordait `contents/issues/pull-requests: write` aux TROIS jobs, dont la matrice
# d'installeurs - trois runners qui compilent, empaquettent et exécutent jpackage, et qui n'ont
# jamais eu besoin d'écrire une issue ni une pull request.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ⚠️ Le train ne part pas sans preuve que la suite passe **sur les plateformes qu'on livre** (#3526).
  #
  # Ce qu'on craint est de publier un MSI cassé sur sa propre plateforme, et l'empêcher de partir est
  # la seule sanction proportionnée : le train du mercredi est la dernière porte avant publication.
  #
  # ⚠️ La veille garde le cas le plus sournois, celui qu'un simple « le job est vert » manquerait : un
  # job qui **ne tourne plus du tout**. Un `schedule` peut être retardé, sauté sous charge, et il est
  # désactivé après soixante jours sans activité. Son silence passerait pour un feu vert.
  #
  # ⚠️ La condition est écrite « pas un dispatch, OU un dispatch sans raison », et surtout PAS
  # « inputs.raison_du_contournement == '' » seul : sur un `schedule`, `inputs` est **null**, et une
  # expression GitHub compare deux types différents en les coulant en nombre - `null == ''` y est donc
  # **vrai**. Écrite naïvement, la garde se serait sautée toute seule le mercredi, c'est-à-dire
  # exactement les jours où elle sert.
  preuve-des-plateformes:
    if: >-
      vars.ENABLE_RELEASE == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.raison_du_contournement == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: La suite a-t-elle été éprouvée récemment sous Windows et macOS ?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/workflows/suite-sous-windows-et-macos.yml/runs?per_page=30" \
            --jq '.workflow_runs[] | select(.conclusion != null) | "\(.updated_at)\t\(.conclusion)\t\(.display_title)"' \
            | ./.github/scripts/veille-plateformes.sh

  # Déclare le contournement, et ne tourne QUE dans ce cas : le job apparaît alors dans le graphe du
  # run, à côté de la garde absente. Un contournement qui ne se voit que dans un log est un
  # contournement qu'on oublie.
  contournement-declare:
    if: >-
      vars.ENABLE_RELEASE == 'true'
      && github.event_name == 'workflow_dispatch'
      && inputs.raison_du_contournement != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Pourquoi cette publication se passe de la preuve des plateformes
        env:
          RAISON: ${{ inputs.raison_du_contournement }}
        run: |
          set -euo pipefail
          # ⚠️ Une raison d'un caractère laisse une trace inutile, donc pas de trace du tout. Le refus
          # est chiffré pour qu'il se corrige au lieu de se deviner.
          if [ "${#RAISON}" -lt 20 ]; then
            echo "::error title=Raison trop courte::${#RAISON} caractère(s), 20 au minimum."
            echo "Le contournement laisse une trace pour qui la lira dans six mois. « x » n'en est pas une."
            exit 1
          fi
          {
            echo "### ⚠️ Publication sans preuve des plateformes"
            echo
            echo "> ${RAISON}"
            echo
            echo "La suite n'a **pas** été confirmée sous Windows et macOS pour cette version."
            echo "Lancer « Suite complète sous Windows et macOS » dès que possible (#3526)."
          } >> "${GITHUB_STEP_SUMMARY}"

  # ⚠️ `needs` sur un job **sauté** saute le dépendant par défaut : sans ce `if`, le contournement
  # empêcherait la publication au lieu de la permettre. On exige donc que la garde n'ait pas ÉCHOUÉ,
  # ce qui laisse passer « réussie » et « sautée » - et rien d'autre.
  release:
    needs: [preuve-des-plateformes, contournement-declare]
    # Dormant tant que ENABLE_RELEASE n'est pas 'true' (cf. en-tête).
    if: >-
      vars.ENABLE_RELEASE == 'true'
      && !cancelled()
      && needs.preuve-des-plateformes.result != 'failure'
      && needs.contournement-declare.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Le seul job qui a besoin des trois : semantic-release crée le tag et la Release (`contents`),
    # puis @semantic-release/github commente les issues et les pull requests que la version referme.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # semantic-release a besoin de tout l'historique + des tags
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Installer l'outillage depuis le lockfile
        # Auparavant `npx --yes -p semantic-release@24 …` : la résolution de versions se faisait à
        # CHAQUE exécution, dans ce job autorisé à écrire contenus, issues et PR. Un plugin compromis
        # entre deux runs s'y serait exécuté avec les droits de publication sans qu'aucun diff du
        # dépôt ne l'ait montré (#2738). Le lockfile fige l'arbre entier ; `npm ci` refuse d'installer
        # autre chose que lui, et toute montée de version passe par une PR relue.
        run: npm ci --prefix .github/release

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Lancé depuis la RACINE : c'est `.releaserc.json` qui fait foi ici, avec ses cinq greffons.
        # (La configuration d'analyse de .github/release/ n'en garde que deux et ne sert qu'à la
        # répétition à blanc des PR.)
        run: ./.github/release/node_modules/.bin/semantic-release
      - name: Récupérer le tag fraîchement créé
        id: tag
        run: |
          git fetch --tags --force
          NEW_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          echo "value=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Nouveau tag : ${NEW_TAG:-(aucun)}"

  installers:
    needs: release
    # Téléverse les installeurs sur la Release (`gh release upload`). C'est le job le plus exposé -
    # il compile, empaquette et exécute jpackage sur trois systèmes.
    #
    # `id-token` et `attestations` sont exigés par l'attestation de provenance (#2742) et ne donnent
    # rien d'autre : le jeton OIDC ne sert qu'à prouver à Sigstore QUI construit, et `attestations`
    # n'écrit que dans le magasin d'attestations de ce dépôt. Ni l'un ni l'autre ne permet de toucher
    # au code, aux issues ou aux pull requests.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Seulement si semantic-release a réellement publié une version (tag non vide).
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        # Trois cibles : Linux (.deb), macOS Apple Silicon (.dmg arm64), Windows (.msi). Les
        # artefacts sont nommés par architecture (cf. étape de renommage) pour rester explicites.
        # macOS Intel (`macos-13`) est volontairement écarté : les runners Intel GitHub sont en fin
        # de vie (migration annoncée de `macos-latest` vers macOS 26 sur Apple Silicon) et un job
        # Intel en attente de runner bloquerait la publication atomique.
        # `portable` nomme le système dans l'archive autonome (#2107) : l'utilisateur qui télécharge
        # doit reconnaître SA plateforme, pas le nom du runner GitHub.
        include:
          - os: ubuntu-latest
            type: deb
            arch: x64
            portable: linux
          - os: macos-latest
            type: dmg
            arch: arm64
            portable: macos
          - os: windows-latest
            type: msi
            arch: x64
            portable: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }} # le commit taggué (code + CHANGELOG à jour)
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Construire l'installeur natif (${{ matrix.type }})
        shell: bash
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          ./mvnw -B -Pinstaller \
            -Djpackage.type=${{ matrix.type }} \
            -Djpackage.appVersion="$VERSION" \
            -Dapp.version="$VERSION" \
            -DskipTests -Dpmd.skip=true -Djacoco.skip=true \
            clean verify
      - name: Nommer les installeurs par architecture (évite la collision macOS arm64/Intel)
        shell: bash
        run: |
          cd target/dist
          for f in *; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            base="${f%.*}"
            mv -- "$f" "${base}-${{ matrix.arch }}.${ext}"
          done
          ls -l
      - name: Construire l'archive portable (ni installation, ni droits administrateur)
        # Deuxième passage de jpackage, en `app-image` : le MÊME profil `installer` sait produire
        # cette forme, seul le type change. On obtient un dossier autonome (lanceur natif + runtime +
        # fat-jar) qui se décompresse et se lance, sans installateur ni droits admin - la marche du bas
        # qui manquait pour essayer le produit ou l'utiliser sur une machine non administrée (#2107).
        #
        # Pas de `clean` ici : on réutilise le build du pas précédent. L'app-image sort dans
        # target/dist/, APRÈS l'étape de renommage, pour ne pas se faire renommer par elle.
        shell: bash
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          # Les profils OS (jpackage-linux/-windows) ajoutent des options d'INSTALLEUR
          # (--linux-menu-group, --win-upgrade-uuid, --win-per-user-install…) valides pour deb/msi
          # mais INVALIDES avec --type app-image : jpackage s'arrête sur « Option [...] is not valid
          # with type [app-image] » (#2256). On désactive donc le profil OS pour cette forme. Sur
          # Windows, l'icône .ico qu'il portait doit être réinjectée à la main (jpackage y refuse un
          # PNG). Le profil jpackage-mac reste actif : son --mac-package-identifier EST valide pour
          # app-image (le job macOS passait déjà).
          PROFILS="installer"
          ICONE=()
          case "${{ matrix.portable }}" in
            linux)   PROFILS="installer,!jpackage-linux" ;;
            windows) PROFILS="installer,!jpackage-windows"
                     ICONE=("-Djpackage.icon=${GITHUB_WORKSPACE}/icone/derive/vigiechiro.ico") ;;
          esac
          ./mvnw -B -P"$PROFILS" \
            -Djpackage.type=app-image \
            -Djpackage.appVersion="$VERSION" \
            -Dapp.version="$VERSION" \
            -DskipTests -Dpmd.skip=true -Djacoco.skip=true \
            "${ICONE[@]}" verify

      
      - name: Installer desktop-file-utils (validation du .desktop)
        # `desktop-file-validate`, dont appimagetool se sert pour valider le .desktop. Absent des
        # runners GitHub, alors qu'il est présent sur la plupart des postes de développement (tiré
        # par les environnements de bureau) : d'où une construction qui passait en local et échouait
        # ici, sur la release v2.21.0.
        #
        # ⚠️ Cache de l'état INSTALLÉ, pas des `.deb` : il saute aussi le dépaquetage. Convient ici
        # parce que ce paquet n'est que des fichiers ; les polices et flatpak gardent
        # `installer-paquets.sh`, dont le post-install fait foi.
        if: matrix.portable == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: desktop-file-utils
          version: vigiechiro-1

      - name: Construire l'AppImage (Linux)
        # Un fichier unique et exécutable : l'utilisateur le rend exécutable et le lance, sans rien
        # décompresser. Complément de l'archive portable pour qui préfère un fichier à un dossier, et
        # seul format des deux à s'intégrer au menu des applications (via le .desktop).
        #
        # Placée AVANT l'empaquetage de l'archive portable, qui supprime target/dist/VigieChiroCompanion : les
        # deux formats partent de la même app-image, il ne faut donc pas la retirer entre-temps.
        if: matrix.portable == 'linux'
        shell: bash
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          chmod +x .github/scripts/construit-appimage.sh
          ./.github/scripts/construit-appimage.sh "${TAG#v}" x86_64

      - name: Empaqueter et nommer l'archive portable
        # Un format par système, choisi pour ce qu'il PRÉSERVE :
        # - tar.gz (Linux) garde le bit exécutable du lanceur ;
        # - ditto (macOS) est le seul outil qui préserve un bundle .app intact (un `zip -r` casse
        #   ses liens symboliques et ses permissions, et l'app ne s'ouvre plus) ;
        # - zip (Windows), où la notion de bit exécutable n'existe pas.
        # Le dossier d'origine est retiré ensuite : `gh release upload` échoue sur un répertoire.
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          BASE="VigieChiroCompanion-${VERSION}-${{ matrix.portable }}-${{ matrix.arch }}-portable"
          cd target/dist
          case "${RUNNER_OS}" in
            Linux)   tar -czf "${BASE}.tar.gz" VigieChiroCompanion ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent VigieChiroCompanion.app "${BASE}.zip" ;;
            Windows) 7z a -tzip "${BASE}.zip" VigieChiroCompanion > /dev/null ;;
            *)       echo "::error::Système non pris en charge : ${RUNNER_OS}" && exit 1 ;;
          esac
          rm -rf VigieChiroCompanion VigieChiroCompanion.app
          ls -l

      - name: Ouvrir chaque emballage et le lancer (#3617)
        # Placée AVANT les empreintes et l'attestation, à dessein : un artefact qui ne démarre pas ne
        # doit être ni certifié, ni attesté, ni téléversé. Un emballage cassé bloque la publication au
        # lieu d'arriver chez l'utilisateur.
        #
        # Ce que ça ajoute au reste : `maven.yml` prouve à chaque PR que l'APP-IMAGE démarre, mais
        # personne n'ouvrait les ENVELOPPES. Or chacune a été choisie pour ce qu'elle préserve, donc
        # chacune a une façon connue de casser - le bit exécutable pour `tar.gz`, les liens
        # symboliques d'un bundle `.app` pour `ditto`, et l'AppImage a déjà fait échouer la v2.21.0.
        #
        # ⚠️ Windows n'est pas couvert ici : le script est en bash et le suivi d'un lanceur en
        # sous-système graphique depuis Git Bash n'a pas pu être éprouvé. Un faux échec y bloquerait
        # une publication. Le `.msi`, lui, est installé ET lancé par `winget.yml`.
        if: matrix.portable != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/verifie-demarrage-emballage.sh
          bac=$(mktemp -d)
          cd target/dist

          case "${RUNNER_OS}" in
            Linux)
              tar -xzf ./*-portable.tar.gz -C "$bac"
              "${GITHUB_WORKSPACE}/.github/scripts/verifie-demarrage-emballage.sh" \
                "$bac/VigieChiroCompanion/bin/VigieChiroCompanion" \
                --secondes 30 --libelle "archive portable Linux"

              appimage=$(ls ./*.AppImage)
              chmod +x "$appimage"
              # --appimage-extract-and-run : les runners n'ont pas toujours FUSE, ce dont une AppImage
              # a besoin pour se monter. Sans cette option, l'échec est obscur et sans rapport.
              APPIMAGE_EXTRACT_AND_RUN=1 \
                "${GITHUB_WORKSPACE}/.github/scripts/verifie-demarrage-emballage.sh" \
                "$(pwd)/$appimage" --secondes 30 --libelle "AppImage"
              ;;
            macOS)
              ditto -x -k ./*-portable.zip "$bac"
              "${GITHUB_WORKSPACE}/.github/scripts/verifie-demarrage-emballage.sh" \
                "$bac/VigieChiroCompanion.app/Contents/MacOS/VigieChiroCompanion" \
                --secondes 30 --libelle "archive portable macOS (bundle .app par ditto)"
              ;;
          esac
          rm -rf "$bac"

      - name: Calculer l'empreinte SHA-256 de chaque artefact
        # Les installeurs ne sont pas signés : l'empreinte est le seul moyen, pour l'utilisateur, de
        # vérifier ce qu'il a téléchargé.
        #
        # Un fichier PAR artefact, et non une liste unique. Deux raisons.
        #
        # 1. L'utilisateur télécharge UN fichier. Lui demander de récupérer en plus une liste de sept
        #    empreintes dont six ne le concernent pas, puis d'y filtrer sa ligne, est une friction
        #    inutile : `sha256sum -c mon-fichier.sha256` se passe d'explication.
        # 2. Surtout, l'empreinte est ici calculée sur la SORTIE DE BUILD, avant téléversement. La
        #    version précédente la calculait sur les artefacts re-téléchargés depuis la Release :
        #    une corruption survenue au téléversement s'y serait retrouvée CERTIFIÉE conforme, et
        #    l'utilisateur aurait vérifié un binaire abîmé avec succès. Une empreinte doit attester
        #    la source, pas ce que le canal de distribution en a fait.
        #
        # macOS n'a pas `sha256sum` ; `shasum -a 256` produit le même format, lisible par les deux.
        shell: bash
        run: |
          set -euo pipefail
          cd target/dist
          if command -v sha256sum >/dev/null; then
            empreinte() { sha256sum "$1"; }
          else
            empreinte() { shasum -a 256 "$1"; }
          fi
          for artefact in *; do
            [ -f "${artefact}" ] || continue
            case "${artefact}" in *.sha256) continue ;; esac
            empreinte "${artefact}" > "${artefact}.sha256"
          done
          cat ./*.sha256

      - name: Attester la provenance des artefacts
        # Ce que l'empreinte SHA-256 ne dit pas : QUI a produit le fichier. Elle prouve qu'il est
        # identique à celui publié, mais elle est publiée au même endroit que lui - sa confiance vaut
        # celle qu'on accorde à la page du projet. L'attestation, elle, lie le binaire à un COMMIT et
        # à une EXÉCUTION de ce workflow, et se vérifie contre Sigstore, hors de notre portée.
        #
        # Produite ici, sur la sortie de build et AVANT le téléversement, pour la même raison que
        # l'empreinte : une corruption survenue au téléversement se retrouverait sinon attestée.
        #
        # Les `.sha256` sont exclus : attester une empreinte de trois lignes n'apprend rien, et
        # allonge la liste que l'utilisateur doit lire.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            target/dist/*
            !target/dist/*.sha256

      - name: Téléverser l'installeur sur la Release (brouillon), avant publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" target/dist/* --clobber

      - name: Joindre le SBOM à la Release
        # Depuis UN seul runner : l'inventaire des dépendances est celui de la résolution Maven, il
        # ne dépend pas du système qui empaquette (les natifs JavaFX mis à part, portés par des
        # classifieurs). Trois copies identiques ne diraient rien de plus, et le nom du fichier ne
        # pourrait plus être stable (#2740).
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp target/sbom.json "sbom-${{ needs.release.outputs.tag }}.json"

      - name: Attester la provenance du SBOM
        # Le SBOM est publié comme les binaires : il se prouve comme eux. Sans cela, l'inventaire des
        # dépendances serait le seul artefact de la Release qu'on demanderait de croire sur parole.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: sbom-${{ needs.release.outputs.tag }}.json

      - name: Téléverser le SBOM
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.release.outputs.tag }}" \
            "sbom-${{ needs.release.outputs.tag }}.json" --clobber

  # Publication atomique : la Release est créée en **brouillon** par semantic-release (cf.
  # .releaserc.json, draftRelease), les installeurs y attachent leurs assets, et CE job ne retire le
  # brouillon (= rend la Release publique) qu'une fois TOUS les installeurs téléversés avec succès.
  # `needs: installers` exige le succès de toute la matrice : si un OS échoue, ce job est sauté et la
  # Release reste un brouillon (pas de release publique aux assets manquants).
  publish:
    needs: [release, installers]
    # Retire l'état brouillon de la Release : une seule commande `gh`, aucun code tiers.
    permissions:
      contents: write
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publier la Release (retirer le brouillon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --draft=false
