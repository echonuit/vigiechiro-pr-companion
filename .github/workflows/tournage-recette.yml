# Tourner les clips d'UNE session, sur la plateforme de son choix (#4163).
#
# ## Pourquoi ce workflow existe
#
# L'EPIC #4133 s'était donné une limite à surveiller : « le tournage met une dizaine de minutes pour
# 45 clips ; à 400, ce serait des heures par passage, et le dispositif changerait de nature. Il
# faudra probablement filmer par session plutôt que tout à chaque fois. »
#
# Le banc filmé en Java pur le rend possible, et pour deux raisons qui n'ont rien à voir l'une avec
# l'autre. Il photographie le graphe de scène, donc il tourne là où il n'y a ni serveur X ni
# gestionnaire de fenêtres - Windows et macOS compris, ce que le banc bash ne peut pas. Et il écrit
# un fichier par test, donc restreindre le tournage se réduit à un `-Dtest=`.
#
# ## Ce qu'il publie, et ce qu'il ne publie pas
#
# ⚠️ Il ne touche **jamais** à `clips-recette`, qui reste alimentée par `recette-filmee.yml`. Deux
# dispositifs qui publieraient au même endroit se contrediraient tôt ou tard, et le sort du banc bash
# se décide à part, les deux bancs comparés sur le même tournage.
#
# Il verse en revanche sur **deux** destinations qui lui sont propres :
#
#   - le TAG d'une version, préfixé `java-`, quand le train lui passe une version (#4258) ;
#   - la pré-version `clips-connectes`, quand le tournage est CONNECTÉ (#4306). Celle-là ne se compare
#     pas : ses clips suivent des données vivantes, et `comparer-tournages.yml` la refuse.
#
# ⚠️ Et « le reste demeure en artefact » n'est pas une protection : sur un dépôt public, un artefact se
# télécharge SANS authentification (mesuré, cf. `dev-docs/spikes/tournage-contre-la-plateforme.md`).
#
# ## Le garde, et pourquoi il porte sur les CAS
#
# ⚠️ Compter les clips ne prouverait rien : un tournage qui rend « des clips » peut en avoir perdu la
# moitié. Ce qui se vérifie, c'est que chaque cas CITÉ de la session a bien sa ligne dans l'index.
# Le nombre attendu ne se devine pas non plus : il est dérivé par `CorrespondanceRecetteTest`, qui
# balaie le classpath, et déposé dans `sessions-a-filmer.tsv` à côté des classes.

name: tournage de recette

# ⚠️ Le `run-name` est PUBLIC : sur ce dépôt, le `display_title` d'un run se lit sans authentification
# (mesuré, cf. `dev-docs/spikes/tournage-contre-la-plateforme.md`). On y met donc des choix, jamais une
# valeur. « connecté » est un fait utile à lire dans la liste des runs ; le jeton, lui, n'y passe pas.
run-name: "tournage ${{ inputs.session }} sur ${{ inputs.plateforme }}${{ inputs.connecte && ' · connecté' || '' }}"

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Session à filmer (« toutes » pour tous les cas cités)"
        type: choice
        default: "S6"
        options:
          - "toutes"
          - "S1"
          - "S2"
          - "S3"
          - "S4"
          - "S5"
          - "S6"
          - "S7"
          - "S8"
          - "S9"
          - "S10"
          - "S11"
      plateforme:
        description: "Où filmer"
        type: choice
        default: "ubuntu"
        options:
          - "ubuntu"
          - "windows"
          - "macos"
      connecte:
        description: "Parler à la VRAIE plateforme Vigie-Chiro (lecture seule) au lieu des fixtures"
        type: boolean
        default: false

  # ⚠️ Un second bloc, et non le même : `workflow_call` ne connaît pas `type: choice`. Les valeurs
  # possibles restent celles de la liste ci-dessus, et c'est l'appelant qui en répond.
  #
  # Le train appelle ce workflow pour PRÉPARER LA TRANSITION vers le banc Java : les deux bancs
  # filment la même version, le bash verse ses clips préfixés `bash-` et celui-ci les siens préfixés
  # `java-`, sur le même tag. Le jour où le sort du banc bash sera tranché, il n'y aura qu'un appel à
  # retirer (#4258).
  workflow_call:
    inputs:
      session:
        description: "Session à filmer (« toutes » pour tous les cas cités)"
        type: string
        default: "toutes"
      plateforme:
        description: "Où filmer"
        type: string
        default: "ubuntu"
      version:
        description: "Le tag de la version que ces clips montrent. Vide : rien n'est versé."
        type: string
        default: ""
      connecte:
        description: "Parler à la VRAIE plateforme Vigie-Chiro (lecture seule) au lieu des fixtures"
        type: boolean
        default: false

    # ⚠️ Déclaré NOMMÉMENT, et surtout pas `secrets: inherit`. L'héritage passerait aussi
    # `FLATPAK_GPG_KEY` et `WINGET_TOKEN` à un job qui exécute les tests du produit, c'est-à-dire du
    # code qui change à chaque PR, pour la commodité de ne pas écrire trois lignes.
    secrets:
      VIGIECHIRO_TOKEN_TOURNAGE:
        description: "Jeton du tournage connecté. Frappé sur le même compte que celui du contrat, mais SIEN : il est révoqué en fin de run (#4305). ⚠️ Le compte engage plus que son accès : les clips publient l identite qu il rend et le resume de ce qu il contient. Le compte du mainteneur est le compte de tournage, et poser ici le jeton d un TIERS publierait son nom (#4345)."
        required: false

permissions:
  contents: read

jobs:
  # ⚠️ Le runner se CALCULE, il ne se filtre pas. Une matrice filtrée par `if:` laisserait des jobs
  # démarrer pour ne rien faire, et une pastille verte qui ne dit pas si la plateforme a été
  # éprouvée ou seulement visitée. Même parti que `suite-sous-windows-et-macos.yml`.
  choisir:
    name: Où filmer ?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runner: ${{ steps.calcul.outputs.runner }}
    steps:
      - name: Traduire la plateforme en runner
        id: calcul
        shell: bash
        run: |
          set -euo pipefail
          # ⚠️ Le cas par défaut REFUSE, il ne se rabat pas. Tant que ce workflow n'était appelé qu'à
          # la main, la liste de choix rendait une valeur inconnue impossible. Depuis qu'il est
          # appelable (`workflow_call`), l'entrée est une chaîne libre : un `*) ubuntu` filmerait
          # alors sur Linux une demande de tournage Windows, et le rapport dirait « windows » dans son
          # titre. Un repli silencieux rend un résultat qui a l'air juste (ADR 0008).
          case "${{ inputs.plateforme }}" in
            ubuntu)  runner="ubuntu-latest" ;;
            windows) runner="windows-latest" ;;
            macos)   runner="macos-latest" ;;
            *)
              echo "::error::Plateforme inconnue : « ${{ inputs.plateforme }} ». Attendu : ubuntu, windows ou macos."
              exit 1
              ;;
          esac
          echo "runner=${runner}" >> "${GITHUB_OUTPUT}"
          echo "Tournage de ${{ inputs.session }} sur ${runner}." >> "${GITHUB_STEP_SUMMARY}"

  filmer:
    name: Filmer ${{ inputs.session }}
    needs: choisir
    # ⚠️ `needs.choisir.result == 'success'` est implicite ici : sans le runner calculé, ce job n'a
    # pas de machine où tourner, donc il ne doit pas démarrer.
    runs-on: ${{ needs.choisir.outputs.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      # ⚠️ On CONSTATE avant d'installer. Aucune des trois images GitHub ne porte `ffmpeg`, mais
      # cela peut changer, et un pas d'installation qui devient inutile se voit ici plutôt que de
      # coûter vingt secondes à chaque tournage sans que personne ne le sache.
      - name: ffmpeg est-il déjà là ?
        id: ffmpeg
        shell: bash
        run: |
          set -uo pipefail
          if chemin=$(command -v ffmpeg); then
            echo "présent sur l'image : ${chemin}"
            echo "installe=deja" >> "${GITHUB_OUTPUT}"
          else
            echo "absent de l'image ; il faut l'installer."
            echo "installe=manquant" >> "${GITHUB_OUTPUT}"
          fi

      - name: Installer ffmpeg (macOS)
        if: ${{ steps.ffmpeg.outputs.installe == 'manquant' && runner.os == 'macOS' }}
        shell: bash
        run: brew install ffmpeg

      - name: Installer ffmpeg (Windows)
        if: ${{ steps.ffmpeg.outputs.installe == 'manquant' && runner.os == 'Windows' }}
        shell: pwsh
        run: choco install ffmpeg --no-progress --yes

      - name: Cache des .deb (le dépaquetage, lui, se refait)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          key: apt-${{ runner.os }}-tournage-recette

      # ⚠️ `installer-paquets.sh`, et non `apt-get` en direct : `verifie-apt.sh` refuse la seconde
      # forme, et exige le cache ci-dessus avec son `APT_CACHE`.
      - name: Installer ffmpeg (Linux)
        if: ${{ steps.ffmpeg.outputs.installe == 'manquant' && runner.os == 'Linux' }}
        shell: bash
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: bash .github/scripts/installer-paquets.sh ffmpeg

      # La liste ne se maintient pas à la main : elle est DÉRIVÉE du classpath, cas par cas.
      # ⚠️ Les entrées passent par `env:` et non par interpolation dans le shell. Elles viennent
      # d'une liste fermée, donc rien ne peut s'y glisser aujourd'hui ; l'habitude, elle, se prend
      # avant le jour où quelqu'un rendra l'entrée libre.
      #
      # ⚠️ Tout se lit en `awk` : `bc` n'existe pas sur le Git Bash des runners Windows, et une
      # tabulation littérale dans un motif `grep` ne survit pas au YAML.
      - name: Dériver les classes de la session
        id: liste
        shell: bash
        env:
          SESSION: ${{ inputs.session }}
          CONNECTE: ${{ inputs.connecte }}
        run: |
          set -euo pipefail
          ./mvnw -B -q test --file pom.xml -Dtest=CorrespondanceRecetteTest -DfailIfNoTests=false
          derive=target/recette/sessions-a-filmer.tsv
          [ -s "${derive}" ] || { echo "::error::${derive} est absent ou vide : la dérivation n'a rien produit."; exit 1; }

          # ⚠️ En connecté, la dérivation par session ne s'applique pas : le corpus connecté est
          # choisi par un TAG, pas par une session, et le compte de la session mélangerait les
          # scénarios bouchonnés avec les autres. L'oracle exhaustif est donc remplacé, plus bas, par
          # un contrôle plus faible - et qui le DIT.
          if [ "${CONNECTE}" = "true" ]; then
            classes=""
            attendus=0
          elif [ "${SESSION}" = "toutes" ]; then
            classes=$(awk -F'\t' '{print $3}' "${derive}" | tr ',' '\n' | sort -u | paste -sd,)
            attendus=$(awk -F'\t' '{s += $2} END {print s + 0}' "${derive}")
          else
            classes=$(awk -F'\t' -v s="${SESSION}" '$1 == s {print $3}' "${derive}")
            attendus=$(awk -F'\t' -v s="${SESSION}" '$1 == s {print $2}' "${derive}")
            # ⚠️ Une session SANS cas cité n'est pas une panne du dispositif : c'est l'état du
            # dépôt, et la plupart des sessions y sont encore. On le dit et on s'arrête, plutôt que
            # de lancer un tournage qui rendrait zéro clip et un garde qui ne saurait quoi conclure.
            [ -n "${classes}" ] || { echo "::error::${SESSION} ne cite aucun cas : il n'y a rien à filmer."; exit 1; }
          fi

          echo "classes=${classes}" >> "${GITHUB_OUTPUT}"
          echo "attendus=${attendus}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Tournage ${SESSION} sur ${{ needs.choisir.outputs.runner }}"
            echo
            echo "- cas attendus : ${attendus}"
            echo "- classes : \`${classes}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ⚠️ `failure.ignore` : on veut les CLIPS. Un cas qui rougit produit son clip comme les autres,
      # et c'est même celui-là qu'on veut regarder. Subordonner le tournage au vert de la session
      # rendrait les clips otages d'une condition sans rapport avec ce qu'ils servent à juger.
      #
      # Aucun `forkCount` imposé : filmer le graphe de scène n'exige pas un écran unique, et
      # `IndexDesCas` fusionne les fragments de toutes les JVM.
      #
      # ⚠️ La détection automatique n'est pas un détail de confort : sans elle, seules les classes
      # qui portent encore `@ExtendWith(EnregistreurDeFilm.class)` sont filmées, c'est-à-dire les
      # quatre scénarios perceptifs de #3791. Mesuré sur le premier tournage de `S1` : **3 cas sur
      # 37**. Ni `S6` ni `S4` ne pouvaient le révéler - leurs seules classes sont justement celles
      # qui portent l'annotation, et les deux étaient vertes.
      #
      # Ce qui la rend sûre est ailleurs : `EnregistreurDeFilm.aFilmer` écarte les tests qui ne
      # citent aucun cas (#4162). Sans ce filtre, la même ligne rendrait des centaines de clips de
      # carton.
      # ⚠️ Le tournage connecté REFUSE de partir sans son jeton, plutôt que de filmer hors ligne. Un
      # écran déconnecté est parfaitement convaincant : le clip ne serait pas faux, il serait muet sur
      # son propre objet (ADR 4142), et on le regarderait en croyant savoir. Le banc porte le même
      # refus (`BancDeRecette#connecteALaPlateforme`) ; celui-ci arrive plus tôt et coûte moins cher.
      - name: Le tournage connecté a-t-il son jeton ?
        if: ${{ inputs.connecte }}
        shell: bash
        env:
          JETON: ${{ secrets.VIGIECHIRO_TOKEN_TOURNAGE }}
        run: |
          set -euo pipefail
          if [ -z "${JETON}" ]; then
            echo "::error::Tournage connecté demandé, secret VIGIECHIRO_TOKEN_TOURNAGE absent. Le poser :"
            echo "::error::gh secret set VIGIECHIRO_TOKEN_TOURNAGE (jeton Vigie-Chiro, 14 jours, révoqué en fin de run)."
            exit 1
          fi
          echo "Jeton présent : le tournage parlera à la plateforme réelle, en lecture." >> "${GITHUB_STEP_SUMMARY}"

      # ⚠️ Le secret vit dans l'`env:` de CE PAS, jamais dans celui du job, et
      # `verifie-portee-des-secrets.sh` (#4303) le refuse ailleurs. La raison n'est pas cosmétique :
      # `ConnexionModule.jetonPonctuel()` lit `System.getenv`, les forks surefire héritent de
      # l'environnement du job, et l'URL de base vaut la production par défaut.
      #
      # ⚠️ Et ce pas-ci lance TOUTE la liste de classes, qui partagent donc cet environnement. Ce qui
      # empêche un scénario non connecté de s'en servir n'est pas la portée du secret mais le banc
      # lui-même : depuis #4304 il lie sa propre source de jeton, et seul `connecteALaPlateforme()`
      # va chercher celui du processus.
      #
      # ⚠️ `VIGIECHIRO_URL` est DÉCLARÉE, même quand elle vaut la production. Un défaut implicite qui
      # pointe sur la production est un défaut qu'on oublie de relire.
      - name: Filmer
        shell: bash
        env:
          VIGIECHIRO_TOKEN: ${{ inputs.connecte && secrets.VIGIECHIRO_TOKEN_TOURNAGE || '' }}
          VIGIECHIRO_URL: ${{ inputs.connecte && 'https://vigiechiro.herokuapp.com/api/v1' || '' }}
        run: |
          set -uo pipefail
          # ⚠️ Connecté, le tournage ne joue QUE les scénarios écrits pour la plateforme
          # (`@Tag("recette-connectee")`), et il les joue TOUS, sans se restreindre à une session. Le
          # tag est exclu du build par défaut : sans jeton, ces scénarios refusent de monter, et les
          # laisser dans la suite ordinaire la ferait rougir sur chaque PR (#4307).
          selection=(-Dtest="${{ steps.liste.outputs.classes }}")
          if [ "${{ inputs.connecte }}" = "true" ]; then
            # ⚠️ Les DEUX propriétés, et c'est le défaut que le premier tir a trouvé : poser
            # `groups` seul ne lève pas l'exclusion, et surefire n'a rien sélectionné. Le tournage
            # a rendu « Tests run: 0 », un build VERT, et n'a échoué qu'à l'étape suivante sur un
            # index absent. C'est ce que fait le profil `-Papi-live` : il inverse les deux.
            selection=(-Dsurefire.groups=recette-connectee -Dsurefire.excludedGroups=api-live)
          fi
          ./mvnw -B test --file pom.xml \
            "${selection[@]}" \
            -DfailIfNoTests=false \
            -Dmaven.test.failure.ignore=true \
            -Djunit.jupiter.extensions.autodetection.enabled=true \
            -Drecette.film \
            2>&1 | tee tournage.log
          echo "Maven a rendu ${PIPESTATUS[0]} ; le verdict est pris à l'étape suivante."

      # ⚠️ Le garde porte sur les CAS, pas sur le nombre de fichiers. Un tournage qui rend « des
      # clips » peut en avoir perdu la moitié, et un compte de fichiers ne le dirait pas.
      - name: Chaque cas de la session a sa ligne
        shell: bash
        env:
          SESSION: ${{ inputs.session }}
          ATTENDUS: ${{ steps.liste.outputs.attendus }}
          CONNECTE: ${{ inputs.connecte }}
        run: |
          set -uo pipefail
          index=target/recette/clips/index.md
          [ -s "${index}" ] || { echo "::error::index absent : le tournage n'a rien indexé."; exit 1; }

          if [ "${SESSION}" = "toutes" ]; then
            motif='^S[0-9]+-'
          else
            motif="^${SESSION}-"
          fi
          # La première colonne du tableau, dédoublonnée : un cas joué par deux tests a deux lignes.
          # ⚠️ La sortie est CAPTURÉE avant d'être comptée : sous `pipefail`, un `grep` en bout de
          # tube ne dit rien du code de ce qui est à sa gauche, et un index illisible se compterait
          # comme un index vide.
          colonne=$(grep -E '^\| S' "${index}" | cut -d'|' -f2 | tr -d ' ' || true)
          obtenus=$(printf '%s\n' "${colonne}" | grep -E "${motif}" | sort -u | wc -l || true)
          clips=0
          for clip in target/recette/clips/*.mp4; do
            [ -e "${clip}" ] || continue
            clips=$((clips + 1))
          done

          {
            echo "- cas obtenus : ${obtenus} / ${ATTENDUS}"
            echo "- clips : ${clips}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "cas obtenus : ${obtenus} / ${ATTENDUS}, clips : ${clips}"

          # ⚠️ Connecté, ce garde est PLUS FAIBLE, et il faut le savoir plutôt que de le découvrir.
          # Le corpus connecté se choisit par un tag, et rien ne dérive encore le nombre de cas qu'il
          # cite : on ne peut donc pas dire « il en manque un ». On vérifie qu'il a produit quelque
          # chose, ce qui attrape un tournage entièrement mort, et rien de plus. Dériver ce compte est
          # une suite (#4307).
          if [ "${CONNECTE}" = "true" ]; then
            {
              echo
              echo "⚠️ Tournage connecté : l'oracle exhaustif ne s'applique pas. Le corpus est choisi"
              echo "par un tag, pas par une session, et son nombre de cas n'est pas dérivé. Ce passage"
              echo "vérifie seulement qu'au moins un cas est sorti."
            } >> "${GITHUB_STEP_SUMMARY}"
            [ "${obtenus}" -ge 1 ] || {
              echo "::error::Aucun cas indexé : le tournage connecté n'a rien produit."
              exit 1
            }
            exit 0
          fi

          [ "${obtenus}" -eq "${ATTENDUS}" ] || {
            echo "::error::${obtenus} cas sur ${ATTENDUS} : le tournage est incomplet."
            exit 1
          }

      - name: Garder les clips en artefact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clips-${{ inputs.session }}-${{ inputs.plateforme }}
          path: |
            target/recette/clips/
            tournage.log
          retention-days: 14

  # ------------------------------------------------------------------------------------------------
  # Le versement, dans un job SÉPARÉ, pour la même raison que côté bash : le job qui filme exécute
  # les tests du produit, donc du code qui change à chaque PR. Lui donner le droit d'écrire dans le
  # dépôt élargirait la surface pour une commodité. Celui-ci ne fait que reprendre l'artefact.
  #
  # ⚠️ Il ne verse QUE sur le tag, jamais sur une pré-version roulante. `clips-java` est un
  # INSTANTANÉ daté, celui que la page de comparaison des deux bancs interroge : la faire écraser par
  # le train rendrait cette page fausse du jour au lendemain (#4258).
  #
  # ⚠️ Et il ne s'exécute que si `filmer` a réussi. C'est ce qui donne au banc Java la garantie que le
  # banc bash ne sait pas donner : son étape « Chaque cas de la session a sa ligne » compare les cas
  # OBTENUS aux cas ATTENDUS et échoue s'il en manque un. Un tournage amputé ne peut donc pas se
  # graver sur un tag immuable.
  # ------------------------------------------------------------------------------------------------
  # ⚠️ Un JOB, et non un pas du job qui filme. Un pas ne s'exécute pas quand le job qui le porte a été
  # ANNULÉ ou a atteint son butoir de quatre-vingt-dix minutes - deux cas où le jeton a pourtant vécu,
  # et où il resterait valide ses quatorze jours.
  #
  # ⚠️ `always()`, et non `success()` : le run qu'on ira regarder est justement celui qui a mal tourné,
  # donc celui dont l'artefact sera ouvert. Et la condition NOMME cet état plutôt que de le laisser
  # deviner : sans fonction d'état, GitHub enveloppe la condition en `success() && (...)` sur tout le
  # graphe amont, et ce job serait sauté le jour où il sert le plus (ADR 4079, la 2.186.0).
  revoquer:
    name: Révoquer le jeton du tournage
    needs: filmer
    if: ${{ always() && inputs.connecte }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ⚠️ Le verdict sort du job, parce que le versement en dépend : depuis #4324 le clip MONTRE le
    # jeton, et ce qui rend cela sans conséquence est qu'il soit mort. « Mort » doit donc être un fait
    # confirmé par la plateforme, pas une hypothèse sur ce que le job a probablement fait.
    outputs:
      revoque: ${{ steps.retrait.outputs.revoque }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rendre le jeton inutilisable
        id: retrait
        shell: bash
        env:
          JETON: ${{ secrets.VIGIECHIRO_TOKEN_TOURNAGE }}
        run: |
          chmod +x .github/scripts/revoque-jeton.sh
          ./.github/scripts/revoque-jeton.sh

  # ------------------------------------------------------------------------------------------------
  # ⚠️ Une pré-version À PART, et c'est tout l'objet de #4306. Des données vivantes font bouger l'écran
  # sans qu'aucun commit ait changé : le plancher de bruit de `compare-tournages.sh` mesurerait alors la
  # plateforme et non le rendu. Verser ces clips sur `clips-recette` ou à côté des `java-` d'un tag
  # ferait se contredire deux dispositifs EN SILENCE, puisque tous deux produisent des clips valides.
  #
  # ⚠️ Et contrairement à la révocation, ce job ne part QUE si le tournage a réussi. Un jeton doit
  # mourir dans tous les cas ; un tournage amputé, lui, n'a pas à se publier.
  publier-connecte:
    name: Verser les clips connectés sur leur pré-version
    # ⚠️ Il attend AUSSI la révocation, et pas seulement le tournage. Depuis #4324 le clip montre le
    # jeton collé - c'est ce qui le rend lisible, et c'est sans conséquence tant que le jeton est mort.
    # Publier avant d'en être sûr échangerait un clip illisible contre un secret vivant sur une
    # pré-version publique.
    needs: [filmer, revoquer]
    if: ${{ success() && inputs.connecte && needs.revoquer.outputs.revoque == 'oui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Reprendre les clips du tournage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clips-${{ inputs.session }}-${{ inputs.plateforme }}
          path: repris

      - name: Ouvrir la pré-version, et dire ce qu elle montre
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SESSION: ${{ inputs.session }}
          PLATEFORME: ${{ inputs.plateforme }}
        run: |
          set -euo pipefail
          corps=$(cat <<'FIN'
          Clips tournés contre la **vraie** plateforme Vigie-Chiro, en lecture seule.

          ⚠️ **Ils ne se comparent pas aux autres.** Leur écran dépend de données vivantes : deux
          tournages du même commit peuvent différer parce qu'une nuit a été traitée entre les deux.
          `comparer-tournages.yml` refuse donc cette source, et c'est délibéré.

          Ce qu'ils apportent, et qu'un tournage sur fixtures ne peut pas donner : les cas dont le
          verdict se lit **hors de l'application** cessent d'être filmés contre une frontière
          bouchonnée. Un clip bouchonné y serait convaincant et creux.

          Comment les lire : `dev-docs/recette/clips-connectes.md`.
          FIN
          )
          corps="${corps}"$'\n\n'"Dernier versement : ${SESSION} sur ${PLATEFORME}, le $(date -u +%F) à $(date -u +%H:%M) UTC."
          if gh release view clips-connectes >/dev/null 2>&1; then
            gh release edit clips-connectes --notes "${corps}"
          else
            gh release create clips-connectes \
              --prerelease \
              --title "Clips tournés contre la plateforme (roulant)" \
              --notes "${corps}"
          fi

      - name: Verser les clips et leur index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          clips=(repris/target/recette/clips/*.mp4)
          [ -e "${clips[0]}" ] || {
            echo "::error::Aucun clip mp4 dans l'artefact repris. Arborescence trouvée :"
            find repris -type f | head -20
            exit 1
          }
          # ⚠️ Pas de préfixe, et ce n'est pas un oubli : la SÉPARATION est portée par la pré-version
          # elle-même. Un préfixe servirait à distinguer deux populations rangées au même endroit ;
          # ici il n'y en a qu'une, et le nom nu garde les adresses lisibles depuis la page.
          gh release upload clips-connectes "${clips[@]}" --clobber
          if [ -f repris/target/recette/clips/index.md ]; then
            gh release upload clips-connectes repris/target/recette/clips/index.md --clobber
          fi
          echo "${#clips[@]} clip(s) versé(s) sur « clips-connectes »." >> "${GITHUB_STEP_SUMMARY}"

  publier:
    name: Verser les clips Java sur le tag de la version
    needs: filmer
    if: ${{ inputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Reprendre les clips du tournage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clips-${{ inputs.session }}-${{ inputs.plateforme }}
          path: repris

      - name: Verser les clips sur le tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PLATEFORME: ${{ inputs.plateforme }}
        run: |
          set -euo pipefail
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::La version ${VERSION} n'a pas de release : rien à quoi attacher les clips."
            exit 1
          fi

          # ⚠️ `target/recette/clips/`, et non `clips/`. L'action d'envoi range les fichiers sous leur
          # plus petit ancêtre commun, et `tournage.log` vit à la racine du workspace : l'archive
          # conserve donc le chemin entier. Vérifié sur un artefact rapatrié, pas déduit.
          clips=(repris/target/recette/clips/*.mp4)
          [ -e "${clips[0]}" ] || {
            echo "::error::Aucun clip mp4 dans l'artefact repris. Arborescence trouvée :"
            find repris -type f | head -20
            exit 1
          }

          # ⚠️ Le PRÉFIXE. Les deux bancs nomment leurs pièces à l'identique - 50 noms communs sur 51,
          # mesuré - et les verser tous deux sans préfixe les ferait s'écraser EN SILENCE.
          rm -rf versionnes && mkdir -p versionnes
          for clip in "${clips[@]}"; do
            cp "${clip}" "versionnes/java-$(basename "${clip}")"
          done

          {
            echo "> Clips du banc **Java** pour la **${VERSION}**, tournés sur \`${PLATEFORME}\`"
            echo "> le $(date -u +%F) à $(date -u +%H:%M) UTC."
            echo ">"
            echo "> **${#clips[@]} clips**. Le tournage a été vérifié COMPLET : le job qui filme"
            echo "> compare les cas obtenus aux cas attendus et échoue s'il en manque un."
            echo
          } > versionnes/java-index.md
          if [ -f repris/target/recette/clips/index.md ]; then
            cat repris/target/recette/clips/index.md >> versionnes/java-index.md
          fi

          gh release upload "${VERSION}" versionnes/* --clobber
          echo "${#clips[@]} clip(s) versé(s) sur « ${VERSION} », préfixés « java- »."
