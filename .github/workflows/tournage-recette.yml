# Tourner les clips d'UNE session, sur la plateforme de son choix (#4163).
#
# ## Pourquoi ce workflow existe
#
# L'EPIC #4133 s'était donné une limite à surveiller : « le tournage met une dizaine de minutes pour
# 45 clips ; à 400, ce serait des heures par passage, et le dispositif changerait de nature. Il
# faudra probablement filmer par session plutôt que tout à chaque fois. »
#
# Le banc filmé en Java pur le rend possible, et pour deux raisons qui n'ont rien à voir l'une avec
# l'autre. Il photographie le graphe de scène, donc il tourne là où il n'y a ni serveur X ni
# gestionnaire de fenêtres - Windows et macOS compris, ce que le banc bash ne peut pas. Et il écrit
# un fichier par test, donc restreindre le tournage se réduit à un `-Dtest=`.
#
# ## Ce qu'il ne fait pas
#
# ⚠️ Il ne PUBLIE pas. Les clips restent en artefact. La pré-version `clips-recette` reste alimentée
# par `recette-filmee.yml`, et le sort du banc bash se décide à part, les deux bancs comparés sur la
# même tournage. Deux dispositifs qui publieraient au même endroit se contrediraient tôt ou tard.
#
# ## Le garde, et pourquoi il porte sur les CAS
#
# ⚠️ Compter les clips ne prouverait rien : un tournage qui rend « des clips » peut en avoir perdu la
# moitié. Ce qui se vérifie, c'est que chaque cas CITÉ de la session a bien sa ligne dans l'index.
# Le nombre attendu ne se devine pas non plus : il est dérivé par `CorrespondanceRecetteTest`, qui
# balaie le classpath, et déposé dans `sessions-a-filmer.tsv` à côté des classes.

name: tournage de recette

run-name: "tournage ${{ inputs.session }} sur ${{ inputs.plateforme }}"

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Session à filmer (« toutes » pour tous les cas cités)"
        type: choice
        default: "S6"
        options:
          - "toutes"
          - "S1"
          - "S2"
          - "S3"
          - "S4"
          - "S5"
          - "S6"
          - "S7"
          - "S8"
          - "S9"
          - "S10"
          - "S11"
      plateforme:
        description: "Où filmer"
        type: choice
        default: "ubuntu"
        options:
          - "ubuntu"
          - "windows"
          - "macos"

  # ⚠️ Un second bloc, et non le même : `workflow_call` ne connaît pas `type: choice`. Les valeurs
  # possibles restent celles de la liste ci-dessus, et c'est l'appelant qui en répond.
  #
  # Le train appelle ce workflow pour PRÉPARER LA TRANSITION vers le banc Java : les deux bancs
  # filment la même version, le bash verse ses clips préfixés `bash-` et celui-ci les siens préfixés
  # `java-`, sur le même tag. Le jour où le sort du banc bash sera tranché, il n'y aura qu'un appel à
  # retirer (#4258).
  workflow_call:
    inputs:
      session:
        description: "Session à filmer (« toutes » pour tous les cas cités)"
        type: string
        default: "toutes"
      plateforme:
        description: "Où filmer"
        type: string
        default: "ubuntu"
      version:
        description: "Le tag de la version que ces clips montrent. Vide : rien n'est versé."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ⚠️ Le runner se CALCULE, il ne se filtre pas. Une matrice filtrée par `if:` laisserait des jobs
  # démarrer pour ne rien faire, et une pastille verte qui ne dit pas si la plateforme a été
  # éprouvée ou seulement visitée. Même parti que `suite-sous-windows-et-macos.yml`.
  choisir:
    name: Où filmer ?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runner: ${{ steps.calcul.outputs.runner }}
    steps:
      - name: Traduire la plateforme en runner
        id: calcul
        shell: bash
        run: |
          set -euo pipefail
          # ⚠️ Le cas par défaut REFUSE, il ne se rabat pas. Tant que ce workflow n'était appelé qu'à
          # la main, la liste de choix rendait une valeur inconnue impossible. Depuis qu'il est
          # appelable (`workflow_call`), l'entrée est une chaîne libre : un `*) ubuntu` filmerait
          # alors sur Linux une demande de tournage Windows, et le rapport dirait « windows » dans son
          # titre. Un repli silencieux rend un résultat qui a l'air juste (ADR 0008).
          case "${{ inputs.plateforme }}" in
            ubuntu)  runner="ubuntu-latest" ;;
            windows) runner="windows-latest" ;;
            macos)   runner="macos-latest" ;;
            *)
              echo "::error::Plateforme inconnue : « ${{ inputs.plateforme }} ». Attendu : ubuntu, windows ou macos."
              exit 1
              ;;
          esac
          echo "runner=${runner}" >> "${GITHUB_OUTPUT}"
          echo "Tournage de ${{ inputs.session }} sur ${runner}." >> "${GITHUB_STEP_SUMMARY}"

  filmer:
    name: Filmer ${{ inputs.session }}
    needs: choisir
    # ⚠️ `needs.choisir.result == 'success'` est implicite ici : sans le runner calculé, ce job n'a
    # pas de machine où tourner, donc il ne doit pas démarrer.
    runs-on: ${{ needs.choisir.outputs.runner }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      # ⚠️ On CONSTATE avant d'installer. Aucune des trois images GitHub ne porte `ffmpeg`, mais
      # cela peut changer, et un pas d'installation qui devient inutile se voit ici plutôt que de
      # coûter vingt secondes à chaque tournage sans que personne ne le sache.
      - name: ffmpeg est-il déjà là ?
        id: ffmpeg
        shell: bash
        run: |
          set -uo pipefail
          if chemin=$(command -v ffmpeg); then
            echo "présent sur l'image : ${chemin}"
            echo "installe=deja" >> "${GITHUB_OUTPUT}"
          else
            echo "absent de l'image ; il faut l'installer."
            echo "installe=manquant" >> "${GITHUB_OUTPUT}"
          fi

      - name: Installer ffmpeg (macOS)
        if: ${{ steps.ffmpeg.outputs.installe == 'manquant' && runner.os == 'macOS' }}
        shell: bash
        run: brew install ffmpeg

      - name: Installer ffmpeg (Windows)
        if: ${{ steps.ffmpeg.outputs.installe == 'manquant' && runner.os == 'Windows' }}
        shell: pwsh
        run: choco install ffmpeg --no-progress --yes

      - name: Cache des .deb (le dépaquetage, lui, se refait)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          key: apt-${{ runner.os }}-tournage-recette

      # ⚠️ `installer-paquets.sh`, et non `apt-get` en direct : `verifie-apt.sh` refuse la seconde
      # forme, et exige le cache ci-dessus avec son `APT_CACHE`.
      - name: Installer ffmpeg (Linux)
        if: ${{ steps.ffmpeg.outputs.installe == 'manquant' && runner.os == 'Linux' }}
        shell: bash
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: bash .github/scripts/installer-paquets.sh ffmpeg

      # La liste ne se maintient pas à la main : elle est DÉRIVÉE du classpath, cas par cas.
      # ⚠️ Les entrées passent par `env:` et non par interpolation dans le shell. Elles viennent
      # d'une liste fermée, donc rien ne peut s'y glisser aujourd'hui ; l'habitude, elle, se prend
      # avant le jour où quelqu'un rendra l'entrée libre.
      #
      # ⚠️ Tout se lit en `awk` : `bc` n'existe pas sur le Git Bash des runners Windows, et une
      # tabulation littérale dans un motif `grep` ne survit pas au YAML.
      - name: Dériver les classes de la session
        id: liste
        shell: bash
        env:
          SESSION: ${{ inputs.session }}
        run: |
          set -euo pipefail
          ./mvnw -B -q test --file pom.xml -Dtest=CorrespondanceRecetteTest -DfailIfNoTests=false
          derive=target/recette/sessions-a-filmer.tsv
          [ -s "${derive}" ] || { echo "::error::${derive} est absent ou vide : la dérivation n'a rien produit."; exit 1; }

          if [ "${SESSION}" = "toutes" ]; then
            classes=$(awk -F'\t' '{print $3}' "${derive}" | tr ',' '\n' | sort -u | paste -sd,)
            attendus=$(awk -F'\t' '{s += $2} END {print s + 0}' "${derive}")
          else
            classes=$(awk -F'\t' -v s="${SESSION}" '$1 == s {print $3}' "${derive}")
            attendus=$(awk -F'\t' -v s="${SESSION}" '$1 == s {print $2}' "${derive}")
            # ⚠️ Une session SANS cas cité n'est pas une panne du dispositif : c'est l'état du
            # dépôt, et la plupart des sessions y sont encore. On le dit et on s'arrête, plutôt que
            # de lancer un tournage qui rendrait zéro clip et un garde qui ne saurait quoi conclure.
            [ -n "${classes}" ] || { echo "::error::${SESSION} ne cite aucun cas : il n'y a rien à filmer."; exit 1; }
          fi

          echo "classes=${classes}" >> "${GITHUB_OUTPUT}"
          echo "attendus=${attendus}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Tournage ${SESSION} sur ${{ needs.choisir.outputs.runner }}"
            echo
            echo "- cas attendus : ${attendus}"
            echo "- classes : \`${classes}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ⚠️ `failure.ignore` : on veut les CLIPS. Un cas qui rougit produit son clip comme les autres,
      # et c'est même celui-là qu'on veut regarder. Subordonner le tournage au vert de la session
      # rendrait les clips otages d'une condition sans rapport avec ce qu'ils servent à juger.
      #
      # Aucun `forkCount` imposé : filmer le graphe de scène n'exige pas un écran unique, et
      # `IndexDesCas` fusionne les fragments de toutes les JVM.
      #
      # ⚠️ La détection automatique n'est pas un détail de confort : sans elle, seules les classes
      # qui portent encore `@ExtendWith(EnregistreurDeFilm.class)` sont filmées, c'est-à-dire les
      # quatre scénarios perceptifs de #3791. Mesuré sur le premier tournage de `S1` : **3 cas sur
      # 37**. Ni `S6` ni `S4` ne pouvaient le révéler - leurs seules classes sont justement celles
      # qui portent l'annotation, et les deux étaient vertes.
      #
      # Ce qui la rend sûre est ailleurs : `EnregistreurDeFilm.aFilmer` écarte les tests qui ne
      # citent aucun cas (#4162). Sans ce filtre, la même ligne rendrait des centaines de clips de
      # carton.
      - name: Filmer
        shell: bash
        run: |
          set -uo pipefail
          ./mvnw -B test --file pom.xml \
            -Dtest='${{ steps.liste.outputs.classes }}' \
            -DfailIfNoTests=false \
            -Dmaven.test.failure.ignore=true \
            -Djunit.jupiter.extensions.autodetection.enabled=true \
            -Drecette.film \
            2>&1 | tee tournage.log
          echo "Maven a rendu ${PIPESTATUS[0]} ; le verdict est pris à l'étape suivante."

      # ⚠️ Le garde porte sur les CAS, pas sur le nombre de fichiers. Un tournage qui rend « des
      # clips » peut en avoir perdu la moitié, et un compte de fichiers ne le dirait pas.
      - name: Chaque cas de la session a sa ligne
        shell: bash
        env:
          SESSION: ${{ inputs.session }}
          ATTENDUS: ${{ steps.liste.outputs.attendus }}
        run: |
          set -uo pipefail
          index=target/recette/clips/index.md
          [ -s "${index}" ] || { echo "::error::index absent : le tournage n'a rien indexé."; exit 1; }

          if [ "${SESSION}" = "toutes" ]; then
            motif='^S[0-9]+-'
          else
            motif="^${SESSION}-"
          fi
          # La première colonne du tableau, dédoublonnée : un cas joué par deux tests a deux lignes.
          # ⚠️ La sortie est CAPTURÉE avant d'être comptée : sous `pipefail`, un `grep` en bout de
          # tube ne dit rien du code de ce qui est à sa gauche, et un index illisible se compterait
          # comme un index vide.
          colonne=$(grep -E '^\| S' "${index}" | cut -d'|' -f2 | tr -d ' ' || true)
          obtenus=$(printf '%s\n' "${colonne}" | grep -E "${motif}" | sort -u | wc -l || true)
          clips=0
          for clip in target/recette/clips/*.mp4; do
            [ -e "${clip}" ] || continue
            clips=$((clips + 1))
          done

          {
            echo "- cas obtenus : ${obtenus} / ${ATTENDUS}"
            echo "- clips : ${clips}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "cas obtenus : ${obtenus} / ${ATTENDUS}, clips : ${clips}"
          [ "${obtenus}" -eq "${ATTENDUS}" ] || {
            echo "::error::${obtenus} cas sur ${ATTENDUS} : le tournage est incomplet."
            exit 1
          }

      - name: Garder les clips en artefact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clips-${{ inputs.session }}-${{ inputs.plateforme }}
          path: |
            target/recette/clips/
            tournage.log
          retention-days: 14

  # ------------------------------------------------------------------------------------------------
  # Le versement, dans un job SÉPARÉ, pour la même raison que côté bash : le job qui filme exécute
  # les tests du produit, donc du code qui change à chaque PR. Lui donner le droit d'écrire dans le
  # dépôt élargirait la surface pour une commodité. Celui-ci ne fait que reprendre l'artefact.
  #
  # ⚠️ Il ne verse QUE sur le tag, jamais sur une pré-version roulante. `clips-java` est un
  # INSTANTANÉ daté, celui que la page de comparaison des deux bancs interroge : la faire écraser par
  # le train rendrait cette page fausse du jour au lendemain (#4258).
  #
  # ⚠️ Et il ne s'exécute que si `filmer` a réussi. C'est ce qui donne au banc Java la garantie que le
  # banc bash ne sait pas donner : son étape « Chaque cas de la session a sa ligne » compare les cas
  # OBTENUS aux cas ATTENDUS et échoue s'il en manque un. Un tournage amputé ne peut donc pas se
  # graver sur un tag immuable.
  publier:
    name: Verser les clips Java sur le tag de la version
    needs: filmer
    if: ${{ inputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Reprendre les clips du tournage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clips-${{ inputs.session }}-${{ inputs.plateforme }}
          path: repris

      - name: Verser les clips sur le tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PLATEFORME: ${{ inputs.plateforme }}
        run: |
          set -euo pipefail
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::La version ${VERSION} n'a pas de release : rien à quoi attacher les clips."
            exit 1
          fi

          # ⚠️ `target/recette/clips/`, et non `clips/`. L'action d'envoi range les fichiers sous leur
          # plus petit ancêtre commun, et `tournage.log` vit à la racine du workspace : l'archive
          # conserve donc le chemin entier. Vérifié sur un artefact rapatrié, pas déduit.
          clips=(repris/target/recette/clips/*.mp4)
          [ -e "${clips[0]}" ] || {
            echo "::error::Aucun clip mp4 dans l'artefact repris. Arborescence trouvée :"
            find repris -type f | head -20
            exit 1
          }

          # ⚠️ Le PRÉFIXE. Les deux bancs nomment leurs pièces à l'identique - 50 noms communs sur 51,
          # mesuré - et les verser tous deux sans préfixe les ferait s'écraser EN SILENCE.
          rm -rf versionnes && mkdir -p versionnes
          for clip in "${clips[@]}"; do
            cp "${clip}" "versionnes/java-$(basename "${clip}")"
          done

          {
            echo "> Clips du banc **Java** pour la **${VERSION}**, tournés sur \`${PLATEFORME}\`"
            echo "> le $(date -u +%F) à $(date -u +%H:%M) UTC."
            echo ">"
            echo "> **${#clips[@]} clips**. Le tournage a été vérifié COMPLET : le job qui filme"
            echo "> compare les cas obtenus aux cas attendus et échoue s'il en manque un."
            echo
          } > versionnes/java-index.md
          if [ -f repris/target/recette/clips/index.md ]; then
            cat repris/target/recette/clips/index.md >> versionnes/java-index.md
          fi

          gh release upload "${VERSION}" versionnes/* --clobber
          echo "${#clips[@]} clip(s) versé(s) sur « ${VERSION} », préfixés « java- »."
