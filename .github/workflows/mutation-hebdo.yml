# Mesure hebdomadaire de la qualité des tests par mutation (PIT).
#
# Ce que PIT dit et que la couverture ne dit pas : si les tests **détectent** un changement de
# comportement. Le rendement est mesuré, pas supposé - sur ce dépôt, deux classes mutation-testées
# pendant #2554 ont donné trois défauts réels puis deux issues (#2638, #2639).
#
# Hebdomadaire et non par PR, pour deux raisons. PIT est **lent** : plus de dix minutes sur un seul
# paquet, donc des heures sur le dépôt entier. Et un survivant n'est pas un défaut mais une **question**
# posée à un humain (vrai trou, mutant équivalent, artefact de ciblage) : bloquer une fusion là-dessus
# ferait cocher au hasard.
#
# ⚠️ PÉRIMÈTRE : les paquets `model`, et JAMAIS les E2E côté tests. Les deux décisions sont mesurées,
# pas supposées (#2768) :
#
#   - un E2E est **large en couverture et pauvre en jugement**. `ParcoursDepotE2ETest` couvre à lui seul
#     8 539 blocs : PIT le retient comme test candidat pour des mutants situés dans des centaines de
#     classes, et rejoue le parcours entier - des minutes de TestFX - pour apprendre ce qu'un test
#     unitaire dit en millisecondes. Le premier passage sur le dépôt entier a produit 19 expirations en
#     une heure, toutes autour de ce parcours ;
#   - les exclure ne **cache** rien. Un mutant que seul un E2E tuerait est, par définition, un mutant
#     qu'aucun test unitaire ne détecte : il ressort désormais en SURVIVANT, c'est-à-dire en question
#     posée à un humain. C'est ce que ce rapport doit produire.
#
# Les classes de **vue** ont leur propre mesure : `mutation-ihm.yml`. Elles ne sont pas oubliées, elles
# sont mesurées ailleurs, avec des tests qui les jugent.
#
# NON BLOQUANT, comme le rapport ADR dont ce workflow est le calque : ici on observe, on ne juge pas.
#
# ⚠️ Le `test-compile` avant le but n'est pas une commodité : sans phase, `@{jacocoArgLine}` et
# `${net.bytebuddy:byte-buddy-agent:jar}` restent littérales dans l'argLine héritée de surefire, le
# minion reçoit un `-javaagent` inexistant et meurt sur un `MINION_DIED` muet. Ce piège a fait conclure
# une fois que PIT était incompatible avec ce dépôt (#2605).

name: mutation-hebdo

on:
  schedule:
    # Lundi 7 h UTC : une heure après le rapport ADR, pour que les deux bilans arrivent ensemble sans
    # se disputer les runners.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      perimetre:
        description: "Classes à muter (motif PIT)"
        required: false
        default: "fr.univ_amu.iut.*.model.*"

permissions:
  contents: read

jobs:
  mesurer:
    name: Mutation sur le dépôt
    runs-on: ubuntu-latest
    # Chaque lundi repart de zéro (voir « analyse incrémentale » ci-dessous) : le dépôt entier prend des
    # heures. La borne évite qu'un blocage consomme la journée.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          check-latest: false
          cache: maven

      - name: Mesurer
        id: mesure
        env:
          PERIMETRE: ${{ inputs.perimetre || 'fr.univ_amu.iut.*.model.*' }}
        run: |
          set -euo pipefail
          # Headless : les propriétés vivent dans le profil `mutation` du pom (le minion n'hérite pas
          # des systemPropertyVariables de surefire). Ne pas les repasser ici - `-DjvmArgs` REMPLACE
          # la liste du profil au lieu de s'y ajouter.
          #
          # ⚠️ PAS d'analyse incrémentale. `historyInputFile`/`historyOutputFile` existent bien dans le
          # descripteur du greffon Maven - c'est ce qui avait été vérifié - mais depuis PIT 1.25.x le
          # STOCKAGE de l'historique est un greffon **commercial** (arcmutate). Les passer sans lui ne
          # les fait pas ignorer : PIT **refuse de démarrer** sur « History has been enabled but no
          # history plugin has been installed/activated », et le job entier échoue en 25 secondes.
          # Reproductible en local sur une seule classe. Conséquence (mesure intégrale chaque lundi) : #2768.
          ./mvnw -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage \
            -DtargetClasses="$PERIMETRE" \
            -DtargetTests="fr.univ_amu.iut.*" \
            -DexcludedTestClasses="fr.univ_amu.iut.e2e.*"

      - name: Publier le bilan dans le résumé du job
        if: always()
        run: |
          set -uo pipefail
          # Volontairement sans `-e` : ce job OBSERVE. Un bilan manquant se dit, il ne se solde pas par
          # un job rouge - sans quoi « non bloquant » ne serait vrai que les bonnes semaines.
          if python3 scripts/qualite/rapport_mutation.py --markdown >> "$GITHUB_STEP_SUMMARY"; then
            exit 0
          fi
          # Un bilan absent ou illisible serait lu comme « zéro survivant ». On le dit, plutôt que de
          # laisser un résumé vide passer pour une bonne nouvelle.
          {
            echo "## Mutation (PIT)"
            echo
            echo "La mesure n'a pas abouti : aucun rapport lisible cette semaine."
            echo
            echo "Ce n'est **pas** « zéro survivant » : c'est une absence de mesure."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Bilan de mutation absent ou illisible - une absence de mesure, pas un dépôt sain."

      # Le rapport HTML permet de descendre au mutant, ligne par ligne, quand le résumé pose une
      # question qui mérite qu'on l'ouvre.
      - name: Conserver le rapport détaillé
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: target/pit-reports/
          retention-days: 30
          if-no-files-found: ignore
