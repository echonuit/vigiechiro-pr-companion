# Garde-fou de la prose publiée sur la forge : le corps de la PR est ce qu'atteint quiconque remonte
# depuis `git log`, et il n'est jamais commis, donc aucun garde du dépôt ne pouvait le refuser. La
# règle et son pourquoi sont dans .github/scripts/verifie_corps_pr.py et l'ADR 4453.
name: Corps de PR

on:
  pull_request:
    # `edited` est indispensable : sans lui, corriger le corps d'une PR déjà ouverte ne relancerait
    # jamais le contrôle, et la PR resterait rouge sur un corps devenu conforme. C'est le même
    # raisonnement que pour le titre, et le même piège.
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Le garde du chantier lit le `parent` de l issue que la demande ferme. Lecture seule, et sur les
  # issues uniquement : il ne touche à rien.
  issues: read

jobs:
  corps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Le corps suit la grille de prose
        env:
          # Passé par l'environnement plutôt qu'interpolé dans le script : un corps de PR est une
          # donnée non fiable, et il porte par nature des backticks, des quotes et des `$(...)`.
          CORPS: ${{ github.event.pull_request.body }}
        run: |
          chmod +x .github/scripts/verifie_corps_pr.py
          python3 .github/scripts/verifie_corps_pr.py "${CORPS}"

      - name: "L issue fermée appartient à un chantier (bloquant, #4649)"
        # Il vit ici et non dans `lint.yml` parce qu il lui faut le CORPS de la demande, que seul cet
        # évènement porte. Il ne juge que l issue que CETTE demande ferme : un balayage de toutes les
        # issues rougirait chez tout le monde pendant qu une seule attend son rattachement, ce que
        # l en-tête de `verifie_cloture_consignee.py` dit avoir voulu éviter.
        #
        # Rattacher l issue ne modifie pas la demande, donc `edited` ne se déclenche pas : la
        # correction se relit en relançant ce job, ou à la poussée suivante.
        env:
          CORPS: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/verifie_chantier_de_l_issue.py "${CORPS}"
