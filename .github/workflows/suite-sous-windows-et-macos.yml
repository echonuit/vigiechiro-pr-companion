# Que donne la suite ENTIÈRE sous Windows et macOS ? Personne ne le sait : elle n'y a jamais tourné.
#
# Ce workflow ne programme rien et ne bloque rien. Il **compte**, et c'est tout ce qu'on lui demande
# pour l'instant (étape 1 de #3526). Les étapes suivantes - rendre les fixtures portables, programmer
# l'exécution, brancher le train de publication - dépendent toutes du chiffre qu'il produit, et les
# décider avant de l'avoir serait décider sans savoir.
#
# ⚠️ Il était manuel au départ, délibérément : un `schedule` posé avant le tri aurait rougi dès sa
# première nuit sur du bruit de fixture, et un dispositif qui commence par du bruit devient un onglet
# qu'on ferme. Les onze échecs relevés à l'étape 1 sont corrigés, donc il se programme (#3526).
name: Suite complète sous Windows et macOS

on:
  # ⚠️ Le MARDI, la veille du train du mercredi 6 h. La preuve est ainsi fraîche de moins de 24 h **au
  # moment précis où elle sert de condition** - et non « quotidienne » comme l'issue le proposait
  # d'abord : chaque passage coûte ~1 h 40 de machine (48 min par plateforme), et une preuve d'hier ne
  # vaut pas mieux qu'une preuve d'avant-hier si le train ne part que le lendemain.
  #
  # Le prix est qu'une régression peut vivre une semaine avant d'être vue. Elle ne sera jamais
  # **publiée**, ce qui est le risque qu'on couvre ici.
  schedule:
    - cron: "0 6 * * 2"
  # Conservé : un doute n'attend pas le mardi, et depuis #3754 une question ciblée coûte trois minutes.
  workflow_dispatch:
    inputs:
      classes:
        description: "Classes à éprouver (vide = toute la suite). Ex : VerrouWorkspaceTest,CliTest"
        required: false
        type: string
        default: ""
      plateformes:
        description: "Où l'éprouver"
        required: false
        type: choice
        default: "les deux"
        options:
          - "les deux"
          - "windows seulement"
          - "macos seulement"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ⚠️ La matrice se calcule, elle ne se filtre pas. Un `if:` sur les étapes laisserait le job démarrer
  # pour ne rien faire - une machine allumée, un artefact vide, et une pastille verte qui ne dit pas si
  # la plateforme a été éprouvée ou seulement visitée.
  choisir:
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.calcul.outputs.matrice }}
    steps:
      - name: Sur quelles plateformes ?
        id: calcul
        shell: bash
        run: |
          case "${{ inputs.plateformes }}" in
            "windows seulement") matrice='["windows-latest"]' ;;
            "macos seulement")   matrice='["macos-latest"]' ;;
            *)                   matrice='["windows-latest","macos-latest"]' ;;
          esac
          echo "matrice=${matrice}" >> "${GITHUB_OUTPUT}"
          echo "Plateformes retenues : ${matrice}" >> "${GITHUB_STEP_SUMMARY}"

  denombrer:
    name: denombrer (${{ matrix.os }})
    needs: choisir
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.choisir.outputs.matrice) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      # ⚠️ `failure.ignore` : on veut le DÉNOMBREMENT, pas le premier échec. Sans lui la suite
      # s'arrête et ne rend qu'une moitié de compte rendu, c'est-à-dire aucun.
      # ⚠️ `-Dtest=` seulement quand des classes sont demandées : passer `-Dtest=` vide ne veut pas dire
      # « tout » pour surefire, il n'exécute alors plus rien. Le DÉFAUT reste la suite entière - c'est
      # lui que l'étape 3 de #3526 programmera, et une valeur par défaut qui rétrécit sans le dire
      # serait la pire des économies.
      - name: Lancer la suite, sans s'arrêter au premier rouge
        shell: bash
        env:
          CLASSES: ${{ inputs.classes }}
        run: |
          if [ -n "${CLASSES}" ]; then
            ./mvnw -B test --file pom.xml -Dglass.platform=Headless -Dmaven.test.failure.ignore=true \
              -Dtest="${CLASSES}" -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./mvnw -B test --file pom.xml -Dglass.platform=Headless -Dmaven.test.failure.ignore=true
          fi

      # `always()` : c'est justement quand la suite s'est mal passée qu'on veut le tri. Une étape de
      # compte rendu qui ne tourne qu'au vert ne rend compte de rien.
      - name: Trier les échecs, TestFX à part
        if: always()
        shell: bash
        env:
          CLASSES: ${{ inputs.classes }}
        run: ./.github/scripts/trie-les-echecs-de-plateforme.sh

      - name: Conserver les rapports, pour trier plus finement si le compte surprend
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rapports-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 14
