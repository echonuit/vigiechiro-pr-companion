# SPIKE - JETABLE. Ce fichier répond à une question, il ne garde rien.
#
# ## La question
#
# Le banc filmé en Java pur (`src/test/java/fr/univ_amu/iut/recette/film/`) produit-il les neuf
# clips des cas perceptifs sur un runner WINDOWS, et à quoi ressemblent-ils ?
#
# Le banc bash (`lance-test-filme.sh`) ne le peut pas : il filme le bureau X, donc il lui faut Xvfb,
# openbox, xdotool et l'absence de `WAYLAND_DISPLAY`. Aucun de ces quatre n'existe sous Windows, et
# c'est pourquoi la session `s10 · le poste Windows` n'a jamais eu de clips.
#
# Le banc Java photographie le GRAPHE DE SCÈNE (`Scene.snapshot`) dans le mode Monocle headless où
# les tests tournent déjà - le même mode que `suite-sous-windows-et-macos.yml` emploie depuis #3526.
# S'il tient sa promesse, il n'y a rien à installer d'autre que `ffmpeg`.
#
# ## Ce que ce workflow ne fait pas
#
# Il ne remplace pas `recette-filmee.yml` et ne touche pas à la pré-version `clips-recette`. Il verse
# sur une pré-version SÉPARÉE, `clips-windows-spike`, pour qu'un tournage de spike ne puisse pas
# écraser les clips de recette officiels.
#
# ## Ce qu'il faut supprimer si le spike ne donne rien
#
# Ce fichier, `dev-docs/spikes/clips-perceptifs-sous-windows.md`, sa ligne de `mkdocs-dev.yml`, et
# la pré-version `clips-windows-spike`.

name: spike · clips perceptifs sous Windows

run-name: "[spike] clips perceptifs sous Windows"

on:
  # ⚠️ `push` et pas seulement `workflow_dispatch` : un workflow n'apparaît dans l'onglet Actions que
  # s'il existe sur la branche PAR DÉFAUT. Celui-ci vit sur une branche de spike, donc rien ne
  # pourrait le déclencher à la main tant qu'il n'est pas fusionné - et le fusionner pour savoir s'il
  # marche est exactement l'ordre inverse de celui qu'on veut.
  push:
    branches:
      - spike/clips-windows-java
  workflow_dispatch:

# La pré-version du spike s'écrit ici.
permissions:
  contents: write

jobs:
  # ⚠️ La matrice ne sert pas à « couvrir des plateformes ». Elle sert à RÉPONDRE : combien coûte un
  # tournage des cas perceptifs, comparé au banc bash ? Le banc bash ne tourne que sur `ubuntu-latest`.
  # Mesurer le banc Java sur Windows seulement aurait donné un écart où le système d'exploitation et
  # le banc changent en même temps, c'est-à-dire aucun écart interprétable.
  #
  # Le job `ubuntu-latest` existe pour cette raison, et pour elle seule : mêmes classes, mêmes
  # respirations, même runner que le banc bash.
  filmer:
    name: Neuf clips perceptifs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      # ⚠️ On CONSTATE avant d'installer, et on écrit ce qu'on a constaté. Installer d'office
      # rendrait le spike muet sur la seule dépendance qui reste : savoir si l'image GitHub porte
      # déjà `ffmpeg` change la recommandation finale (une étape d'installation de plus, ou aucune).
      - name: ffmpeg est-il déjà là ?
        id: ffmpeg
        shell: bash
        run: |
          set -uo pipefail
          if chemin=$(command -v ffmpeg); then
            echo "présent sur l'image : ${chemin}"
            echo "installe=deja" >> "${GITHUB_OUTPUT}"
          else
            echo "absent de l'image ; il faut l'installer."
            echo "installe=manquant" >> "${GITHUB_OUTPUT}"
          fi

      - name: Installer ffmpeg (Windows)
        if: ${{ steps.ffmpeg.outputs.installe == 'manquant' && runner.os == 'Windows' }}
        shell: pwsh
        run: choco install ffmpeg --no-progress --yes

      - name: Cache des .deb (le dépaquetage, lui, se refait)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          key: apt-${{ runner.os }}-spike-clips

      # ⚠️ `installer-paquets.sh`, et non `apt-get` en direct : `verifie-apt.sh` refuse la seconde
      # forme, et il a raison - le post-installation des polices en dépend ailleurs. Le même garde
      # exige le cache ci-dessus et `APT_CACHE` : sans eux, l'étape retélécharge tout à chaque run.
      - name: Installer ffmpeg (Linux)
        if: ${{ steps.ffmpeg.outputs.installe == 'manquant' && runner.os == 'Linux' }}
        shell: bash
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: bash .github/scripts/installer-paquets.sh ffmpeg

      - name: Ce que ffmpeg dit de lui-même
        shell: bash
        run: ffmpeg -version | head -1

      # ⚠️ AUCUN `forkCount` imposé, et c'est délibéré. `recette-filmee` doit en poser un parce qu'un
      # seul écran X n'accueille qu'une JVM ; filmer le graphe de scène retire cette contrainte, et
      # le défaut de `IndexDesCas` qui l'a un temps réimposée est corrigé (fragments par JVM,
      # fusionnés sous verrou).
      #
      # Ce tournage tourne donc au `1C` du dépôt, et le garde ci-dessous vérifie que l'index en
      # ressort ENTIER. C'est la seule façon d'éprouver le correctif : à `forkCount=1` il n'y a
      # qu'un fragment, et le dispositif de fusion ne fusionne rien.
      #
      # ⚠️ `failure.ignore` : on veut les CLIPS. Un cas qui rougit produit son clip comme les autres,
      # et c'est même celui-là qu'on veut regarder. Ce qui fait échouer ce job, c'est l'absence de
      # clip, et c'est l'étape suivante qui le dit.
      - name: Filmer les quatre classes perceptives
        shell: bash
        run: |
          set -uo pipefail
          ./mvnw -B test --file pom.xml \
            -Dtest='ScenarioPerceptifConnexionTest,ScenarioPerceptifFiltresTest,ScenarioPerceptifRefusDepotTest,ScenarioPerceptifRecuperationCarreTest' \
            -DfailIfNoTests=false \
            -Dmaven.test.failure.ignore=true \
            -Drecette.film \
            2>&1 | tee tournage.log
          echo "Maven a rendu ${PIPESTATUS[0]} ; le verdict de ce job est pris à l'étape suivante."

      # Le seul garde de ce job, et il porte sur ce que le spike cherche : NEUF clips, et aucun qui
      # se réduise à son carton.
      #
      # ⚠️ On lit le journal DEPUIS UN FICHIER, pas au travers d'un tube. Sous `pipefail`, un `grep`
      # au bout d'un tube ne dit rien du code de ce qui est à sa gauche, et un tournage qui n'a rien
      # écrit passerait pour un tournage sans reproche.
      - name: Neuf clips, et une fenêtre dans chacun
        shell: bash
        run: |
          set -uo pipefail
          compte=0
          for clip in target/recette/clips/*.mp4; do
            [ -e "${clip}" ] || continue
            compte=$((compte + 1))
            echo "  $(basename "${clip}") ($(wc -c < "${clip}") octets)"
          done
          echo "clips produits : ${compte}"

          # ⚠️ `aucune`, en ASCII pur, et non « aucune fenêtre ». Sous Windows la console de la JVM
          # n'écrit pas forcément en UTF-8 : un motif accentué peut ne JAMAIS correspondre, et un
          # compteur qui reste à zéro parce qu'il cherche des octets qui n'existent pas se lit
          # exactement comme un tournage sans reproche.
          muets=$(grep -c 'aucune' tournage.log || true)

          # ⚠️ L'index se compte, lui aussi. C'est le garde du défaut des forks parallèles : un index
          # amputé garde toutes ses colonnes et n'a aucune ligne fausse, donc il ne se distingue d'un
          # index complet que par un COMPTE. Sans cette ligne, le correctif n'aurait pas de témoin.
          # ⚠️ `:-0` : un index ABSENT doit valoir zéro, pas une chaîne vide, que `-eq` refuserait en
          # disant « nombre invalide » - une panne du garde qui ressemblerait à une panne du banc.
          lignes=$(grep -c '^| S' target/recette/clips/index.md 2>/dev/null || true)
          lignes=${lignes:-0}
          echo "lignes d'index : ${lignes}"

          {
            echo "## Tournage sur ${{ matrix.os }}"
            echo
            echo "- ffmpeg : ${{ steps.ffmpeg.outputs.installe }}"
            echo "- clips produits : ${compte} / 9"
            echo "- clips sans aucune fenêtre : ${muets}"
            echo "- lignes d'index : ${lignes} / 9"
          } >> "${GITHUB_STEP_SUMMARY}"

          [ "${compte}" -eq 9 ] || { echo "::error::${compte} clip(s) sur 9 : le banc n'a pas tout filmé."; exit 1; }
          [ "${muets}" -eq 0 ] || { echo "::error::${muets} clip(s) n'ont vu AUCUNE fenêtre : ils s'arrêtent à leur carton."; exit 1; }
          [ "${lignes}" -eq 9 ] || { echo "::error::index à ${lignes} ligne(s) sur 9 : les forks s'effacent entre eux."; exit 1; }

      - name: Garder les clips en artefact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clips-perceptifs-${{ matrix.os }}
          path: |
            target/recette/clips/
            tournage.log
          retention-days: 14

      # ⚠️ Pré-version SÉPARÉE de `clips-recette`. Un tournage de spike ne doit pas pouvoir remplacer
      # une pièce que `clips-perceptifs.md` écrit en dur : la page de recette montrerait alors des
      # clips venus d'ailleurs sans que rien ne le dise.
      # ⚠️ Depuis Windows SEULEMENT. Les deux jobs produisent les mêmes neuf noms de fichiers : verser
      # les deux écraserait les uns par les autres, et la page montrerait un mélange que rien ne
      # signalerait. La page dit « tournés sous Windows », donc c'est Windows qui verse.
      - name: Verser sur la pré-version « clips-windows-spike »
        if: ${{ runner.os == 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view clips-windows-spike > /dev/null 2>&1; then
            gh release create clips-windows-spike \
              --prerelease \
              --title "Clips du spike Windows (jetable)" \
              --notes "Tournage du banc filmé JAVA sur un runner windows-latest. Pièces REMPLACÉES à chaque tournage, et sans rapport avec une version du produit. Voir dev-docs/spikes/clips-perceptifs-sous-windows.md."
          fi
          gh release upload clips-windows-spike target/recette/clips/*.mp4 --clobber
          echo "Clips versés sur clips-windows-spike." >> "${GITHUB_STEP_SUMMARY}"
