# Suite de contrat API VigieChiro, jouée PÉRIODIQUEMENT en lecture seule (#1371).
#
# C'est la leçon de méthode de #1277 : les tests unitaires simulent les réponses, ils ne
# rejouent jamais un refus réel du serveur. Seule cette suite (`-Papi-live`, REST-assured
# contre l'API réelle + notre ClientVigieChiro) voit une dérive du backend Eve (nouveau
# plafond, champ obligatoire, état inédit). Entre deux exécutions manuelles, elle dormait :
# ce planning la réveille chaque semaine.
#
# Trois états, pas deux (#1371) :
#   - VERT   : le contrat tient (les probes d'écriture opt-in ne sont JAMAIS jouées ici) ;
#   - VERT + avertissement « jeton à renouveler » : le secret VIGIECHIRO_TOKEN est absent ou
#     expiré (14 jours de validité côté Eve) : ce n'est pas une dérive du contrat, on ne
#     crie pas au loup, mais le résumé du run dit quoi faire ;
#   - ROUGE  : le serveur répond et le contrat ne tient plus → à regarder vite.
#
# ⚠️ Ce vert-là a un angle mort, mesuré en #2748 : il ne distingue pas « contrat vérifié » de
# « contrat sauté ». Deux passages verts d'affilée n'avaient rien vérifié, la dernière exécution
# réelle remontant à 16 jours, et personne ne l'avait vu parce qu'il n'y avait rien à voir. D'où un
# QUATRIÈME état, porté par l'étape de veille en fin de job : ROUGE au-delà de trois semaines sans
# vérification réelle. Tolérer une expiration reste juste ; ne plus jamais vérifier ne l'est pas.
name: Contrat API live (hebdomadaire)

on:
  schedule:
    # Le lundi à 06:12 UTC (heure creuse, décalée des heures rondes chargées de GitHub).
    - cron: '12 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  # Lire l'historique des passages : c'est là que vit la date de la dernière vérification réelle,
  # ce qui évite d'en persister une copie qui dériverait à son tour (#2748).
  actions: read

jobs:
  contrat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Jeton valide ?
        # Un simple GET /moi départage « jeton mort » (avertissement, run vert) de « contrat
        # cassé » (échec des tests, run rouge). Sans ce tri, chaque expiration de jeton
        # ressemblerait à une dérive de l'API.
        id: jeton
        env:
          VIGIECHIRO_TOKEN: ${{ secrets.VIGIECHIRO_TOKEN }}
        run: |
          if [ -z "$VIGIECHIRO_TOKEN" ]; then
            echo "valide=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret VIGIECHIRO_TOKEN absent : la suite de contrat n'a pas tourné."
            echo "## Contrat API live : non joué" >> "$GITHUB_STEP_SUMMARY"
            echo "Secret \`VIGIECHIRO_TOKEN\` absent. Le poser : \`gh secret set VIGIECHIRO_TOKEN\` (jeton VigieChiro, validité 14 jours)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          statut=$(curl -s -o /dev/null -w "%{http_code}" -u "$VIGIECHIRO_TOKEN:" \
            https://vigiechiro.herokuapp.com/api/v1/moi || echo "000")
          if [ "$statut" = "200" ]; then
            echo "valide=true" >> "$GITHUB_OUTPUT"
          else
            echo "valide=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Jeton VigieChiro refusé ou plateforme injoignable (HTTP $statut) : la suite de contrat n'a pas tourné. Renouveler le secret VIGIECHIRO_TOKEN (validité 14 jours)."
            echo "## Contrat API live : non joué (HTTP $statut sur GET /moi)" >> "$GITHUB_STEP_SUMMARY"
            echo "Jeton expiré/invalide ou plateforme indisponible. Renouveler : \`gh secret set VIGIECHIRO_TOKEN\` avec un jeton frais (14 jours)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK 25
        if: steps.jeton.outputs.valide == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      - name: Contrat API (lecture seule)
        # Jamais -Dvigiechiro.write=true ici : les probes d'écriture restent un geste humain
        # opt-in (participation de rebut, cf. dev-docs/api-vigiechiro.md).
        #
        # ⚠️ Le NOM de cette étape est lu par la veille ci-dessous pour reconnaître, dans
        # l'historique, un passage qui a réellement vérifié. Le renommer sans reporter le nouveau
        # nom dans ETAPE_CONTRAT (.github/scripts/veille-contrat-api.sh) casserait la détection ;
        # la veille refuse de conclure dans ce cas plutôt que d'annoncer un « jamais joué ».
        id: contrat
        if: steps.jeton.outputs.valide == 'true'
        env:
          VIGIECHIRO_TOKEN: ${{ secrets.VIGIECHIRO_TOKEN }}
        run: ./mvnw -B -Papi-live test -Dvigiechiro.token="$VIGIECHIRO_TOKEN" --file pom.xml

      - name: Depuis quand le contrat n'a-t-il pas été vérifié ?
        # Tourne à CHAQUE passage, y compris quand le contrat a été sauté et surtout quand il a
        # échoué : c'est le seul endroit où un vert dit ce qu'il a réellement vérifié (#2748).
        # `always()` et non `success()` : l'information vaut d'autant plus que quelque chose cloche.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          PASSAGE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/veille-contrat-api.sh

          # L'historique EST la mesure : rien n'est stocké. Vingt passages couvrent largement les
          # trois semaines du seuil, même avec des déclenchements manuels intercalés.
          historique=$(mktemp)
          for couple in $(gh api "repos/$DEPOT/actions/workflows/api-live.yml/runs?per_page=20&status=completed" \
                            --jq ".workflow_runs[] | select(.id != $PASSAGE) | \"\(.id):\(.created_at)\""); do
            quand=${couple#*:}
            gh api "repos/$DEPOT/actions/runs/${couple%%:*}/jobs" \
              --jq '.jobs[].steps[] | "\(.name)\t\(.conclusion)"' \
              | sed "s|^|$quand\t|" >> "$historique"
          done

          # Le passage courant n'est pas dans l'historique (il n'est pas terminé) : on le déclare.
          maintenant=""
          [ "${{ steps.contrat.outcome }}" = "success" ] && maintenant="--joue-maintenant"

          verdict=$(./.github/scripts/veille-contrat-api.sh $maintenant < "$historique") && frais=0 || frais=1
          printf '%s\n' "$verdict"

          {
            echo "## Fraîcheur du contrat API"
            echo
            printf '%s\n' "$verdict" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$frais"
