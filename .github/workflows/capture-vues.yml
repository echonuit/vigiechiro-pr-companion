# Aperçus PNG des vues (.github/assets/apercu-*.png) : vérifiés sur chaque PR, régénérés sur `main`.
#
# Les aperçus servent d'illustrations à la documentation (docs/ecrans/*) : ce workflow les
# régénère automatiquement à partir du code, pour qu'ils ne se désynchronisent jamais des écrans
# réels de l'application.
#
# Le rendu s'exécute AUSSI sur les PR (sans rien committer), et c'est le point : un injecteur de
# capture auquel il manque une liaison Guice ne casse pas la compilation, ne casse aucun test, et
# n'apparaissait donc qu'au run post-merge - sur le dos du push SUIVANT, puisque `cancel-in-progress`
# avait entre-temps annulé le run de la PR fautive. Le rouge atterrissait sur quelqu'un d'autre.
# (Vécu : #1338 ajoute `OuvrirPassage` à `AuditController`, `CaptureAudit` ne le liait pas.)
#
# Rendu hors-écran via la Headless Platform JavaFX 26 (glass.platform=Headless, rendu logiciel sw) :
# aucun display X11 requis. Le commit de mise à jour porte `[skip ci]` pour ne pas se redéclencher
# (et ne déclenche aucune autre CI : un commit d'aperçus n'a pas de code à valider).
name: Aperçus des vues

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # `checks: write` sert à publier le check `titre` sur la PR d'aperçus : GitHub ne déclenche
  # aucun workflow pour un événement produit avec le GITHUB_TOKEN, donc titre-pr.yml ne peut
  # pas s'exécuter ici et cette PR ne serait validée par rien. Cf. l'étape « Valider le titre »
  # plus bas, et l'ADR 0041.
  checks: write

# Évite que deux régénérations de main (pushes rapprochés) se marchent dessus. Le groupe inclut la
# ref : une PR n'annule jamais le run de `main`, ni celui d'une autre PR.
concurrency:
  group: captures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sur `main`, on se place sur la branche (le job y committera). Sur une PR, checkout par
          # défaut de la tête de la PR : c'est le code qu'on veut rendre.
          ref: ${{ github.event_name == 'push' && 'main' || '' }}

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          # JavaFX 26 vient des dépendances Maven org.openjfx ; la Headless Platform est 100 %
          # logicielle (aucun runtime natif jdk+fx requis).
          check-latest: false
          cache: maven

      # La police SYSTÈME du runner, alignée sur celle que l'application déclare (#3417).
      #
      # Le produit embarque Noto Sans et la demande par `base.css` : il ne dépend plus de la machine
      # pour **peindre**. Il en dépend encore pour **mesurer** - `ChoiceBoxSkin`, et tout skin qui
      # calcule sa taille avec un nœud de texte hors du graphe de scène, utilise `Font.getDefault()`,
      # à laquelle aucune feuille de style ne s'applique. Mesuré : « 1 heure » fait 46,92 px en Noto
      # Sans et 50,22 px dans la police système du runner, d'où un contrôle plus large de 4 px et un
      # graphique décalé d'autant.
      #
      # Pourquoi aligner le runner plutôt que corriger le code : il n'existe pas UN rendu utilisateur,
      # il dépend de la police système de chacun. La galerie rendait donc comme personne en
      # particulier - une machine où mesure et peinture se contredisent. La seule référence non
      # arbitraire est celle où les deux coïncident, c'est-à-dire une machine dont la police système
      # EST celle que l'application déclare.
      #
      # Ce n'est pas un correctif du produit : chez un utilisateur dont le système résout `System`
      # autrement, ce contrôle reste plus large de 4 px. Le sujet est suivi en #3417.
      - name: Cache des paquets APT (fonts-noto-core, imagemagick)
        # Le seul levier qui reste quand l'hébergeur ralentit : ne pas retélécharger. Les
        # runners traînent AVANT de bloquer, donc la panne est en amont ; borner et reprendre
        # évite de pendre, cela ne fait pas descendre 91 Mo plus vite.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          key: apt-${{ runner.os }}-fonts-noto-core-imagemagick
      
      - name: Aligner la police système sur celle de l'application
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: |
          # Sans `-qq`, et avec des délais bornés. Cette ligne a pendu 4 h 15 : le miroir du
          # runner ne répondait plus, apt basculait sur l'archive amont, et `-qq` ne laissait AUCUNE
          # trace pour le dire. Un `Acquire::Retries` reprend les téléchargements coupés ; les délais
          # font échouer vite plutôt que traîner jusqu'au butoir du job.
          python3 .github/scripts/installer_paquets.py fonts-noto-core
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'FIN'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
            <alias><family>system-ui</family><prefer><family>Noto Sans</family></prefer></alias>
            <alias><family>monospace</family><prefer><family>Noto Sans Mono</family></prefer></alias>
          </fontconfig>
          FIN
          fc-cache -f > /dev/null
          echo "sans-serif  -> $(fc-match sans-serif)"
          echo "monospace   -> $(fc-match monospace)"

      # Sur une PR comme sur `main` : si un écran ne se rend plus, le job échoue ici. C'est le seul
      # endroit qui exerce réellement les injecteurs partiels de capture jusqu'au chargement du FXML.
      - name: Générer les aperçus PNG (hors-écran)
        run: |
          chmod +x .github/assets/capture_screenshots.py
          python3 .github/assets/capture_screenshots.py

      # `filtrer_bruit_cartes.py` compare les aperçus de carte à leur version committée. L'image
      # `ubuntu-latest` ne fournit AUCUN ImageMagick : sans cette étape, la suivante échoue.
      - name: Installer ImageMagick (comparaison des aperçus de carte)
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: python3 .github/scripts/installer_paquets.py --avec-recommandations imagemagick

      # Sur une PR comme sur `main`, et c'est le correctif de fond : ce filtre vivait DANS l'étape de
      # publication, donc sous `if: push`. Aucune PR ne l'exerçait. #3359 a ainsi pu être fusionnée
      # cassée - elle exigeait `magick`, absent du runner - et n'a échoué qu'ensuite, sur `main`,
      # quatre exécutions de suite, en bloquant la publication des aperçus sans que rien ne rougisse
      # côté PR. Sorti ici, il tourne partout ; sur une PR il ne modifie que des fichiers du plan de
      # travail, que personne ne committe.
      - name: Filtrer le bruit des cartes
        run: |
          chmod +x .github/assets/filtrer_bruit_cartes.py
          python3 .github/assets/filtrer_bruit_cartes.py

      - name: Montrer les écrans que cette PR change (#4119)
        # Uniquement sur une PR : sur `main`, c'est le commit d'aperçus qui montre le changement.
        #
        # Ce pas ne juge RIEN et ne bloque rien. Un écran qui change est le résultat normal d'une PR
        # qui touche l'interface ; ce qui manquait était de le MONTRER. Jusqu'ici, la liste des écrans
        # modifiés était calculée par le filtrage ci-dessus, puis jetée : le seul endroit où l'on voyait
        # un changement visuel était le commit `chore(captures)`, c'est-à-dire APRÈS la fusion.
        #
        # Le filtrage du bruit doit avoir eu lieu AVANT : sans lui, les aperçus de carte
        # apparaîtraient à chaque fois, et une vraie régression deviendrait indiscernable du bruit de
        # tuiles - jusqu'à 23,8 % d'une image (cf. `filtrer_bruit_cartes.py`).
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          chmod +x .github/assets/compare_apercus.py
          # `git status --porcelain` rend aussi bien les modifiés (` M`) que les nouveaux (`??`) : un
          # écran ajouté par la PR mérite d'être montré, même s'il n'a pas d'avant.
          mapfile -t modifies < <(git status --porcelain -- '*.png' | awk '{print $2}')
          python3 .github/assets/compare_apercus.py target/apercus-pr "${modifies[@]}" || true
          cat target/apercus-pr/index.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Conserver les avant/après
        if: ${{ github.event_name == 'pull_request' && hashFiles('target/apercus-pr/*.avant-apres.png') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apercus-avant-apres
          path: target/apercus-pr
          retention-days: 14

      - name: Publier les aperçus via une PR auto-mergée
        # Uniquement sur `main` : une PR vérifie que les écrans se rendent, elle ne publie rien.
        if: github.event_name == 'push'
        # `main` impose le passage par une PR et github-actions[bot] ne peut PAS pousser en direct.
        # On modélise donc le workflow PR : branche -> PR -> squash-merge. Le squash porte
        # [skip ci] (anti-récursion : un commit d'aperçus n'a pas de code à valider).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Le bruit des cartes a déjà été filtré par l'étape précédente : ce qui reste modifié dans
          # le plan de travail est ce qui mérite d'être committé.
          git add .github/assets/apercu-*.png
          if git diff --cached --quiet; then
            echo "Aucun aperçu modifié : rien à committer."
            exit 0
          fi
          BRANCH="bot/apercus-${GITHUB_RUN_ID}"
          MSG="chore(captures): mise à jour des aperçus des vues"
          git switch -c "$BRANCH"
          git commit -m "$MSG [skip ci]"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" --title "$MSG" \
            --body "Mise à jour automatique de la galerie d'aperçus (.github/assets/apercu-*.png). PR ouverte par le bot car \`main\` impose le passage par une PR ; squash-mergée automatiquement."

          # Valider le titre, et publier le résultat comme check `titre`.
          #
          # titre-pr.yml ne peut PAS s'exécuter sur cette PR : GitHub ne déclenche aucun workflow
          # pour un événement produit avec le GITHUB_TOKEN (garde-fou anti-récursion). Sans ce
          # passage, une PR d'aperçus ne serait donc validée par RIEN.
          #
          # Ce mécanisme est né d'un besoin plus dur - `titre` était alors un check REQUIS, et son
          # silence a bloqué la PR #2124 indéfiniment. Le contrôle est depuis redevenu informatif
          # (cf. ADR 0041), mais on le garde : il reste le seul regard porté sur ces titres.
          #
          # On exécute donc ICI la MÊME validation, avec le MÊME script : seul le transport du
          # résultat change, le contrôle reste réel. Publier un succès en dur reviendrait à faire
          # croire à une vérification qui n'a pas eu lieu.
          chmod +x .github/scripts/verifie_titre_pr.py
          if python3 .github/scripts/verifie_titre_pr.py "$MSG"; then
            VERDICT=success
            RESUME="Titre conforme à Conventional Commits."
          else
            VERDICT=failure
            RESUME="Titre non conforme : la PR d'aperçus ne sera pas fusionnée."
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=titre \
            -f head_sha="$(git rev-parse HEAD)" \
            -f status=completed \
            -f conclusion="$VERDICT" \
            -f 'output[title]=Titre de PR' \
            -f "output[summary]=${RESUME}" >/dev/null
          echo "Check titre publié : ${VERDICT}"

          # Merge LINÉAIRE (compatible required_linear_history) : squash si autorisé, sinon rebase.
          # Retry : l'état « mergeable » est parfois calculé en asynchrone juste après l'ouverture.
          for i in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch --subject "$MSG [skip ci]" --body "" 2>/dev/null \
               || gh pr merge "$BRANCH" --rebase --delete-branch 2>/dev/null; then
              echo "PR de captures mergée (squash ou rebase selon la configuration)."
              exit 0
            fi
            echo "Merge pas encore possible (tentative $i/5), nouvelle tentative dans 5 s..."
            sleep 5
          done
          echo "::error::Échec du merge de la PR de captures après 5 tentatives."
          exit 1
