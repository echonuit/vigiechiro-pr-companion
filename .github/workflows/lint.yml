# Portail qualité statique : formatage + complétude des captures + PMD bloquant.
# Aucun test ici : la suite complète (et le seuil de couverture JaCoCo bloquant)
# vit dans maven.yml, pour ne pas exécuter les tests deux fois par PR.
# `solution` est conservée pendant la transition (avant la consolidation en `main`).
name: Quality gate

on:
  push:
    branches: [solution, main]
  pull_request:
  workflow_dispatch:

# Annule un run superseded sur la même ref (pushes/PR rapprochés).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  banc-filme:
    # Les auto-tests des DEUX bancs filmés : celui de la recette
    # (`.github/scripts/lance-test-filme.sh`, #3883) et celui de la documentation
    # (`scripts/doc-video/filme-un-parcours.sh`, #3887). Ils partagent leur outillage d'affichage,
    # donc ils partagent ce job.
    #
    # ⚠️ Le second n'était lancé NULLE PART. Il figurait dans les chemins déclencheurs de `docs.yml`
    # - le modifier réveillait le workflow - mais aucune étape n'exécutait ses cas. C'est exactement
    # le défaut que #3883 avait fermé pour le premier banc, refait dans l'outil bâti pour le
    # combattre : un garde de soixante-cinq cas dont personne ne vérifiait qu'il passe.
    #
    # ⚠️ Et `verifie-inventaires-ci.sh` ne pouvait pas le dire : il ne regarde que
    # `.github/scripts` et `.github/assets`. Un banc rangé sous `scripts/` lui est invisible.
    #
    # ⚠️ Ils n'avaient JAMAIS tourné en CI. Quatorze scripts lancent leur `--auto-test` dans le job
    # `lint` ci-dessous ; celui-ci n'y était pas, faute d'outillage - et `recette-filmee.yml`, qui
    # l'installe, est à déclenchement MANUEL. Entre deux séances, rien n'exerçait le garde du banc.
    #
    # ## Pourquoi un job à part, et non une étape de `lint`
    #
    # Trois mesures ont tranché, plutôt qu'une préférence :
    #
    #   | `lint` aujourd'hui                          |  67 s |
    #   | l'`apt-get install` de l'outillage          |  34 s |
    #   | l'auto-test lui-même, 26 cas                |   6 s |
    #
    # Le coût n'est pas l'auto-test, c'est son outillage. Le poser dans `lint` porterait ce job à
    # ~107 s, soit +60 % sur celui dont tout l'intérêt est d'être court. Ici, les deux tournent en
    # PARALLÈLE derrière `Java CI` qui prend une dizaine de minutes : le coût horloge est nul.
    #
    # L'intention de l'ADR 3661 - les cas d'un garde de CI sont lancés par `lint.yml` - est donc
    # tenue sans en payer le prix sur le job rapide.
    runs-on: ubuntu-latest
    # ⚠️ Un butoir, parce que l'absence de butoir a bloqué une PR pendant **quarante minutes** sans
    # rien apprendre à personne. Le miroir Ubuntu d'Azure a rendu `fonts-urw-base35` (11 Mo) à une
    # poignée de kilo-octets par seconde ; l'installation, mesurée à 34 s la veille, n'était toujours
    # pas finie. Sans butoir, GitHub laisse courir six heures.
    #
    # Un garde qui peut bloquer indéfiniment est pire qu'un garde qui échoue : il ne dit rien, et il
    # retient tout le monde.
    #
    # ⚠️ Douze minutes n'étaient plus vingt fois la mesure nominale, elles étaient devenues trop
    # justes. L'outillage pèse **91,2 Mo** : à 2,7 Mo/s - le miroir en forme - c'est 34 s ; à
    # 0,2 Mo/s - le miroir de ce soir - c'est huit minutes rien que pour le téléchargement, et le
    # job mourait au butoir sans avoir lancé un seul cas. Vingt-cinq minutes couvrent le miroir
    # dégradé sans rien couvrir d'infini. Le chiffre à relire pour le régler de nouveau est celui
    # qu'APT annonce lui-même à l'installation : « Need to get 0 B/91.2 MB of archives ».
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache des .deb (le dépaquetage, lui, se refait)
        # ⚠️ Ce cache-ci porte sur les `.deb`, pas sur l'état installé : `dpkg` tourne donc à chaque
        # run, et avec lui les scripts post-installation - `fc-cache` compris. On perd le temps du
        # dépaquetage ; on garde des polices réellement enregistrées.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          # ⚠️ La clé NOMME ce qu'elle contient. Ajouter un paquet sans la changer ferait servir un
          # cache d'avant, et le défaut n'apparaîtrait qu'au second passage - celui qui TROUVE le
          # cache, pas celui qui le remplit.
          key: apt-${{ runner.os }}-banc-filme-imagemagick

      - name: Installer de quoi afficher et filmer
        # ⚠️ PAS le cache de fichiers, et c'est une leçon payée. `awalsh128/cache-apt-pkgs-action`
        # restaure des fichiers sans rejouer les scripts post-installation ; j'avais jugé ffmpeg
        # « paquet de fichiers », et c'est faux : sa fermeture de dépendances tire DIX paquets de
        # polices - fonts-droid-fallback, fonts-noto-mono… - et `fc-cache` ne tourne pas.
        #
        # Conséquence mesurée : le premier run qui a TROUVÉ le cache a fait tomber cinq cas du banc
        # de recette, tous ceux qui écrivent du texte dans une vidéo de test (`drawtext` cherche une
        # police par fontconfig). Le run précédent, cache froid, passait - donc la panne n'apparaît
        # qu'au second passage, ce qui la rend d'autant plus traître.
        #
        # Ce job REND des images : il installe pour de vrai.
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: |
          bash .github/scripts/installer-paquets.sh xvfb xdotool ffmpeg x11-utils openbox tesseract-ocr tesseract-ocr-fra

      - name: Le banc de recette, ses cas et ses rouges attendus
        run: |
          chmod +x .github/scripts/lance-test-filme.sh
          ./.github/scripts/lance-test-filme.sh --auto-test

      - name: Le banc de documentation, ses cas et ses rouges attendus
        # ⚠️ Sans `udisks2`, `dosfstools` ni `mtools`, et c'est voulu : l'auto-test ne monte aucune
        # carte, il éprouve les REFUS du montage - étiquette étrangère, point vide, source sans
        # brut - qui sont du raisonnement pur. Le banc distingue depuis #4013 les outils qu'il lui
        # faut toujours de ceux qu'un parcours à carte réclame, ce qui évite d'installer un service
        # de disques sur un runner pour vérifier des chaînes de caractères.
        run: bash scripts/doc-video/filme-un-parcours.sh --auto-test

      - name: Installer ImageMagick, que le runner ne fournit pas
        # ⚠️ « L'image `ubuntu-latest` ne fournit AUCUN ImageMagick », comme le dit déjà
        # `capture-vues.yml`. Mesuré ici en le supposant présent : l'étape suivante a rendu
        # « ImageMagick requis pour l'auto-test » et le job entier avec.
        #
        # `--avec-recommandations` parce que le paquet `imagemagick` ne tire ses binaires que par ses
        # recommandations : sans le drapeau, `convert` reste introuvable.
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: bash .github/scripts/installer-paquets.sh --avec-recommandations imagemagick

      - name: Les deux comparaisons visuelles, et leurs grandes images
        # ⚠️ `compare-apercus.sh` avait un `--auto-test` de huit cas qui ne tournait NULLE PART. Le
        # même défaut que celui décrit plus haut pour le banc de documentation, dans un autre outil :
        # un garde dont personne ne vérifie qu'il passe.
        #
        # Et il ne l'aurait pas vu de toute façon : ses images faisaient 80 × 40, quand le défaut
        # n'apparaît qu'AU-DELÀ DU MILLION DE PIXELS - ImageMagick y écrit ses comptes en notation
        # scientifique, « 1.2034e+06 ». Trente-trois captures du dépôt dépassent ce seuil, et pour
        # elles la part de pixels changés valait « ? ». Les deux auto-tests portent désormais chacun
        # leur cas de grande image (#4274).
        #
        # Ils vivent ici et non dans `lint` parce que celui des tournages a besoin de ffmpeg, que ce
        # job installe déjà.
        run: |
          chmod +x .github/assets/compare-apercus.sh .github/assets/compare-tournages.sh
          ./.github/assets/compare-apercus.sh --auto-test
          ./.github/assets/compare-tournages.sh --auto-test

  outillage-release:
    # release.yml ne se déclenche qu'au push sur `main` : aucune CI de PR ne traverse la chaîne de
    # publication, donc une erreur d'installation ou de configuration ne se verrait qu'à la prochaine
    # release - c'est-à-dire en production, sur un dépôt qui publie à chaque fusion (#2738).
    #
    # ⚠️ Ce que ce job prouve DÉPEND du déclencheur, et c'est à savoir avant de lire son vert (#3345) :
    #   - sur une PR, `semantic-release` s'arrête sur « triggered by a pull request » APRÈS avoir chargé
    #     les greffons mais AVANT d'analyser l'historique. Le vert dit « ça s'installe et ça se charge » ;
    #   - sur `main`, il va jusqu'à l'analyse et au calcul de version. C'est là que le contrôle est réel.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `contents: write` alors que ce job n'écrit rien : `semantic-release` vérifie qu'il POURRAIT pousser
    # un tag dès `verifyConditions`, y compris en `--dry-run`. Sous le plancher `contents: read` du
    # workflow, il échouait donc sur `main` par `EGITNOPERMISSION` - sauf quand un checkout obsolète le
    # faisait sortir plus tôt, ce qui produisait un vert signifiant « contrôle sauté » (#3345).
    #
    # Le droit accordé est borné et VÉRIFIÉ SUR PLACE : l'invocation est en `--dry-run`, et l'étape
    # « La configuration d'analyse dérive bien de celle du dépôt » échoue si la liste des greffons n'est
    # pas exactement commit-analyzer + release-notes-generator, donc si un greffon d'écriture y entrait.
    # Déclaration par job et non plancher : c'est le patron posé par #2739, que garde `verifie-permissions.sh`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # semantic-release lit l'historique et les tags

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Installer l'outillage depuis le lockfile
        # `npm ci` échoue si le lockfile ne correspond pas au package.json : c'est la garantie que
        # ce qui s'installera au moment de publier est exactement ce que le dépôt déclare.
        run: npm ci --prefix .github/release

      - name: La configuration d'analyse dérive bien de celle du dépôt
        # Elle ne recopie pas les parserOpts, elle les hérite : une copie divergerait, et la version
        # calculée en vérification ne serait plus celle que la publication calculera.
        run: |
          node -e "
            const c = require('./.github/release/release.config.js');
            const noms = c.plugins.map((p) => (Array.isArray(p) ? p[0] : p));
            const attendus = ['@semantic-release/commit-analyzer', '@semantic-release/release-notes-generator'];
            if (JSON.stringify(noms) !== JSON.stringify(attendus)) {
              throw new Error('greffons d\'analyse inattendus : ' + noms.join(', '));
            }
            const motif = c.plugins[0][1] && c.plugins[0][1].parserOpts && c.plugins[0][1].parserOpts.headerPattern;
            if (!motif) {
              throw new Error('parserOpts non hérités de .releaserc.json : la version calculée divergerait');
            }
            console.log('Configuration d\'analyse : ' + noms.length + ' greffon(s), parserOpts hérités.');
          "

      - name: Répétition à blanc de la chaîne de publication
        # `--dry-run` n'écrit rien et la configuration d'analyse n'embarque aucun greffon d'écriture :
        # cette étape ne peut pas publier. Elle prouve que l'outillage s'installe et que les greffons se
        # chargent ; sur `main` seulement, elle prouve en plus que l'historique est lisible et qu'une
        # version se calcule (sur une PR, semantic-release s'arrête avant, cf. l'en-tête du job).
        run: |
          cd .github/release
          ./node_modules/.bin/semantic-release --dry-run 2>&1 | tee ../../repetition.log
          etat=${PIPESTATUS[0]}
          # Un checkout devenu obsolète (une autre fusion a atterri entre-temps) fait sortir
          # semantic-release en 0 AVANT l'analyse. Le vert dirait alors « rien vérifié » sans le dire :
          # c'est le faux vert de #3345. On ne rougit pas pour autant - la course est bénigne et un
          # rouge les jours de fusion dense apprendrait à ne plus lire ce job - mais on l'ANNONCE.
          if grep -q "behind the remote" ../../repetition.log; then
            echo "::warning::Copie locale en retard sur le distant : la répétition à blanc s'est arrêtée avant l'analyse. Ce vert ne dit rien de l'historique ni du calcul de version."
            echo "## Répétition à blanc : non jouée" >> "$GITHUB_STEP_SUMMARY"
            echo "La copie locale était en retard sur \`main\` (fusion concurrente) : \`semantic-release\` s'est arrêté avant d'analyser l'historique." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$etat"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          # JDK Temurin standard (sans JavaFX) : JavaFX 26 vient des dépendances Maven
          # org.openjfx. La Headless Platform (glass.platform=Headless) est 100 % logicielle.
          check-latest: false
          cache: maven

      - name: Formatage Spotless (bloquant)
        # Spotless est opt-in (pas de binding Maven) : on l'exécute explicitement ici pour
        # qu'un code non formaté fasse échouer la CI, même sans le hook pre-commit local.
        run: ./mvnw -B spotless:check --file pom.xml

      - name: Épinglage des actions et conteneurs
        # Un tag peut être repointé sur un autre commit sans que rien ne bouge chez nous : ce qui
        # s'exécute dans nos workflows changerait alors sans qu'aucun commit ne le dise (#2737).
        # Sans cette garde, la prochaine action ajoutée le serait par tag et l'épinglage se
        # déferait en silence.
        # L'autotest tourne d'abord, comme pour la garde jeton : une règle relâchée passerait sinon au
        # vert sur un dépôt propre, sans que rien ne le dise.
        run: |
          chmod +x .github/scripts/verifie-epinglage.sh
          ./.github/scripts/verifie-epinglage.sh --auto-test
          ./.github/scripts/verifie-epinglage.sh

      - name: Le Flatpak peut ouvrir une fenêtre sous Wayland
        # `--socket=fallback-x11` n'accorde X11 que si Wayland est ABSENT, alors que JavaFX rend par
        # GTK en X11. Sur GNOME et KDE - donc chez la plupart des utilisateurs - le paquet mourait au
        # démarrage sur « Unable to open DISPLAY », et RIEN ne l'a vu : le pas « Démarrage réel » de
        # flatpak.yml tourne en headless, donc sans affichage, et les essais locaux passaient tous
        # `--nosocket=wayland`, ce qui prenait par accident le seul chemin qui marche.
        # C'est une politique de permissions, lisible dans le manifeste : on la garde ici, hors ligne,
        # plutôt que d'installer un compositeur sur le runner.
        run: |
          chmod +x .github/scripts/verifie-affichage-flatpak.sh
          ./.github/scripts/verifie-affichage-flatpak.sh --auto-test
          ./.github/scripts/verifie-affichage-flatpak.sh

      - name: Moindre privilège des workflows
        # #2739 a retiré les droits d'écriture du plancher de release.yml pour les déclarer job par
        # job. Rien ne l'empêchait de se défaire : une PR qui les remettrait au plancher passerait
        # toutes les autres gardes (#3294).
        run: |
          chmod +x .github/scripts/verifie-permissions.sh
          ./.github/scripts/verifie-permissions.sh --auto-test
          ./.github/scripts/verifie-permissions.sh

      - name: La porte d installation porte ses cas
        # ⚠️ Elle est en travers du chemin de tous les workflows, y compris ceux qui publient : un
        # défaut y serait indiscernable d'une panne de miroir.
        run: bash .github/scripts/installer-paquets.sh --auto-test

      - name: Aucun workflow n appelle apt-get directement
        # ⚠️ Trois étapes de trois workflows ont pendu le même jour sur `apt-get update`, jusqu'au
        # butoir de leur job et jusque sur `main`. Le remède avait été appliqué à UNE des trois.
        run: |
          chmod +x .github/scripts/verifie-apt.sh
          ./.github/scripts/verifie-apt.sh --auto-test
          ./.github/scripts/verifie-apt.sh

      - name: Tout job porte un butoir
        # ⚠️ Un job sans `timeout-minutes` que GitHub laisse courir SIX HEURES a bloqué une PR
        # 4 h 15 sur un `apt-get install` de police, en `-qq` donc sans une ligne de log. Le butoir
        # de #3883 avait été apprécié pour le seul `banc-filme` ; vingt-six autres jobs n'en avaient
        # aucun, dont ceux qui publient.
        run: |
          chmod +x .github/scripts/verifie-butoirs.sh
          ./.github/scripts/verifie-butoirs.sh --auto-test
          ./.github/scripts/verifie-butoirs.sh

      - name: Une entrée booléenne ne se compare pas à une chaîne
        # ⚠️ `inputs.x == 'true'` vaut TOUJOURS faux, et `!= 'true'` TOUJOURS vrai : une entrée
        # `type: boolean` arrive comme un vrai booléen, et comparer deux types différents les casse
        # tous les deux en nombres. Mesuré sur le run 32395513266 : le remuxage des clips était sauté
        # alors que le film existait, et le témoin « sans gestionnaire de fenêtres » installait quand
        # même openbox - la garde qui prouve que la vérification du pointeur garde quelque chose ne
        # gardait donc rien elle-même.
        run: |
          chmod +x .github/scripts/verifie-conditions-booleennes.sh
          ./.github/scripts/verifie-conditions-booleennes.sh --auto-test
          ./.github/scripts/verifie-conditions-booleennes.sh
          chmod +x .github/scripts/clips-orphelins.sh
          ./.github/scripts/clips-orphelins.sh --auto-test

      - name: Les scripts shell passent shellcheck
        # ⚠️ Les RÉGLAGES (exclusions) vivent dans `.shellcheckrc`, pas ici : un contributeur qui
        # lance `shellcheck son-script.sh` doit voir la même chose que ce pas. Seul le SEUIL est un
        # drapeau, parce que `severity=` n'est pas lu depuis le fichier de réglages - vérifié, et
        # non supposé : les notes continuaient de sortir.
        #
        # `-S info` et non `warning` : au seuil warning, un `rm -f $fichiers` non quoté passait au
        # vert. C'est un SC2086, donc une « info » - et c'est exactement la remarque qui a trouvé un
        # vrai défaut dans `clips-orphelins.sh` (#4106). Un garde qui manquerait le défaut qui l'a
        # fait naître ne garderait pas grand-chose.
        #
        # ⚠️ La PARITÉ porte sur les réglages, PAS sur la version. Mesuré sur ce pas même : le
        # runner a signalé un `SC2015` que shellcheck 0.11.0 ne signale plus en local. C'est donc la
        # CI qui fait foi, et un poste plus récent peut être plus PERMISSIF - l'inverse de ce que
        # j'avais d'abord écrit ici. `shellcheck --version` avant de conclure d'un vert local.
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null 2>&1 || {
            echo "::error::shellcheck absent du runner : l'image a changé, il faut l'installer par la porte."
            exit 1
          }
          mapfile -t scripts < <(
            find . -path ./target -prune -o -path '*/node_modules/*' -prune -o -name '*.sh' -print | sort
          )
          echo "${#scripts[@]} script(s) analysé(s)."
          shellcheck --shell=bash -S info "${scripts[@]}"

      - name: La condition d'un job appuyé sur un « needs » nomme l'état qu'elle attend
        # ⚠️ GitHub saute un job dès qu'un ANCÊTRE a été sauté, sauf si son `if:` porte une fonction
        # d'état : sans elle, la condition est enveloppée en `success() && (...)` sur tout le graphe
        # amont, et la porte qu'on croit tenir n'est jamais évaluée. Mesuré sur le run 32224321373 :
        # la 2.186.0 a eu son tag, son CHANGELOG et sa Release, puis aucun installeur - `installers`
        # et `publish` descendaient d'une garde que le train programmé saute toujours. Le run était
        # VERT, et personne ne l'a vu pendant huit jours (#4079).
        run: |
          chmod +x .github/scripts/verifie-conditions-de-job.sh
          ./.github/scripts/verifie-conditions-de-job.sh --auto-test
          ./.github/scripts/verifie-conditions-de-job.sh

      - name: Les renvois entre workflows visent un libellé existant
        # Un `workflow_run` désigne le workflow attendu par son `name:`, apparié par égalité stricte.
        # Un libellé mort n'arme rien et ne rougit pas : il n'y a AUCUN run à regarder. #3279 l'a payé
        # trois semaines de documentation non republiée, repérées à l'œil et non par la CI (#3287).
        run: |
          chmod +x .github/scripts/verifie-renvois-workflows.sh
          ./.github/scripts/verifie-renvois-workflows.sh --auto-test
          ./.github/scripts/verifie-renvois-workflows.sh

      - name: Les inventaires que la CI tient sur elle-même concordent
        # ⚠️ Ce dépôt exige de son PRODUIT que ses inventaires soient prouvés - commandes CLI contre
        # `dev-docs/cli.md`, vues contre captures, ADR contre index et nav. De sa propre description, il
        # n'exigeait rien, et les trois inventaires avaient dérivé : deux workflows absents du tableau -
        # les deux de SÉCURITÉ -, six gardes autotestées absentes de l'autre (#3771, #3794).
        #
        # L'autotest tourne d'abord, et son premier cas est un contrôle NÉGATIF : un dépôt cohérent doit
        # rester vert, `maven.yml` cité cinq fois compris. Une règle qui compterait des lignes au lieu
        # de comparer des fichiers rougirait sur un tableau juste, et se ferait retirer.
        run: |
          chmod +x .github/scripts/verifie-inventaires-ci.sh
          ./.github/scripts/verifie-inventaires-ci.sh --auto-test
          ./.github/scripts/verifie-inventaires-ci.sh

      - name: "Un nom d'étape dit en entier ce qu'il écrit (bloquant, #4255)"
        # Un `#` précédé d'une espace ouvre un commentaire YAML, y compris au milieu d'un nom non
        # cité : `name: Auto-test des scripts ADR (bloquant, #2467)` valait `… (bloquant,`. Six
        # étapes de `lint.yml` et `maven.yml` perdaient ainsi leur numéro d'issue - c'est-à-dire ce
        # qui sert à retrouver pourquoi elles existent. Le fichier avait raison, l'interface
        # tronquait, et rien ne signalait l'écart.
        #
        # L'auto-test d'abord : une garde qui aurait cessé de voir laisserait revenir la troncature
        # sur un dépôt propre, et son silence passerait pour un feu vert.
        run: |
          set -euo pipefail
          ./.github/scripts/verifie-noms-d-etapes.sh --auto-test
          ./.github/scripts/verifie-noms-d-etapes.sh
      - name: Aucun jeton VigieChiro en clair
        # Le scan de secrets de GitHub ne reconnaît que les motifs de FOURNISSEURS ; un jeton
        # VigieChiro est une chaîne opaque qu'aucun catalogue ne connaît, et les motifs
        # personnalisés demandent GitHub Advanced Security, indisponible ici (#2741).
        # L'autotest tourne d'abord : une garde dont le motif a été relâché passerait sinon au vert
        # sur un dépôt propre, sans que rien ne le dise.
        run: |
          chmod +x .github/scripts/verifie-jeton.sh
          ./.github/scripts/verifie-jeton.sh --auto-test
          ./.github/scripts/verifie-jeton.sh

      - name: Le garde de fraîcheur des épinglages sait encore rougir
        # Il ne mesure pour de vrai que le lundi, dans `securite-dependances.yml`, parce que la mesure
        # demande le réseau et que l'amont bouge sans nous. Son autotest, lui, est hors ligne : c'est
        # le seul contrôle qui passe à chaque PR, et sans lui un seuil relâché - une majeure de retard
        # requalifiée en simple avertissement - passerait au vert sans que rien ne le dise (#3382).
        run: |
          chmod +x .github/scripts/verifie-fraicheur-actions.sh
          ./.github/scripts/verifie-fraicheur-actions.sh --auto-test

      - name: La veille de fraîcheur du contrat API sait encore rougir
        # Elle ne tourne pour de vrai que dans api-live.yml, une fois par semaine : son autotest est
        # le seul endroit où on la voit à l'œuvre à chaque PR. Sans lui, un durcissement de seuil ou
        # un `skipped` compté comme une exécution réelle passeraient inaperçus jusqu'au jour où on
        # compterait sur elle (#2748).
        run: |
          chmod +x .github/scripts/veille-contrat-api.sh
          ./.github/scripts/veille-contrat-api.sh --auto-test

      - name: La garde du démarrage des emballages sait encore rougir
        # Elle ne tourne pour de vrai que dans `release.yml` (les enveloppes) et `maven.yml`
        # (l'app-image et l'aller-retour tar.gz). `release.yml` n'étant traversé par AUCUNE PR, son
        # étape pourrait être fusionnée cassée et ne se découvrir qu'au train suivant, en bloquant la
        # publication. Cet autotest est la seule chose qui la voie entre deux releases (#3617).
        run: |
          chmod +x .github/scripts/verifie-demarrage-emballage.sh
          ./.github/scripts/verifie-demarrage-emballage.sh --auto-test

      - name: La garde du secret winget sait encore rougir
        # Elle ne tourne pour de vrai que dans winget.yml, sur dispatch manuel, c'est-à-dire quelques
        # fois par an : son autotest est le seul endroit où on la voit à l'œuvre entre deux
        # soumissions. Elle a passé neuf mois à ne savoir que RÉUSSIR - un secret absent sortait en
        # vert - et c'est précisément le défaut que cet autotest fige (#2213).
        run: |
          chmod +x .github/scripts/verifie-secret-winget.sh
          ./.github/scripts/verifie-secret-winget.sh --auto-test

      - name: Complétude des captures de référence
        # Chaque vue FXML doit avoir au moins une capture de référence déclarée au manifeste
        # (les captures illustrent la documentation).
        # L'auto-test d'abord : une règle relâchée passerait sinon au vert sur un dépôt cohérent.
        run: |
          chmod +x .github/assets/check-captures.sh
          ./.github/assets/check-captures.sh --auto-test
          ./.github/assets/check-captures.sh

      - name: Enregistrement des outils de capture
        # Chaque outil de capture (classe outils/Capture* avec un main) doit figurer dans le
        # tableau MAINS de capture-screenshots.sh, sinon ses PNG ne seraient jamais régénérés.
        run: |
          chmod +x .github/assets/check-capture-mains.sh
          ./.github/assets/check-capture-mains.sh --auto-test
          ./.github/assets/check-capture-mains.sh

      - name: Portail qualité (PMD, bloquant)
        # Analyse statique seule : PMD n'a besoin que des classes compilées (résolution de
        # types), pas des tests. Ne PAS remplacer par `-Pquality-gate verify -DskipTests` :
        # sans jacoco.exec, jacoco:check passe silencieusement au vert au lieu de bloquer.
        # Le seuil de couverture bloquant est appliqué dans maven.yml, là où les tests tournent.
        run: ./mvnw -B -Pquality-gate compile pmd:check

      - name: Cliquets ADR (bloquant)
        # Chaque script `probable` (scripts/adr/NNNN-*.py) rend un code non nul quand le nombre de
        # suspects DÉPASSE le cliquet déclaré dans l'ADR : un cas a été ajouté. C'est ici que le
        # cliquet devient un vrai garde-fou, sur CHAQUE PR.
        #
        # Sans cette étape, le cliquet n'était vérifié que par le rapport hebdomadaire, qui observe
        # sans juger : une régression (un `Alert` de plus hors port, une classe CSS redéfinie)
        # passait donc en silence jusqu'au lundi suivant, et même là ne rougissait pas. La doc et les
        # PR du chantier ADR affirmaient pourtant « le cliquet fait rougir la CI si un cas s'ajoute » ;
        # cette étape rend l'affirmation vraie. python3 est préinstallé sur le runner, les scripts
        # n'ont aucune dépendance hors stdlib.
        run: |
          set -euo pipefail
          echec=0
          for script in scripts/adr/[0-9]*.py; do
            python3 "$script" || echec=1
          done
          exit "$echec"

      - name: "Auto-test des scripts ADR (bloquant, #2467)"
        # L'étape précédente échoue quand un script SUR-compte (un cas s'ajoute). Elle ne voit pas la
        # déflation : un script qui, par régression, CESSERAIT de détecter ferait baisser son compte
        # sous le cliquet, et resterait vert pendant qu'une vraie violation passe - un faux vert.
        # Cet auto-test plante une violation témoin par script et exige qu'il la voie, et la même en
        # commentaire pour qu'il ne la compte pas. Il ferme le trou de la passe 6 de clôture.
        #
        # ⚠️ Et le harnais lui-même a désormais son auto-test, lancé d'abord (#4268). Il prouvait que
        # chaque détecteur détecte, sans que rien ne prouve qu'il les exerce TOUS : `2635` et `3947`
        # n'avaient aucun cas témoin, et n'étaient donc tenus que par leur cliquet - c'est-à-dire par
        # un compte qui ne monte pas, le trou exact que ce mécanisme existe pour fermer.
        run: |
          set -euo pipefail
          python3 scripts/adr/verifie_scripts.py --auto-test
          python3 scripts/adr/verifie_scripts.py

      - name: "Auto-test des passes du graphe de connaissance (bloquant, #4231)"
        # Ces deux scripts n'avaient aucun dispositif, et les deux annonçaient des chiffres
        # qu'aucune donnée ne soutenait : une couverture CLI de « 128/69 », et un rapport ouvrant
        # sur « 0 files · ~0 words » suivi de « corpus is large enough ». Le premier était visible
        # parce qu'un ratio au-dessus de 1 crève les yeux ; il aurait tout aussi bien pu rendre
        # « 65/69 », faux, plausible, et cru sur parole.
        #
        # Les auto-tests n'ont besoin d'aucune dépendance : `graphify` n'est pas installé sur le
        # runner, et le cas qui prouve que la détection vient bien de lui injecte un faux module
        # plutôt que de balayer le disque. Coût mesuré : 0,03 s pour les deux.
        run: |
          set -euo pipefail
          python3 scripts/graphify/pont_ressources.py --auto-test
          python3 scripts/graphify/rebuild.py --auto-test

      - name: "Auto-test de la veille des plateformes (bloquant, #3526)"
        # Le verdict rougit dans le train de publication ; l'auto-test du JUGE tourne ici, à chaque PR.
        # Un juge qui aurait cessé de juger laisserait partir le train sur une preuve absente, et son
        # silence passerait pour un feu vert - c'est le patron de `veille-contrat-api.sh`.
        run: bash .github/scripts/veille-plateformes.sh --auto-test

      - name: "Auto-test du garde de durée du portail (bloquant, #3661)"
        # Il est arrivé avec un fichier `bats` plutôt qu'un auto-test - la seule exception des onze
        # scripts -, ce qui faisait attendre à ses cas l'assemblage d'un fat-jar de 80 Mo dont ils
        # n'ont aucun besoin. Rentré dans le rang, il s'exécute ici, sans rien construire.
        run: bash .github/scripts/mesure-duree-portail.sh --auto-test

      - name: "Auto-test du garde de titre de PR (bloquant, #2947)"
        # Même raisonnement que l'étape précédente, appliqué au garde qui vit hors de `scripts/adr`.
        # Il refuse deux choses : un titre hors Conventional Commits, et un tiret cadratin. La seconde
        # règle compte doublement, parce que ce titre devient la ligne du CHANGELOG à la fusion en
        # squash, et que le CHANGELOG est le seul fichier que la typographie ne peut pas rattraper
        # après coup. Un garde qui cesserait de détecter laisserait la source se rouvrir en silence.
        run: bash .github/scripts/verifie-titre-pr.sh --auto-test
