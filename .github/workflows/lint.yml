# Portail qualité statique : formatage + complétude des captures + le rapport PMD, que les cliquets
# ADR jugent. PMD lui-même ne bloque pas : voir le pas « Portail qualité » et l'ADR 4617.
# Aucun test ici : la suite complète (et le seuil de couverture JaCoCo bloquant)
# vit dans maven.yml, pour ne pas exécuter les tests deux fois par PR.
# `solution` est conservée pendant la transition (avant la consolidation en `main`).
name: Quality gate

on:
  push:
    branches: [solution, main]
  pull_request:
  workflow_dispatch:

# Annule un run superseded sur la même ref (pushes/PR rapprochés).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  banc-filme:
    # Les auto-tests des DEUX bancs filmés : celui de la recette
    # (`.github/scripts/lance-test-filme.sh`, #3883) et celui de la documentation
    # (`scripts/doc-video/filme-un-parcours.sh`, #3887). Ils partagent leur outillage d'affichage,
    # donc ils partagent ce job.
    #
    # Le second n'était lancé NULLE PART. Il figurait dans les chemins déclencheurs de `docs.yml`
    # - le modifier réveillait le workflow - mais aucune étape n'exécutait ses cas. C'est exactement
    # le défaut que #3883 avait fermé pour le premier banc, refait dans l'outil bâti pour le
    # combattre : un garde de soixante-cinq cas dont personne ne vérifiait qu'il passe.
    #
    # Et `verifie-inventaires-ci.sh` ne pouvait pas le dire : il ne regardait alors que
    # `.github/scripts` et `.github/assets`. Un banc rangé sous `scripts/` lui était invisible.
    #
    # Ils n'avaient JAMAIS tourné en CI. Quatorze scripts lancent leur `--auto-test` dans le job
    # `lint` ci-dessous ; celui-ci n'y était pas, faute d'outillage - et `recette-filmee.yml`, qui
    # l'installe, est à déclenchement MANUEL. Entre deux séances, rien n'exerçait le garde du banc.
    #
    # ## Pourquoi un job à part, et non une étape de `lint`
    #
    # Trois mesures ont tranché, plutôt qu'une préférence :
    #
    #   | `lint` aujourd'hui                          |  67 s |
    #   | l'`apt-get install` de l'outillage          |  34 s |
    #   | l'auto-test lui-même, 26 cas                |   6 s |
    #
    # Le coût n'est pas l'auto-test, c'est son outillage. Le poser dans `lint` porterait ce job à
    # ~107 s, soit +60 % sur celui dont tout l'intérêt est d'être court. Ici, les deux tournent en
    # PARALLÈLE derrière `Java CI` qui prend une dizaine de minutes : le coût horloge est nul.
    #
    # L'intention de l'ADR 3661 - les cas d'un garde de CI sont lancés par `lint.yml` - est donc
    # tenue sans en payer le prix sur le job rapide.
    runs-on: ubuntu-latest
    # Un butoir, parce que l'absence de butoir a bloqué une PR pendant **quarante minutes** sans
    # rien apprendre à personne. Le miroir Ubuntu d'Azure a rendu `fonts-urw-base35` (11 Mo) à une
    # poignée de kilo-octets par seconde ; l'installation, mesurée à 34 s la veille, n'était toujours
    # pas finie. Sans butoir, GitHub laisse courir six heures.
    #
    # Un garde qui peut bloquer indéfiniment est pire qu'un garde qui échoue : il ne dit rien, et il
    # retient tout le monde.
    #
    # Douze minutes n'étaient plus vingt fois la mesure nominale, elles étaient devenues trop
    # justes. L'outillage pèse **91,2 Mo** : à 2,7 Mo/s - le miroir en forme - c'est 34 s ; à
    # 0,2 Mo/s - le miroir de ce soir - c'est huit minutes rien que pour le téléchargement, et le
    # job mourait au butoir sans avoir lancé un seul cas. Vingt-cinq minutes couvrent le miroir
    # dégradé sans rien couvrir d'infini. Le chiffre à relire pour le régler de nouveau est celui
    # qu'APT annonce lui-même à l'installation : « Need to get 0 B/91.2 MB of archives ».
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Le releveur de planchers refuse d'avoir lu zéro
        # Il ne devine aucun chiffre : il lance le garde et LIT le verdict rendu. Son motif était
        # positionnel, si bien qu'un champ inséré au milieu par #5014 lui a fait perdre la ligne. Il
        # n'a alors rien relevé en annonçant « chaque seuil colle à sa mesure » : un message qui
        # affirme ce qu'il n'a pas vérifié, et le pire mode de panne pour un outil de remède (#5021).
        #
        # Son auto-test portait déjà le cas qui l'aurait attrapé, et ne tournait NULLE PART. C'est
        # cette moitié-là qui compte : un garde que rien ne joue ne garde rien.
        run: python3 scripts/methode/releve-les-planchers.py --auto-test

      - name: Cache des .deb (le dépaquetage, lui, se refait)
        # Ce cache-ci porte sur les `.deb`, pas sur l'état installé : `dpkg` tourne donc à chaque
        # run, et avec lui les scripts post-installation - `fc-cache` compris. On perd le temps du
        # dépaquetage ; on garde des polices réellement enregistrées.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          # La clé NOMME ce qu'elle contient. Ajouter un paquet sans la changer ferait servir un
          # cache d'avant, et le défaut n'apparaîtrait qu'au second passage - celui qui TROUVE le
          # cache, pas celui qui le remplit.
          key: apt-${{ runner.os }}-banc-filme-imagemagick

      - name: Installer de quoi afficher et filmer
        # PAS le cache de fichiers, et c'est une leçon payée. `awalsh128/cache-apt-pkgs-action`
        # restaure des fichiers sans rejouer les scripts post-installation ; j'avais jugé ffmpeg
        # « paquet de fichiers », et c'est faux : sa fermeture de dépendances tire DIX paquets de
        # polices - fonts-droid-fallback, fonts-noto-mono… - et `fc-cache` ne tourne pas.
        #
        # Conséquence mesurée : le premier run qui a TROUVÉ le cache a fait tomber cinq cas du banc
        # de recette, tous ceux qui écrivent du texte dans une vidéo de test (`drawtext` cherche une
        # police par fontconfig). Le run précédent, cache froid, passait - donc la panne n'apparaît
        # qu'au second passage, ce qui la rend d'autant plus traître.
        #
        # Ce job REND des images : il installe pour de vrai.
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: |
          bash .github/scripts/installer-paquets.sh xvfb xdotool ffmpeg x11-utils openbox tesseract-ocr tesseract-ocr-fra

      - name: Le banc de recette, ses cas et ses rouges attendus
        run: |
          chmod +x .github/scripts/lance-test-filme.sh
          ./.github/scripts/lance-test-filme.sh --auto-test

      - name: Le banc de documentation, ses cas et ses rouges attendus
        # Sans `udisks2`, `dosfstools` ni `mtools`, et c'est voulu : l'auto-test ne monte aucune
        # carte, il éprouve les REFUS du montage - étiquette étrangère, point vide, source sans
        # brut - qui sont du raisonnement pur. Le banc distingue depuis #4013 les outils qu'il lui
        # faut toujours de ceux qu'un parcours à carte réclame, ce qui évite d'installer un service
        # de disques sur un runner pour vérifier des chaînes de caractères.
        run: bash scripts/doc-video/filme-un-parcours.sh --auto-test

      - name: Installer ImageMagick, que le runner ne fournit pas
        # « L'image `ubuntu-latest` ne fournit AUCUN ImageMagick », comme le dit déjà
        # `capture-vues.yml`. Mesuré ici en le supposant présent : l'étape suivante a rendu
        # « ImageMagick requis pour l'auto-test » et le job entier avec.
        #
        # `--avec-recommandations` parce que le paquet `imagemagick` ne tire ses binaires que par ses
        # recommandations : sans le drapeau, `convert` reste introuvable.
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: bash .github/scripts/installer-paquets.sh --avec-recommandations imagemagick

      - name: Les deux comparaisons visuelles, et leurs grandes images
        # `compare-apercus.sh` avait un `--auto-test` de huit cas qui ne tournait NULLE PART. Le
        # même défaut que celui décrit plus haut pour le banc de documentation, dans un autre outil :
        # un garde dont personne ne vérifie qu'il passe.
        #
        # Et il ne l'aurait pas vu de toute façon : ses images faisaient 80 × 40, quand le défaut
        # n'apparaît qu'AU-DELÀ DU MILLION DE PIXELS - ImageMagick y écrit ses comptes en notation
        # scientifique, « 1.2034e+06 ». Trente-trois captures du dépôt dépassent ce seuil, et pour
        # elles la part de pixels changés valait « ? ». Les deux auto-tests portent désormais chacun
        # leur cas de grande image (#4274).
        #
        # Ils vivent ici et non dans `lint` parce que celui des tournages a besoin de ffmpeg, que ce
        # job installe déjà.
        run: |
          chmod +x .github/assets/compare-apercus.sh .github/assets/compare-tournages.sh
          ./.github/assets/compare-apercus.sh --auto-test
          ./.github/assets/compare-tournages.sh --auto-test

  outillage-release:
    # release.yml ne se déclenche qu'au push sur `main` : aucune CI de PR ne traverse la chaîne de
    # publication, donc une erreur d'installation ou de configuration ne se verrait qu'à la prochaine
    # release - c'est-à-dire en production, sur un dépôt qui publie à chaque fusion (#2738).
    #
    # Ce que ce job prouve DÉPEND du déclencheur, et c'est à savoir avant de lire son vert (#3345) :
    #   - sur une PR, `semantic-release` s'arrête sur « triggered by a pull request » APRÈS avoir chargé
    #     les greffons mais AVANT d'analyser l'historique. Le vert dit « ça s'installe et ça se charge » ;
    #   - sur `main`, il va jusqu'à l'analyse et au calcul de version. C'est là que le contrôle est réel.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `contents: write` alors que ce job n'écrit rien : `semantic-release` vérifie qu'il POURRAIT pousser
    # un tag dès `verifyConditions`, y compris en `--dry-run`. Sous le plancher `contents: read` du
    # workflow, il échouait donc sur `main` par `EGITNOPERMISSION` - sauf quand un checkout obsolète le
    # faisait sortir plus tôt, ce qui produisait un vert signifiant « contrôle sauté » (#3345).
    #
    # Le droit accordé est borné et VÉRIFIÉ SUR PLACE : l'invocation est en `--dry-run`, et l'étape
    # « La configuration d'analyse dérive bien de celle du dépôt » échoue si la liste des greffons n'est
    # pas exactement commit-analyzer + release-notes-generator, donc si un greffon d'écriture y entrait.
    # Déclaration par job et non plancher : c'est le patron posé par #2739, que garde `verifie_permissions.py`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # ⟨profondeur⟩ Le checkout ne prend QUE la pointe. L historique entier, dont
        # `semantic-release` a besoin, arrive a l etape suivante - la ou une reprise est possible,
        # ce que `actions/checkout` n offre pas. Ce clone-la partait en vrille assez souvent pour
        # avoir bloque quatre PR le 2026-08-25 (#4440). Le butoir reste, en dernier recours.
        timeout-minutes: 5
        with:
          fetch-depth: 1 # l'historique vient a l'etape suivante, avec reprise (#4440)

      - name: Rapatrier l'historique et les tags, avec reprise
        # `semantic-release` a besoin de l'historique entier. Le demander au checkout n'offre AUCUNE
        # reprise, et ce clone part en vrille assez souvent pour avoir bloque quatre PR le meme jour
        # (#4440). Ici la vrille coute une minute et non quinze : on reessaie, et la mediane des
        # memes fetch est de trente secondes.
        shell: bash
        run: |
          for essai in 1 2 3; do
            if timeout 120 git fetch --unshallow --tags origin 2>/dev/null \
               || timeout 120 git fetch --tags origin 2>/dev/null; then
              echo "historique rapatrie a l'essai ${essai}"
              exit 0
            fi
            echo "::warning::essai ${essai} de rapatriement d'historique sans succes, on reessaie"
          done
          echo "::error::trois essais de rapatriement d'historique ont echoue (#4440)"
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Installer l'outillage depuis le lockfile
        # `npm ci` échoue si le lockfile ne correspond pas au package.json : c'est la garantie que
        # ce qui s'installera au moment de publier est exactement ce que le dépôt déclare.
        run: npm ci --prefix .github/release

      - name: "Les specs principales d'OpenSpec valident (bloquant, #4962)"
        # Les trois gardes OpenSpec anterieurs portent sur la coherence de l'outillage avec lui-meme ;
        # aucun n'executait `openspec validate`. Celui-ci le fait, et REFUSE sur un corpus vide :
        # l'outil sort en 0 en ecrivant « No items found to validate », donc un garde qui l'appellerait
        # nu deviendrait muet en ayant l'air sain le jour ou la racine des specs bouge.
        run: |
          npm ci --prefix .github/openspec
          python3 scripts/methode/verifie-specs-valides.py --auto-test
          python3 scripts/methode/verifie-specs-valides.py

      - name: "Les invocations d'OpenSpec citées dans nos fichiers existent (bloquant, #4514)"
        # Ce pas vit dans CE job, et non dans `lint`, pour une raison matérielle : il a besoin de la
        # ligne de commande OpenSpec, donc de Node, et `outillage-release` est le seul job qui en
        # dispose déjà. L'y ajouter coûte une installation ; lui créer un job coûterait un checkout
        # et un setup-node de plus.
        #
        # Ce que le garde tient : les douze fichiers d'OpenSpec DÉCRIVENT le contrat de la ligne
        # de commande, et une invocation approximative n'y casse rien. Elle attend dans le texte et
        # échoue le jour où un agent suit l'instruction qui la cite, loin de sa cause.
        #
        # L'auto-test tourne d'abord, et son PREMIER cas est un témoin vert. Ce garde est vert sur
        # le corpus d'aujourd'hui, où les neuf invocations citées existent toutes : un garde qui
        # rougirait sur tout rougirait aussi sur ses états cassés, et ses rouges ne diraient rien.
        run: |
          npm ci --prefix .github/openspec
          python3 scripts/methode/verifie-sous-commandes-openspec.py --auto-test
          python3 scripts/methode/verifie-sous-commandes-openspec.py --verifie

      - name: La configuration d'analyse dérive bien de celle du dépôt
        # Elle ne recopie pas les parserOpts, elle les hérite : une copie divergerait, et la version
        # calculée en vérification ne serait plus celle que la publication calculera.
        run: |
          node -e "
            const c = require('./.github/release/release.config.js');
            const noms = c.plugins.map((p) => (Array.isArray(p) ? p[0] : p));
            const attendus = ['@semantic-release/commit-analyzer', '@semantic-release/release-notes-generator'];
            if (JSON.stringify(noms) !== JSON.stringify(attendus)) {
              throw new Error('greffons d\'analyse inattendus : ' + noms.join(', '));
            }
            const motif = c.plugins[0][1] && c.plugins[0][1].parserOpts && c.plugins[0][1].parserOpts.headerPattern;
            if (!motif) {
              throw new Error('parserOpts non hérités de .releaserc.json : la version calculée divergerait');
            }
            console.log('Configuration d\'analyse : ' + noms.length + ' greffon(s), parserOpts hérités.');
          "

      - name: Répétition à blanc de la chaîne de publication
        # `--dry-run` n'écrit rien et la configuration d'analyse n'embarque aucun greffon d'écriture :
        # cette étape ne peut pas publier. Elle prouve que l'outillage s'installe et que les greffons se
        # chargent ; sur `main` seulement, elle prouve en plus que l'historique est lisible et qu'une
        # version se calcule (sur une PR, semantic-release s'arrête avant, cf. l'en-tête du job).
        run: |
          cd .github/release
          ./node_modules/.bin/semantic-release --dry-run 2>&1 | tee ../../repetition.log
          etat=${PIPESTATUS[0]}
          # Un checkout devenu obsolète (une autre fusion a atterri entre-temps) fait sortir
          # semantic-release en 0 AVANT l'analyse. Le vert dirait alors « rien vérifié » sans le dire :
          # c'est le faux vert de #3345. On ne rougit pas pour autant - la course est bénigne et un
          # rouge les jours de fusion dense apprendrait à ne plus lire ce job - mais on l'ANNONCE.
          if grep -q "behind the remote" ../../repetition.log; then
            echo "::warning::Copie locale en retard sur le distant : la répétition à blanc s'est arrêtée avant l'analyse. Ce vert ne dit rien de l'historique ni du calcul de version."
            echo "## Répétition à blanc : non jouée" >> "$GITHUB_STEP_SUMMARY"
            echo "La copie locale était en retard sur \`main\` (fusion concurrente) : \`semantic-release\` s'est arrêté avant d'analyser l'historique." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$etat"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          # JDK Temurin standard (sans JavaFX) : JavaFX 26 vient des dépendances Maven
          # org.openjfx. La Headless Platform (glass.platform=Headless) est 100 % logicielle.
          check-latest: false
          cache: maven

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: "Installer les dépendances déclarées des gardes (#5008)"
        # Neuf gardes de ce job portent `import yaml`, et rien ne déclarait PyYAML : ils ne
        # marchaient que parce que l'image `ubuntu-latest` le fournit. Une dépendance qu'on a sans
        # le savoir tombe le jour où l'image change, et l'erreur accuse alors la PR qui passait par
        # là. Elle est désormais épinglée dans `pyproject.toml` et installée ici.
        run: pip install --group gardes

      - name: Formatage Spotless (bloquant)
        # Spotless est opt-in (pas de binding Maven) : on l'exécute explicitement ici pour
        # qu'un code non formaté fasse échouer la CI, même sans le hook pre-commit local.
        run: ./mvnw -B spotless:check --file pom.xml

      - name: Épinglage des actions et conteneurs
        # Un tag peut être repointé sur un autre commit sans que rien ne bouge chez nous : ce qui
        # s'exécute dans nos workflows changerait alors sans qu'aucun commit ne le dise (#2737).
        # Sans cette garde, la prochaine action ajoutée le serait par tag et l'épinglage se
        # déferait en silence.
        # L'autotest tourne d'abord, comme pour la garde jeton : une règle relâchée passerait sinon au
        # vert sur un dépôt propre, sans que rien ne le dise.
        run: |
          chmod +x .github/scripts/verifie-epinglage.sh
          ./.github/scripts/verifie-epinglage.sh --auto-test
          ./.github/scripts/verifie-epinglage.sh

      - name: Le Flatpak peut ouvrir une fenêtre sous Wayland
        # `--socket=fallback-x11` n'accorde X11 que si Wayland est ABSENT, alors que JavaFX rend par
        # GTK en X11. Sur GNOME et KDE - donc chez la plupart des utilisateurs - le paquet mourait au
        # démarrage sur « Unable to open DISPLAY », et RIEN ne l'a vu : le pas « Démarrage réel » de
        # flatpak.yml tourne en headless, donc sans affichage, et les essais locaux passaient tous
        # `--nosocket=wayland`, ce qui prenait par accident le seul chemin qui marche.
        # C'est une politique de permissions, lisible dans le manifeste : on la garde ici, hors ligne,
        # plutôt que d'installer un compositeur sur le runner.
        run: |
          chmod +x .github/scripts/verifie-affichage-flatpak.sh
          ./.github/scripts/verifie-affichage-flatpak.sh --auto-test
          ./.github/scripts/verifie-affichage-flatpak.sh

      - name: Moindre privilège des workflows
        # #2739 a retiré les droits d'écriture du plancher de release.yml pour les déclarer job par
        # job. Rien ne l'empêchait de se défaire : une PR qui les remettrait au plancher passerait
        # toutes les autres gardes (#3294).
        run: |
          chmod +x .github/scripts/verifie_permissions.py
          python3 .github/scripts/verifie_permissions.py --auto-test
          python3 .github/scripts/verifie_permissions.py

      - name: "Un chemin suivi ne porte que de l'ASCII (bloquant, #5089)"
        # `git ls-files` et `git diff --name-only` échappent les chemins non-ASCII par défaut, ce
        # qui les rend invisibles à tout outillage qui teste ensuite l'existence du fichier. Le
        # 2026-09-01 une passe de mise à jour du graphe a écarté 50 fichiers de `brief/` en silence
        # et pris 6 renommages pour 56 suppressions. Rien n'a rougi.
        #
        # Tolérance zéro plutôt que cliquet : #5089 a renommé les 101 chemins fautifs, la zone est
        # donc à zéro le jour de la décision. Le garde ne dit rien de la casse, des espaces ni des
        # apostrophes, que `core.quotePath` n'échappe pas et qui ne sont pas la cause.
        run: |
          chmod +x .github/scripts/verifie-chemins-ascii.sh
          ./.github/scripts/verifie-chemins-ascii.sh --auto-test
          ./.github/scripts/verifie-chemins-ascii.sh

      - name: Un secret de plateforme ne dépasse pas son pas
        # Posé dans l'`env:` d'un JOB, un jeton Vigie-Chiro n'est pas offert au pas qui en a
        # besoin : il l'est à tout ce que le job exécute. `ConnexionModule` lit `System.getenv`, les
        # forks surefire héritent de l'environnement du job, et l'URL de base vaut la production : la
        # suite de tests entière serait armée face à la plateforme réelle.
        #
        # Et rien côté serveur ne peut le rattraper : le rôle `Lecteur` est déclaré mais AUCUNE
        # route ne l'accepte, `GET /moi` compris. La lecture seule ne tient que par cette portée.
        run: |
          chmod +x .github/scripts/verifie-portee-des-secrets.sh
          ./.github/scripts/verifie-portee-des-secrets.sh --auto-test
          ./.github/scripts/verifie-portee-des-secrets.sh

      - name: Le verdict du tournage lit le XML, pas le texte
        # Les rapports `.txt` de surefire annoncent « Tests run: 0 » sur une classe à `@Nested` et
        # rendent 0 : un compteur qui les lirait dirait « aucun échec » sur un tournage à moitié rouge.
        # Ses deux contrôles négatifs comptent autant que le reste : « aucun rapport » n'est pas
        # « aucun échec », et une ERREUR compte autant qu'une défaillance - c'est par une erreur qu'un
        # banc refusant faute de jeton se signale.
        run: |
          chmod +x .github/scripts/verdict-du-tournage.sh
          ./.github/scripts/verdict-du-tournage.sh --auto-test

      - name: Le tournage nomme les cas qu'il n'a pas rendus
        # Son oracle comparait deux nombres, « 111 cas sur 116 », sans jamais dire lesquels : il
        # fallait refaire son calcul à la main pour l'apprendre. Et le compte attendu incluait les cas
        # des scénarios exclus du build sans jeton, si bien qu'un tournage non connecté ne pouvait pas
        # l'atteindre - le train a cessé de verser ses clips Java pendant cinq jours sans le dire.
        # Son contrôle négatif est celui qui compte : un index illisible REFUSE au lieu de conclure
        # qu'aucun cas ne manque.
        run: |
          chmod +x .github/scripts/cas-manquants-du-tournage.sh
          ./.github/scripts/cas-manquants-du-tournage.sh --auto-test

      - name: La révocation du jeton sait ce qui vaut succès
        # Sa règle est de celles qu'une relecture distraite retourne : `404` et `401` sont des
        # SUCCÈS, parce que l'objectif n'est pas « le serveur a répondu 200 » mais « ce jeton ne sert
        # plus à personne ». Les lire comme des échecs ferait avertir à chaque tournage dont le jeton
        # avait déjà expiré, et on apprendrait à ignorer la ligne.
        #
        # Seul le verdict est éprouvé ici : l'appel réseau reste au bord, et il n'a rien à faire dans
        # un job de lint.
        run: |
          chmod +x .github/scripts/revoque-jeton.sh
          ./.github/scripts/revoque-jeton.sh --auto-test

      - name: Les décisions du tournage connecté tiennent encore
        # Le refus de `clips-connectes` par `comparer-tournages.yml` EST un garde, et rien ne le
        # gardait : un `if` mal écrit le neutraliserait sans que rien ne rougisse, et la comparaison
        # recommencerait à mesurer la plateforme en croyant mesurer le rendu.
        #
        # Ce refus n'est pas relu, il est LANCÉ : il vit dans un `run:`, donc du shell. Un garde
        # qu'on exécute vaut mieux qu'un garde qu'on relit - la technique a sorti un défaut réel
        # d'`api-live.yml` le jour où elle a été essayée (#4328).
        run: |
          chmod +x .github/scripts/verifie_decisions_du_tournage_connecte.py
          python3 .github/scripts/verifie_decisions_du_tournage_connecte.py --auto-test
          python3 .github/scripts/verifie_decisions_du_tournage_connecte.py

      - name: La forme d un jeton se cherche, et le garde avoue ce qu il ne lit pas
        # Trois de ses six cas doivent rester VERTS : empreintes, identifiants et longueurs
        # voisines ne sont pas des jetons, et une IMAGE portant le motif ne doit pas le faire rougir -
        # il ne sait pas la lire, et prétendre le contraire serait pire que ne rien faire.
        #
        # Un quatrième vérifie qu'il NOMME le fichier qu'il a écarté. C'est ce qui l'empêche d'être
        # un faux vert : sans cette phrase, on croirait le canal des clips couvert.
        run: |
          chmod +x .github/scripts/verifie-forme-du-jeton.sh
          ./.github/scripts/verifie-forme-du-jeton.sh --auto-test

      - name: La sonde partagée rend un code et ne le juge pas
        # Les trois appelants la partagent, et leurs verdicts sur un `401` diffèrent - refuser,
        # avertir, ou conclure au succès. C'est pourquoi seule la MESURE descend ici.
        #
        # Le cas central est celui qui vérifie qu'elle NE JUGE PAS : le `run:` d'`api-live.yml`
        # tourne sous `bash -e`, donc une sonde jugeante ferait échouer son pas sur un jeton expiré,
        # ce que son tri refuse explicitement. Trouvé par mutation : rien ne le gardait.
        run: |
          chmod +x .github/scripts/interroge-le-jeton.sh
          ./.github/scripts/interroge-le-jeton.sh --auto-test

      - name: Le contrôle du jeton sépare ses deux causes
        # Trois verdicts et non deux, et c'est tout l'objet de cet auto-test : « pas 200 » recouvre
        # un jeton mort - on en pose un frais - et une plateforme muette - poser un jeton frais n'y
        # changerait rien. Les fondre referait, un cran plus loin, le défaut de #4328.
        #
        # Sa table est celle de `revoque-jeton.sh` LUE À L'ENVERS : `401` est un refus ici, un
        # succès là-bas. Les deux passent par leurs codes connus à chaque lint, parce que deux
        # scripts voisins qui se contredisent finissent par s'harmoniser par erreur.
        run: |
          chmod +x .github/scripts/verifie-jeton-vivant.sh
          ./.github/scripts/verifie-jeton-vivant.sh --auto-test

      - name: La porte d installation porte ses cas
        # Elle est en travers du chemin de tous les workflows, y compris ceux qui publient : un
        # défaut y serait indiscernable d'une panne de miroir.
        run: bash .github/scripts/installer-paquets.sh --auto-test

      - name: Aucun workflow n appelle apt-get directement
        # Trois étapes de trois workflows ont pendu le même jour sur `apt-get update`, jusqu'au
        # butoir de leur job et jusque sur `main`. Le remède avait été appliqué à UNE des trois.
        run: |
          chmod +x .github/scripts/verifie-apt.sh
          ./.github/scripts/verifie-apt.sh --auto-test
          ./.github/scripts/verifie-apt.sh

      - name: Tout job porte un butoir
        # Un job sans `timeout-minutes` que GitHub laisse courir SIX HEURES a bloqué une PR
        # 4 h 15 sur un `apt-get install` de police, en `-qq` donc sans une ligne de log. Le butoir
        # de #3883 avait été apprécié pour le seul `banc-filme` ; vingt-six autres jobs n'en avaient
        # aucun, dont ceux qui publient.
        run: |
          chmod +x .github/scripts/verifie_butoirs.py
          python3 .github/scripts/verifie_butoirs.py --auto-test
          python3 .github/scripts/verifie_butoirs.py

      - name: Une entrée booléenne ne se compare pas à une chaîne
        # `inputs.x == 'true'` vaut TOUJOURS faux, et `!= 'true'` TOUJOURS vrai : une entrée
        # `type: boolean` arrive comme un vrai booléen, et comparer deux types différents les casse
        # tous les deux en nombres. Mesuré sur le run 32395513266 : le remuxage des clips était sauté
        # alors que le film existait, et le témoin « sans gestionnaire de fenêtres » installait quand
        # même openbox - la garde qui prouve que la vérification du pointeur garde quelque chose ne
        # gardait donc rien elle-même.
        run: |
          chmod +x .github/scripts/verifie_conditions_booleennes.py
          python3 .github/scripts/verifie_conditions_booleennes.py --auto-test
          python3 .github/scripts/verifie_conditions_booleennes.py
          chmod +x .github/scripts/clips-orphelins.sh
          ./.github/scripts/clips-orphelins.sh --auto-test

      - name: Les scripts shell passent shellcheck
        # Les RÉGLAGES (exclusions) vivent dans `.shellcheckrc`, pas ici : un contributeur qui
        # lance `shellcheck son-script.sh` doit voir la même chose que ce pas. Seul le SEUIL est un
        # drapeau, parce que `severity=` n'est pas lu depuis le fichier de réglages - vérifié, et
        # non supposé : les notes continuaient de sortir.
        #
        # `-S info` et non `warning` : au seuil warning, un `rm -f $fichiers` non quoté passait au
        # vert. C'est un SC2086, donc une « info » - et c'est exactement la remarque qui a trouvé un
        # vrai défaut dans `clips-orphelins.sh` (#4106). Un garde qui manquerait le défaut qui l'a
        # fait naître ne garderait pas grand-chose.
        #
        # La PARITÉ porte sur les réglages, PAS sur la version. Mesuré sur ce pas même : le
        # runner a signalé un `SC2015` que shellcheck 0.11.0 ne signale plus en local. C'est donc la
        # CI qui fait foi, et un poste plus récent peut être plus PERMISSIF - l'inverse de ce que
        # j'avais d'abord écrit ici. `shellcheck --version` avant de conclure d'un vert local.
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null 2>&1 || {
            echo "::error::shellcheck absent du runner : l'image a changé, il faut l'installer par la porte."
            exit 1
          }
          mapfile -t scripts < <(
            find . -path ./target -prune -o -path '*/node_modules/*' -prune -o -name '*.sh' -print | sort
          )
          echo "${#scripts[@]} script(s) analysé(s)."
          shellcheck --shell=bash -S info "${scripts[@]}"

      - name: La condition d'un job appuyé sur un « needs » nomme l'état qu'elle attend
        # GitHub saute un job dès qu'un ANCÊTRE a été sauté, sauf si son `if:` porte une fonction
        # d'état : sans elle, la condition est enveloppée en `success() && (...)` sur tout le graphe
        # amont, et la porte qu'on croit tenir n'est jamais évaluée. Mesuré sur le run 32224321373 :
        # la 2.186.0 a eu son tag, son CHANGELOG et sa Release, puis aucun installeur - `installers`
        # et `publish` descendaient d'une garde que le train programmé saute toujours. Le run était
        # VERT, et personne ne l'a vu pendant huit jours (#4079).
        run: |
          chmod +x .github/scripts/verifie_conditions_de_job.py
          python3 .github/scripts/verifie_conditions_de_job.py --auto-test
          python3 .github/scripts/verifie_conditions_de_job.py

      - name: Les renvois entre workflows visent un libellé existant
        # Un `workflow_run` désigne le workflow attendu par son `name:`, apparié par égalité stricte.
        # Un libellé mort n'arme rien et ne rougit pas : il n'y a AUCUN run à regarder. #3279 l'a payé
        # trois semaines de documentation non republiée, repérées à l'œil et non par la CI (#3287).
        run: |
          chmod +x .github/scripts/verifie_renvois_workflows.py
          python3 .github/scripts/verifie_renvois_workflows.py --auto-test
          python3 .github/scripts/verifie_renvois_workflows.py

      - name: Les inventaires que la CI tient sur elle-même concordent
        # Ce dépôt exige de son PRODUIT que ses inventaires soient prouvés - commandes CLI contre
        # `dev-docs/cli.md`, vues contre captures, ADR contre index et nav. De sa propre description, il
        # n'exigeait rien, et les trois inventaires avaient dérivé : deux workflows absents du tableau -
        # les deux de SÉCURITÉ -, six gardes autotestées absentes de l'autre (#3771, #3794).
        #
        # L'autotest tourne d'abord, et son premier cas est un contrôle NÉGATIF : un dépôt cohérent doit
        # rester vert, `maven.yml` cité cinq fois compris. Une règle qui compterait des lignes au lieu
        # de comparer des fichiers rougirait sur un tableau juste, et se ferait retirer.
        run: |
          chmod +x .github/scripts/verifie_inventaires_ci.py
          python3 .github/scripts/verifie_inventaires_ci.py --auto-test
          python3 .github/scripts/verifie_inventaires_ci.py

      - name: "Un nom d'étape dit en entier ce qu'il écrit (bloquant, #4255)"
        # Un `#` précédé d'une espace ouvre un commentaire YAML, y compris au milieu d'un nom non
        # cité : `name: Auto-test des scripts ADR (bloquant, #2467)` valait `… (bloquant,`. Six
        # étapes de `lint.yml` et `maven.yml` perdaient ainsi leur numéro d'issue - c'est-à-dire ce
        # qui sert à retrouver pourquoi elles existent. Le fichier avait raison, l'interface
        # tronquait, et rien ne signalait l'écart.
        #
        # L'auto-test d'abord : une garde qui aurait cessé de voir laisserait revenir la troncature
        # sur un dépôt propre, et son silence passerait pour un feu vert.
        run: |
          set -euo pipefail
          python3 .github/scripts/verifie_noms_d_etapes.py --auto-test
          python3 .github/scripts/verifie_noms_d_etapes.py
      - name: Aucun jeton VigieChiro en clair
        # Le scan de secrets de GitHub ne reconnaît que les motifs de FOURNISSEURS ; un jeton
        # VigieChiro est une chaîne opaque qu'aucun catalogue ne connaît, et les motifs
        # personnalisés demandent GitHub Advanced Security, indisponible ici (#2741).
        # L'autotest tourne d'abord : une garde dont le motif a été relâché passerait sinon au vert
        # sur un dépôt propre, sans que rien ne le dise.
        run: |
          chmod +x .github/scripts/verifie-jeton.sh
          ./.github/scripts/verifie-jeton.sh --auto-test
          ./.github/scripts/verifie-jeton.sh

      - name: Le garde de fraîcheur des épinglages sait encore rougir
        # Il ne mesure pour de vrai que le lundi, dans `securite-dependances.yml`, parce que la mesure
        # demande le réseau et que l'amont bouge sans nous. Son autotest, lui, est hors ligne : c'est
        # le seul contrôle qui passe à chaque PR, et sans lui un seuil relâché - une majeure de retard
        # requalifiée en simple avertissement - passerait au vert sans que rien ne le dise (#3382).
        run: |
          chmod +x .github/scripts/verifie_fraicheur_actions.py
          python3 .github/scripts/verifie_fraicheur_actions.py --auto-test

      - name: La veille de fraîcheur du contrat API sait encore rougir
        # Elle ne tourne pour de vrai que dans api-live.yml, une fois par semaine : son autotest est
        # le seul endroit où on la voit à l'œuvre à chaque PR. Sans lui, un durcissement de seuil ou
        # un `skipped` compté comme une exécution réelle passeraient inaperçus jusqu'au jour où on
        # compterait sur elle (#2748).
        run: |
          chmod +x .github/scripts/veille-contrat-api.sh
          ./.github/scripts/veille-contrat-api.sh --auto-test

      - name: La garde du démarrage des emballages sait encore rougir
        # Elle ne tourne pour de vrai que dans `release.yml` (les enveloppes) et `maven.yml`
        # (l'app-image et l'aller-retour tar.gz). `release.yml` n'étant traversé par AUCUNE PR, son
        # étape pourrait être fusionnée cassée et ne se découvrir qu'au train suivant, en bloquant la
        # publication. Cet autotest est la seule chose qui la voie entre deux releases (#3617).
        run: |
          chmod +x .github/scripts/verifie-demarrage-emballage.sh
          ./.github/scripts/verifie-demarrage-emballage.sh --auto-test

      - name: La garde du secret winget sait encore rougir
        # Elle ne tourne pour de vrai que dans winget.yml, sur dispatch manuel, c'est-à-dire quelques
        # fois par an : son autotest est le seul endroit où on la voit à l'œuvre entre deux
        # soumissions. Elle a passé neuf mois à ne savoir que RÉUSSIR - un secret absent sortait en
        # vert - et c'est précisément le défaut que cet autotest fige (#2213).
        run: |
          chmod +x .github/scripts/verifie-secret-winget.sh
          ./.github/scripts/verifie-secret-winget.sh --auto-test

      - name: Complétude des captures de référence
        # Chaque vue FXML doit avoir au moins une capture de référence déclarée au manifeste
        # (les captures illustrent la documentation).
        # L'auto-test d'abord : une règle relâchée passerait sinon au vert sur un dépôt cohérent.
        run: |
          chmod +x .github/assets/check-captures.sh
          ./.github/assets/check-captures.sh --auto-test
          ./.github/assets/check-captures.sh

      - name: Enregistrement des outils de capture
        # Chaque outil de capture (classe outils/Capture* avec un main) doit figurer dans le
        # tableau MAINS de capture-screenshots.sh, sinon ses PNG ne seraient jamais régénérés.
        run: |
          chmod +x .github/assets/check-capture-mains.sh
          ./.github/assets/check-capture-mains.sh --auto-test
          ./.github/assets/check-capture-mains.sh

      - name: "Portail qualité (PMD) : le rapport, que le cliquet 4617 juge"
        # `test-compile` et non `compile` depuis #4617 : le portail analyse desormais les DEUX
        # zones, et PMD a besoin des classes de test compilées pour résoudre leurs types. Ne PAS
        # remplacer par `-Pquality-gate verify -DskipTests` : sans jacoco.exec, jacoco:check passe
        # silencieusement au vert au lieu de bloquer. Le seuil de couverture bloquant est appliqué
        # dans maven.yml, là où les tests tournent.
        #
        # `pmd:pmd` et non `pmd:check` : ce pas PRODUIT le rapport, il ne juge pas. Le verdict
        # revient au cliquet de l'ADR 4617, lancé par le pas suivant, parce que `failOnViolation`
        # est binaire là où il faut une marge - et parce qu'une seule des sept règles, les littéraux
        # dupliqués, n'a pas de sens dans la zone de test et doit y être écartée. PMD ne sait pas
        # exprimer cette différence : les quatre formes essayées sont dans l'ADR.
        run: ./mvnw -B test-compile pmd:pmd

      - name: Cliquets ADR (bloquant)
        # Chaque script `probable` (scripts/adr/NNNN-*.py) rend un code non nul quand le nombre de
        # suspects DÉPASSE le cliquet déclaré dans l'ADR : un cas a été ajouté. C'est ici que le
        # cliquet devient un vrai garde-fou, sur CHAQUE PR.
        #
        # Sans cette étape, le cliquet n'était vérifié que par le rapport hebdomadaire, qui observe
        # sans juger : une régression (un `Alert` de plus hors port, une classe CSS redéfinie)
        # passait donc en silence jusqu'au lundi suivant, et même là ne rougissait pas. La doc et les
        # PR du chantier ADR affirmaient pourtant « le cliquet fait rougir la CI si un cas s'ajoute » ;
        # cette étape rend l'affirmation vraie. python3 est préinstallé sur le runner, les scripts
        # n'ont aucune dépendance hors stdlib.
        run: |
          set -euo pipefail
          echec=0
          for script in scripts/adr/[0-9]*.py; do
            python3 "$script" || echec=1
          done
          exit "$echec"

      - name: "Auto-test des scripts ADR (bloquant, #2467)"
        # L'étape précédente échoue quand un script SUR-compte (un cas s'ajoute). Elle ne voit pas la
        # déflation : un script qui, par régression, CESSERAIT de détecter ferait baisser son compte
        # sous le cliquet, et resterait vert pendant qu'une vraie violation passe - un faux vert.
        # Cet auto-test plante une violation témoin par script et exige qu'il la voie, et la même en
        # commentaire pour qu'il ne la compte pas. Il ferme le trou de la passe 6 de clôture.
        #
        # Et le harnais lui-même a désormais son auto-test, lancé d'abord (#4268). Il prouvait que
        # chaque détecteur détecte, sans que rien ne prouve qu'il les exerce TOUS : `2635` et `3947`
        # n'avaient aucun cas témoin, et n'étaient donc tenus que par leur cliquet - c'est-à-dire par
        # un compte qui ne monte pas, le trou exact que ce mécanisme existe pour fermer.
        run: |
          set -euo pipefail
          python3 scripts/adr/verifie_scripts.py --auto-test
          python3 scripts/adr/verifie_scripts.py

      - name: "Aucun temoin de la suite n'est decoratif (bloquant, #4490)"
        # La suite ci-dessus clot sur « les N scripts charges DETECTENT leur violation temoin ». La
        # phrase affirmait plus que ce qu'elle verifie : un temoin peut exister, s'executer, passer,
        # et ne rien tenir. Celui du cliquet de longueur d'ADR n'affirmait que
        # `isinstance(suspects(), list)`, et un garde ayant cesse de detecter le passait (#4487).
        #
        # Ce garde-ci rend l'article A2 mecanique : chaque garde perd sa detection, la suite doit
        # rougir. Cout mesure, 1,2 s pour 23 gardes. Il vient APRES la suite, dont il depend.
        run: |
          set -euo pipefail
          python3 scripts/adr/verifie_temoins_non_decoratifs.py --auto-test

      - name: "Un contrat declare ne contredit pas le garde (bloquant, #5108)"
        # `imprime_contrat` refuse un contrat INCOMPLET ; rien ne le confrontait au reel. Un contrat
        # que personne ne confronte est un commentaire, et il derive : la docstring de 2843 a
        # annonce deux arbres pour un corpus qui n'en portait qu'un, pendant des mois (#5048).
        #
        # La regle n'est pas l'egalite. Le vocabulaire differe, et le contrat sait souvent PLUS que
        # l'inference : un silence de celle-ci n'est pas une contradiction.
        run: |
          set -euo pipefail
          python3 scripts/adr/verifie_contrats_tiennent.py --auto-test
          python3 scripts/adr/verifie_contrats_tiennent.py

      - name: "Un point d'entree de scripts/adr declare ce qu'il est (bloquant, #5149)"
        # Le sous-chantier #5117 a porte ce dossier de 2 contrats a 41 sur 41. Rien n empechait le
        # 42e d arriver sans le sien : un garde neuf s ecrit sur le modele d un voisin, dont on
        # copie le bloc de verdict et pas la declaration. L invariant refuse, sans marge a relever.
        run: |
          python3 scripts/adr/verifie_contrat_obligatoire.py --auto-test
          python3 scripts/adr/verifie_contrat_obligatoire.py

      - name: "Aucun appel de verdict ne cache ce qu'il a lu (bloquant, #5049)"
        # Le sous-chantier #5015 a converti 33 appels, et son bilan nommait cette dette : rien
        # n'empechait un appel neuf de naitre muet. La regression a eu lieu en QUELQUES HEURES,
        # sur `5068-clic-sur-reference-tenue.py`, dont l'auteur ne pouvait pas le savoir.
        #
        # L'auto-test tient les deux moities : un appel muet est vu, et un appel qui declare ne
        # l'est PAS. Un garde qui refuserait tout passerait la premiere.
        run: |
          set -euo pipefail
          python3 scripts/adr/verifie_verdicts_declares.py --auto-test
          python3 scripts/adr/verifie_verdicts_declares.py
          python3 scripts/adr/verifie_temoins_non_decoratifs.py

      - name: "Le corpus d'un garde se declare une fois (bloquant, #4586)"
        # #4488 a decide que les gardes de code lisent les DEUX arbres. La decision etait tenue par
        # une liste ECRITE A LA MAIN dans `verifie_scripts.py`, et cette liste avait derive : dix
        # entrees pour quinze gardes portant le chemin de l'arbre de test. Six n'etaient verifies
        # par rien, et un garde qui cesse de lire un arbre ne rougit pas - son compte baisse, et un
        # cliquet ne se plaint pas qu'on lui retire du corpus.
        #
        # La liste se derive desormais de ce que chaque garde importe de `_commun`. Ce refus-ci est
        # ce qui rend la derivation fiable : sans lui, un garde neuf reecrirait le chemin en clair
        # et redeviendrait invisible a la liste. Cf. ADR 4586.
        run: |
          set -euo pipefail
          python3 scripts/adr/verifie_corpus_declare.py --auto-test
          python3 scripts/adr/verifie_corpus_declare.py

      - name: "Un garde tourne dans SON depot, pas celui de l'appelant (bloquant, #4781)"
        # `rapport.py` lancait chaque garde par `subprocess.run` sans `cwd`, donc chacun heritait du
        # repertoire de l'appelant. Mesure : lance depuis `/tmp`, CINQ cliquets sur dix-huit
        # rendaient une autre valeur, dont quatre tombaient a zero faute de trouver quoi que ce soit.
        #
        # Ce n'est pas un rapport faux et sans suite : `resserre_cliquets.py` agit sur ces verdicts
        # et ECRIT. Eprouve le 2026-08-29, il a ramene quatre champs `ratchet:` a zero dans les
        # vraies ADR - 4, 2, 1 et 2 - en annoncant un succes et en sortant 0.
        #
        # Le temoin emploie une SONDE plutot que de relancer les dix-huit gardes : elle imprime son
        # repertoire, et le cas « lance du depot » evite que le cas « lance d'ailleurs » ne passe au
        # vert parce que le repertoire d'essai serait par hasard le bon. Cout mesure : 0,1 s.
        run: python3 scripts/adr/rapport.py --auto-test

      - name: "Auto-test des passes du graphe de connaissance (bloquant, #4231)"
        # Ces deux scripts n'avaient aucun dispositif, et les deux annonçaient des chiffres
        # qu'aucune donnée ne soutenait : une couverture CLI de « 128/69 », et un rapport ouvrant
        # sur « 0 files · ~0 words » suivi de « corpus is large enough ». Le premier était visible
        # parce qu'un ratio au-dessus de 1 crève les yeux ; il aurait tout aussi bien pu rendre
        # « 65/69 », faux, plausible, et cru sur parole.
        #
        # Les auto-tests n'ont besoin d'aucune dépendance : `graphify` n'est pas installé sur le
        # runner, et le cas qui prouve que la détection vient bien de lui injecte un faux module
        # plutôt que de balayer le disque. Coût mesuré : 0,03 s pour les deux.
        run: |
          set -euo pipefail
          python3 scripts/graphify/pont_ressources.py --auto-test
          python3 scripts/graphify/rebuild.py --auto-test

      - name: "Auto-test de la veille des plateformes (bloquant, #3526)"
        # Le verdict rougit dans le train de publication ; l'auto-test du JUGE tourne ici, à chaque PR.
        # Un juge qui aurait cessé de juger laisserait partir le train sur une preuve absente, et son
        # silence passerait pour un feu vert - c'est le patron de `veille-contrat-api.sh`.
        run: bash .github/scripts/veille-plateformes.sh --auto-test

      - name: "Auto-test du tri des échecs de plateforme (bloquant, #4544)"
        # Le juge du passage hebdomadaire n'avait AUCUN témoin, l'un des trois scripts de
        # `.github/scripts` dans ce cas. Le défaut a vécu là : un passage coupé par son plafond se
        # déclarait « complet », sans échec, et rendait 0. Rien ne pouvait le voir.
        run: bash .github/scripts/trie-les-echecs-de-plateforme.sh --auto-test

      - name: "Auto-test du garde de verdict avant fusion (bloquant, #4571)"
        # Ce garde-ci ne tourne PAS en CI : il se lance à la main avant de fusionner, parce qu'en
        # faire un check requis repaierait ce que l'ADR 0041 a déjà mesuré - deux chemins d'écriture
        # vers `main` cassés en une heure, dont la chaîne de publication. Seuls ses cas tournent ici,
        # et c'est le seul endroit où il peut être vu rougir.
        run: bash .github/scripts/verifie-verdict-avant-fusion.sh --auto-test

      - name: "Auto-test du garde de clôture consignée (bloquant, #4659)"
        # Ses cas tournent HORS LIGNE : la liste des EPIC s'injecte par `CLOTURE_EPICS_FICHIER`, sans
        # quoi il faudrait la forge pour éprouver un garde, et un garde dont les cas ne se relancent
        # pas ne se relance jamais.
        run: bash .github/scripts/verifie-cloture-consignee.sh --auto-test

      - name: "Auto-test du garde de spécification consignée (bloquant, #4922)"
        # Copie d'ADR 4659 pour la forme, et son voisin pour le fond : celui-ci compte les clôtures
        # qui n'ont pas répondu à la passe 10. Ses cas s'injectent par `SPEC_EPICS_FICHIER`, donc ils
        # tournent hors ligne. Deux d'entre eux tiennent la raison pour laquelle il lit le CONTENU de
        # la ligne et non son numéro : #4840 a renuméroté le cycle.
        run: bash .github/scripts/verifie-specification-consignee.sh --auto-test

      - name: "Auto-test du garde de chantier de l issue (bloquant, #4649)"
        # Ses cas tournent HORS LIGNE : les parents s injectent par `CHANTIER_ISSUES_FICHIER`. Le
        # garde lui-même vit dans `corps-pr.yml`, qui seul dispose du corps de la demande.
        run: python3 .github/scripts/verifie_chantier_de_l_issue.py --auto-test

      - name: Auto-test du rappel de critère de fin
        run: bash .github/scripts/rappelle-le-critere-de-fin.sh --auto-test

      - name: Auto-test de la loupe des lots sans critère
        run: python3 scripts/adr/loupe-4992-lots-sans-critere.py --auto-test

      - name: "Clôture consignée : un EPIC clos porte sa trace (bloquant, #4659)"
        # Celui-ci interroge la forge, d'où le jeton. Il REFUSE si elle ne répond pas : un cliquet qui
        # conclut sur ce qu'il n'a pas lu vaut moins que pas de cliquet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verifie-cloture-consignee.sh

      - name: "Spécification consignée : une clôture répond à la passe 10 (bloquant, #4922)"
        # Il interroge la forge, d'où le jeton, et REFUSE si elle ne répond pas. Un EPIC clos SANS
        # AUCUNE trace ne lui appartient pas : c'est le cliquet de #4659 qui monte alors, et compter
        # la même faute deux fois ferait rougir deux gardes pour un seul manquement.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verifie-specification-consignee.sh

      - name: "Auto-test du garde de durée du portail (bloquant, #3661)"
        # Il est arrivé avec un fichier `bats` plutôt qu'un auto-test - la seule exception des onze
        # scripts -, ce qui faisait attendre à ses cas l'assemblage d'un fat-jar de 80 Mo dont ils
        # n'ont aucun besoin. Rentré dans le rang, il s'exécute ici, sans rien construire.
        run: bash .github/scripts/mesure-duree-portail.sh --auto-test

      - name: "Auto-test du garde de titre de PR (bloquant, #2947)"
        # Même raisonnement que l'étape précédente, appliqué au garde qui vit hors de `scripts/adr`.
        # Il refuse deux choses : un titre hors Conventional Commits, et un tiret cadratin. La seconde
        # règle compte doublement, parce que ce titre devient la ligne du CHANGELOG à la fusion en
        # squash, et que le CHANGELOG est le seul fichier que la typographie ne peut pas rattraper
        # après coup. Un garde qui cesserait de détecter laisserait la source se rouvrir en silence.
        run: bash .github/scripts/verifie-titre-pr.sh --auto-test

      - name: "Auto-test du garde de corps de PR (bloquant, #4453)"
        # Le corps de la PR est de la prose visible au sens de l'article A31, et il n'est jamais
        # commis : aucun garde de fichiers ne pouvait l'atteindre. Celui-ci refuse ce qu'un motif
        # sait voir - cadratin, apostrophe courbe, élision sans apostrophe - et laisse le reste de la
        # grille à la relecture. Ses onze cas comptent trois rouges et quatre contrôles négatifs :
        # un garde qui cesserait d'épargner un bloc de code se ferait contourner par suppression de
        # la citation, ce qui est pire que muet.
        run: bash .github/scripts/verifie-corps-pr.sh --auto-test

      - name: "Auto-test du cliquet de commentaire en corps de methode (bloquant, #4472)"
        # Ce cliquet tient une population que le cliquet 4359 ne voit pas. Le cas qui compte est
        # celui du MEME bloc hors puis dans un corps de methode : hors, c'est de l'en-tete de fichier
        # et il n'a rien a en dire ; dedans, c'est ce qu'il tient. Un garde qui confondrait les deux
        # compterait les licences, et sa liste grossirait sans qu'un commentaire ait bouge.
        run: python3 scripts/adr/4472-commentaire-en-corps.py --auto-test
      - name: "Auto-test du cliquet de javadoc non relue (bloquant, #4468)"
        # Ce cliquet tient DEUX faits, et le second est celui qui le distingue d'une case cochée :
        # une javadoc réécrite sous une entrée existante voit son empreinte changer, donc le fichier
        # redevient suspect. Un garde qui ne tiendrait que le premier laisserait passer exactement le
        # geste qu'on veut empêcher, et resterait vert. Ses neuf cas portent les deux.
        run: python3 scripts/adr/4468-javadoc-non-relue.py --auto-test
      - name: "Auto-test de la loupe des lots multi-PR (bloquant, #4712)"
        # Cette loupe ne refuse rien : elle met les lots d'un EPIC sous les yeux pour que la question
        # du sous-chantier se pose. Son seul defaut possible est donc de MAL LIRE, et il se
        # presenterait comme un rapport propre. Ses temoins tiennent les deux lectures qui comptent :
        # recoller les lignes de continuation d'un lot, et ne pas confondre `#46` avec `#4`.
        run: python3 scripts/adr/loupe-4712-lots-multi-pr.py --auto-test
      - name: "Auto-test du compte des reliquats (bloquant, #4859)"
        # Son seul défaut possible est de MAL COMPTER, et il se présenterait comme un rapport propre.
        # Ses témoins tiennent ce qui décide : le compte est différentiel, et un dossier étranger à la
        # suite reste dehors.
        run: python3 scripts/methode/compte-les-reliquats.py --auto-test

      - name: "Auto-test du relevé des bancs instables (bloquant, #4806)"
        # Ce relevé lit les TENTATIVES d'un run, pas son verdict courant : une relance écrase l'échec
        # précédent, si bien que la signature d'une instabilité est invisible dans `gh run list`.
        # Ses témoins tiennent les deux lectures qui comptent : les deux formes sous lesquelles
        # surefire nomme un test échoué, et le tri par fréquence, dont la mutation a d'abord survécu
        # parce que le témoin rangeait ses noms dans le même ordre que l'alphabet.
        run: python3 scripts/methode/releve-les-bancs-instables.py --auto-test
      - name: "Auto-test du compteur qui ÉCRIT le manifeste (bloquant, #4527)"
        # Le cliquet ci-dessus VÉRIFIE le manifeste ; ce compteur l'ÉCRIT, et il n'avait aucun cas.
        # `--marque` acceptait n'importe quel fichier existant : l'entrée n'était ensuite ni relue,
        # ni périmée, ni signalée, puisque le parcours ne lit que les deux arbres Java, et elle
        # grossissait le total annoncé. Deux chiffres qui devraient dire la même chose divergeaient.
        # Ses dix cas tiennent les deux portes, l'entrée et la sortie : ce qui n'a rien à faire au
        # manifeste est refusé, et ce qui a cessé d'y correspondre est nommé.
        run: python3 scripts/methode/couverture-relecture.py --auto-test
      - name: "Le manifeste de relecture ne porte pas d'entrée morte (bloquant, #5086)"
        # Le manifeste se vérifie dans DEUX sens, et un seul était tenu. Le cliquet 4468 parcourt le
        # CORPUS et nomme ce qui n'y est pas relu ; une entrée qui désigne un fichier disparu lui est
        # invisible, puisqu'elle n'est jamais parcourue. `--verifie` fait le trajet inverse, du
        # manifeste vers le corpus, et c'est le seul qui voie une entrée morte.
        #
        # Elle n'est pas inoffensive : elle « ne garde rien, et compte dans le total », donc la
        # couverture annoncée est fausse dans le sens qui flatte. Un renommage l'a produite le
        # 2026-09-01, et rien ne l'a signalé pendant que le mode existait sans être appelé.
        #
        # Le coût est mesuré : 5,54 s.
        run: python3 scripts/methode/couverture-relecture.py --verifie

      - name: "La loupe de couverture OpenSpec compte juste (bloquant, #4922)"
        # Une LOUPE, pas un garde : elle sort toujours 0 et ne refuse rien. Seul son comptage est tenu
        # ici, et l'un de ses cas dit lequel se trompe le plus facilement - une delta spec archivée
        # compterait deux fois la même capacité, gonflant le numérateur sans que rien ne le montre.
        # Ce qui REFUSE est le cliquet de la même ADR, plus haut dans ce fichier.
        run: python3 scripts/methode/couverture-openspec.py --auto-test

      - name: "Le relevé des contrats de garde s'éprouve (bloquant, #4636)"
        # Le relevé COMPARE deux arbres, et l'autre n'existe pas sur le runner : seul son
        # auto-test tourne ici. Sans lui, l'outil qui doit voir les gardes hors service serait
        # lui-même le premier à l'être - c'est le défaut que ce lot corrige, retourné contre son
        # propre outil.
        run: python3 scripts/methode/contrats-des-gardes.py --auto-test

      - name: Le paquet OKF des décisions est conforme (bloquant)
        # `dev-docs/decisions` est un paquet OKF depuis #4336 : chaque ADR porte un en-tête typé, se
        # rattache à un article de la constitution, et gage le niveau de vérification qu'elle
        # déclare. Avant ce garde, 194 documents se disaient tous « Accepté » et rien ne pouvait le
        # contredire.
        # L'auto-test tourne d'abord, comme pour ses voisins : il casse à la main ce que chacun des
        # refus prétend attraper, et exige de le voir rougir. Le dernier cas est le contrôle de
        # non-vacuité, un paquet sain qui doit rester vert : un garde qui rougit de toute façon
        # rougirait aussi sur les mutations, et son rouge ne prouverait rien.
        run: |
          python3 scripts/adr/verifie_okf.py --auto-test
          python3 scripts/adr/verifie_okf.py

      - name: "Trois refus portes par la ligne d'origine (bloquant, #4462)"
        # Trois zones a TOLERANCE ZERO, chacune avec son auto-test avant son passage sur le depot.
        #
        # `verifie_javadoc_sans_doublon` : deux lignes de javadoc identiques et consecutives sont une
        # coupe ratee, jamais une intention. Il a trouve deux defauts reels a son arrivee, tous deux
        # des copier-coller qui decrivaient le champ d'a cote.
        #
        # `verifie_encart_de_revision` : une ADR depassee le dit SOUS SON TITRE, et l'encart n'annonce
        # que ce que son en-tete declare. Un encart qui inventerait une relation serait pire que pas
        # d'encart du tout, puisqu'on le lit pour savoir ce qui fait foi.
        #
        # `verifie_taille_des_cibles` : une cible cliquable declaree fait au moins 24 x 24 px, seuil
        # WCAG 2.5.8 niveau AA. Il ne voit que les dimensions DECLAREES, ce que sa javadoc dit.
        run: |
          python3 scripts/adr/verifie_javadoc_sans_doublon.py --auto-test
          python3 scripts/adr/verifie_javadoc_sans_doublon.py
          python3 scripts/adr/verifie_encart_de_revision.py --auto-test
          python3 scripts/adr/verifie_encart_de_revision.py
          python3 scripts/adr/verifie_taille_des_cibles.py --auto-test
          python3 scripts/adr/verifie_taille_des_cibles.py

      - name: "Aucun lien de javadoc que le formateur casserait (bloquant, #4493)"
        # Palantir replie une ligne trop longue a la derniere espace qui tient. Si cette espace tombe
        # DANS le texte d'un lien markdown, il coupe le lien et NE REPOSE PAS le prefixe `///` : la
        # continuation devient du code, et le fichier cesse de compiler. Mesure du 2026-08-26 :
        # `spotless:apply` sort ensuite en erreur sur le fichier qu'il vient d'ecrire lui-meme.
        #
        # Tolerance zero, et gratuite : zero ligne du depot est dans ce cas a l'ouverture du garde.
        run: |
          set -euo pipefail
          python3 scripts/adr/verifie_lien_javadoc_formatable.py --auto-test
          python3 scripts/adr/verifie_lien_javadoc_formatable.py

      - name: La matrice de la constitution est à jour (bloquant)
        # La matrice relie chaque article à ce qui l'applique, et NOMME les articles que rien ne
        # tient. C'est cette dernière colonne qui vaut le déplacement : elle est la liste des
        # chantiers de garde restants, et un article qui y séjourne est une dette, pas une fatalité.
        # Elle est engendrée depuis les en-têtes des ADR : un chiffre que le code sait recalculer ne
        # s'écrit pas à la main (ADR 2750).
        run: |
          python3 scripts/methode/matrice-constitution.py --auto-test
          python3 scripts/methode/matrice-constitution.py --verifie

      - name: La matrice des heuristiques d'ergonomie est à jour (bloquant)
        # Même idée que la matrice de la constitution, sur l'annexe des heuristiques : la ligne qui
        # vaut le déplacement est celle qui rend zéro, car elle nomme ce dont personne n'a décidé.
        # Elle est engendrée depuis les en-têtes des ADR, jamais saisie.
        run: |
          python3 scripts/methode/matrice-ergonomie.py --auto-test
          python3 scripts/methode/matrice-ergonomie.py --verifie

      - name: Le registre éditorial ne se retourne pas en silence (bloquant)
        # `dev-docs/registre-editorial.md` écarte le connecteur lourd AU MOTIF qu'il rend zéro en
        # ouverture de phrase. Un motif d'écartement qui cesse d'être vrai ne rougit nulle part : la
        # page continue de dire pourquoi la règle n'existe pas, et la raison a disparu.
        # L'auto-test éprouve d'abord le compteur : un zéro rendu par un compteur cassé se lit comme
        # un zéro rendu par un corpus propre.
        run: |
          python3 scripts/methode/mesure-registre.py --auto-test
          python3 scripts/methode/mesure-registre.py --verifie

      - name: Le bandeau des ADR rend ce qu'il promet (bloquant)
        # `scripts/mkdocs/bandeau_adr.py` redessine le statut, le chantier et la vérification en tête
        # de chaque page d'ADR : la conversion OKF les a fait passer en front-matter, que MkDocs
        # retire du corps rendu. Sans lui, elle serait un recul pour le lecteur humain.
        # Son absence de couverture était MUETTE : s'il cessait de reconnaître l'en-tête, il rendrait
        # le markdown inchangé, 199 pages sortiraient sans bandeau, et `mkdocs --strict` ne dirait
        # rien. Trois mutations plantées le font rougir (#4379).
        run: python3 scripts/mkdocs/bandeau_adr.py --auto-test

      - name: Les adaptateurs de compétences suivent leur source (bloquant)
        # Le fonds des compétences vit dans `.agents/skills/`, hors de tout dossier de marque, et
        # `.claude/skills/` n'en est qu'une copie. Sans ce garde, une compétence corrigée à la
        # source laisserait un agent lire l'ancienne version, sans que rien ne rougisse : une copie
        # périmée se lit exactement comme une copie à jour.
        # L'auto-test monte trois états cassés sur une copie jetable et exige de rougir sur chacun,
        # puis le garde mesure l'arbre réel. Un garde vert n'est pas un garde vérifié.
        run: |
          python3 scripts/methode/synchronise-adaptateurs.py --auto-test
          python3 scripts/methode/synchronise-adaptateurs.py --verifie

      - name: "La version d'OpenSpec epinglee vaut celle que les competences declarent (bloquant, #4512)"
        # Les douze fichiers d'OpenSpec portent `generatedBy` et decrivent le contrat de la ligne de
        # commande de CETTE version : ses sous-commandes, les champs de son JSON. Une version
        # installee qui differe ferait decrire un contrat perime par des fichiers qui se lisent
        # comme vrais, et le defaut n'apparaitrait qu'au moment ou un agent suit une instruction
        # devenue fausse.
        # Le garde lit le LOCKFILE plutot que d'invoquer `openspec --version` : c'est la version du
        # depot qui fait foi, pas celle du poste, et ce job n'a donc besoin ni de Node ni de l'outil.
        # L'auto-test exige le vert sur un arbre sain avant les quatre rouges : un garde qui
        # rougirait sur tout rougirait aussi sur les quatre etats casses, et ne prouverait rien.
        run: |
          python3 scripts/methode/verifie-version-openspec.py --auto-test
          python3 scripts/methode/verifie-version-openspec.py --verifie

      - name: "L'adoption des competences OpenSpec resiste a une regeneration (bloquant, #4516)"
        # Les six competences ont ete ADOPTEES par #4515 : reecrites en francais, elles ne sont
        # plus du texte amont. `openspec update --force` les rend a l'anglais amont, et la commande
        # fait exactement ce qu'elle promet : c'est nous qui avons change de camp. Mesure du lot :
        # apres un --force reel au foyer isole, le marqueur `langue: fr` retombe de 12/12 a 0/12 et
        # ce garde passe au rouge ; SANS --force, l'outil repond « All tools up to date », ne
        # reecrit rien, et le garde reste vert. Le controle negatif compte autant que le rouge,
        # sans quoi le garde rougirait sur un geste anodin et serait desactive.
        # Aucun besoin de Node ni de l'outil : le garde ne lit que l'en-tete des competences.
        run: |
          python3 scripts/methode/verifie-adoption-openspec.py --auto-test
          python3 scripts/methode/verifie-adoption-openspec.py --verifie

      - name: "Un renvoi cite par une competence a une cible ou un repli (bloquant, #4564)"
        # Une competence qui renvoie vers `/realiser` promet qu'une commande de ce nom existe. Le
        # garde de #4514 lit les invocations de la LIGNE DE COMMANDE, `openspec <sous-commande>` ;
        # celui-ci lit les commandes barre-oblique du CLIENT, qui sont une autre famille. Rien ne
        # reliait un `/nom` cite a l'existence du fichier correspondant, et c'est ce qui a laisse
        # passer le renvoi vers `/opsx:continue` au moment precis ou l'agent est bloque.
        # Deux cas acceptes, et deux seulement : la commande existe, ou la competence declare le
        # flux optionnel et donne le repli. Le second porte le seul usage legitime, un flux amont
        # que ce depot n'installe pas.
        # Le motif a ete EPROUVE avant d'etre cru : exiger l'apostrophe fermante juste apres le nom
        # manquait quatre `/realiser <autre>`, et `/tmp` se presentait comme une commande absente.
        run: |
          python3 scripts/methode/verifie-renvois-competences.py --auto-test
          python3 scripts/methode/verifie-renvois-competences.py --verifie

      - name: "Une étape du cycle ne délègue pas vers l'aval (bloquant, #4731)"
        # Les six competences du cycle s'enchainent dans un ordre. Une ETAPE NUMEROTEE qui delegue
        # vers l'aval envoie le lecteur faire maintenant un travail qui ne se fait qu'apres : il ne
        # peut pas obeir, et le texte ne lui dit pas pourquoi, donc il se croit en faute. Vecu le
        # 2026-08-29 : l'etape 1 d'`ouvrir-une-pr` deleguait a `clore-une-issue`, que #4722 venait
        # de deplacer APRES la fusion - et les deux se renvoyaient le corps de la PR, chacune
        # designant l'autre, si bien que personne ne le mettait au net.
        #
        # La PROSE reste libre de nommer la suite : c'est meme ce qu'on attend d'elle. Seules les
        # etapes sont tenues, parce qu'elles prescrivent un geste a faire MAINTENANT.
        #
        # Il REFUSE plutot que de sauter : les six ne titrent pas leur liste pareil - « Fonction de
        # garde », « Les cinq etapes », « Les quatorze passes ». Un motif cale sur un seul titre en
        # sauterait deux sur six et rendrait vert. La liste se derive de sa forme, et une competence
        # dont aucune liste n'est trouvee fait rougir (article A3).
        run: |
          python3 scripts/methode/etapes-sans-renvoi-aval.py --auto-test
          python3 scripts/methode/etapes-sans-renvoi-aval.py

      - name: "Un test cité par une page existe (bloquant, #4745)"
        # `mvn test -Dtest=Classe#methode` rend BUILD SUCCESS et « Tests run: 0 » quand la cible
        # n'existe pas. Une page qui donne un tel exemple ne desinforme pas seulement : elle met en
        # main une commande VERTE SANS AVOIR JUGE, au moment precis ou l'on doute d'une methode.
        # Vecu le 2026-08-29 : TESTING.md citait `#chargeLesSites`, absente, pendant que
        # dev-docs/tests-et-qualite.md donnait deux pages plus loin la forme juste.
        #
        # Le motif a ete EPROUVE avant d'etre cru : `-Dtest=A,B,C` dans ci-cd-release.md est un
        # gabarit de prose, dont un premier motif tirait une classe `A` introuvable. La regle qui
        # l'ecarte est DERIVEE et non enumeree - une citation ne compte que si elle nomme quelque
        # chose finissant par `Test`, et la convention la porte : 791 classes de test sur 791.
        run: |
          python3 scripts/methode/tests-cites-existent.py --auto-test
          python3 scripts/methode/tests-cites-existent.py

      - name: "Une citation de passe désigne une passe qui existe (bloquant, #4844)"
        # Le dépôt compte 299 citations de ses passes de clôture, dans 145 fichiers. Avant ce garde,
        # RIEN ne vérifiait qu'une citation désigne encore une passe qui existe : mesuré en #4518, une
        # citation remise à l'ancienne numérotation laissait verts les deux tests de documentation, la
        # boucle complète des cliquets et les deux gardes de méthode. Trente tests, aucun rouge.
        #
        # Les bornes sont DÉRIVÉES des titres du cycle, jamais écrites en dur : un garde qui porte le
        # compte en dur ment au prochain ajout, ce qui est le défaut qu'il doit empêcher.
        #
        # Ce qu'il NE couvre PAS : une citation valide mais fausse, dont le numéro existe et dont le
        # sens a glissé. Son en-tête le dit, pour qu'on ne lui prête pas cette portée.
        run: |
          python3 scripts/methode/passes-citees-existent.py --auto-test
          python3 scripts/methode/passes-citees-existent.py

      - name: "Concordances du cycle : commandes, tableau et compétences se répondent (bloquant, #4918)"
        # Quatre concordances, aucune tenue jusqu'ici : une commande ouvre une compétence qui existe,
        # le tableau en nomme une qui existe, la `description` annonce la passe que le tableau lui
        # attribue, aucune compétence n'est orpheline. La troisième s'était rompue : `ecrire-une-adr`
        # annonçait « pass 10 » quand le tableau lui donne les passes 0 et 11.
        #
        # `passes-citees-existent.py` ne pouvait pas le voir, et ce n'est pas un défaut de sa part : la
        # passe 10 EXISTE. Ce garde lit une concordance entre deux inventaires, non un numéro.
        #
        # Chacun de ses huit cas déclare LAQUELLE des quatre doit rougir, et non « rouge ou non » : la
        # première version ne lisait que le verdict, et quatre mutations sur cinq y survivaient parce
        # qu'un cas rougissait pour la mauvaise raison.
        run: |
          python3 scripts/methode/concordances-du-cycle.py --auto-test
          python3 scripts/methode/concordances-du-cycle.py

      - name: "Aucun auto-test de garde de méthode n'est décoratif (bloquant, #4760)"
        # L'article A2 demande qu'un garde soit vu ROUGE sur sa propre mutation.
        # `scripts/adr/verifie_temoins_non_decoratifs.py` le rend mecanique, mais pour `scripts/adr/`
        # seulement : les gardes de methode, dont onze bloquants ici, avaient un `--auto-test` que
        # rien n'obligeait a detecter quoi que ce soit.
        #
        # LA TRANSPOSITION N'EST PAS CELLE QU'ON CROIT. Les gardes d'ADR sont mutes en AJOUTANT la
        # neutralisation en fin de fichier, parce que le harnais les IMPORTE. Un garde de methode se
        # lance en `--auto-test` : son `raise SystemExit` part avant de l'atteindre, et la mutation
        # n'agit jamais. Cinq essais ont ainsi rendu « decoratif » pour cinq gardes, dont deux vus
        # rougir sur un vrai defaut le meme jour. La neutralisation s'INSERE avant le point d'entree.
        #
        # ET LA FONCTION D'AUTO-TEST EST EPARGNEE, sinon le garde rougit pour la mauvaise raison :
        # deux gardes nomment la leur `auto_test` sans souligne, et la neutraliser les faisait rougir
        # parce que leur point d'entree rendait une liste, non parce qu'ils avaient cesse de detecter.
        #
        # Il REFUSE plutot que de sauter : six gardes sans `if __name__` sont nommes a chaque
        # passage, leur sort etant decide par #4788.
        run: |
          python3 scripts/methode/temoins-de-methode-non-decoratifs.py --auto-test
          python3 scripts/methode/temoins-de-methode-non-decoratifs.py

      - name: "La méthode nomme le garde du titre, et ce garde refuse encore l'espace (bloquant, #4598)"
        # Le dépôt pratique deux conventions de titre à un caractère d'écart, et c'est la plus
        # écrite qui est fausse en PR : 62 des 100 derniers titres d'issue portent l'espace avant
        # les deux-points, quand les 100 dernières PR fusionnées sont à zéro. La seconde colonne
        # est propre parce que `titre-pr.yml` refuse, pas parce que la main écrit juste.
        # Le défaut n'entre pas au commit : les quatre PR rouges du 2026-08-26 partaient toutes
        # d'une branche aux sujets de commit conformes, et 286 des 297 sujets de branche le sont.
        # Il entre à la frappe du titre, quand la main écrit du français correct et lui applique la
        # typographie française. Le remède ne crée aucune règle, il fait lancer `verifie-titre-pr.sh`
        # avant l'ouverture de la PR ; ce garde tient les trois documents qui le nomment.
        # Il RELANCE le script cité sur deux titres témoins, l'un fautif et l'autre conforme : une
        # méthode qui nommerait une commande devenue permissive vaut moins que rien, son vert
        # rassurant. L'auto-test l'éprouve sur sept états cassés, dont ce desserrage.
        run: |
          python3 scripts/methode/verifie-controle-du-titre.py --auto-test
          python3 scripts/methode/verifie-controle-du-titre.py --verifie

      - name: "Un garde déclare ce dont il a besoin, comme le pom le déclare pour Java (bloquant, #5008)"
        # L'auto-test d'abord : un détecteur relâché passerait sinon au vert sur un dépôt conforme.
        # Le verdict ensuite, sur les deux arbres de gardes et le Python enfoui dans leurs heredocs.
        run: |
          python3 scripts/methode/verifie-dependances-declarees.py --auto-test
          python3 scripts/methode/verifie-dependances-declarees.py

      - name: "Le Python des gardes est formaté et sans reproche (bloquant, #5022)"
        # Le pendant de Spotless et PMD, qui tiennent le Java, et de shellcheck, qui tient le shell.
        # 13 965 lignes de Python n'avaient rien, et c'est la couche qui juge tout le reste.
        # Le format d'abord : un diff de forme noierait un diff de fond dans la revue suivante.
        run: |
          ruff format --check scripts .github/scripts
          ruff check scripts .github/scripts
