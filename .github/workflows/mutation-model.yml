# Mesure quotidienne de la qualité des tests par mutation (PIT), un paquet `model` par tour.
#
# Ce que PIT dit et que la couverture ne dit pas : si les tests **détectent** un changement de
# comportement. Le rendement est mesuré, pas supposé - sur ce dépôt, deux classes mutation-testées
# pendant #2554 ont donné trois défauts réels puis deux issues (#2638, #2639).
#
# Programmé et non par PR, pour deux raisons. PIT est **lent** : plus de dix minutes sur un seul paquet,
# et 2 h 35 sur le plus gros. Et un survivant n'est pas un défaut mais une **question** posée à un humain
# (vrai trou, mutant équivalent, artefact de ciblage) : bloquer une fusion là-dessus ferait cocher au
# hasard.
#
# ⚠️ PÉRIMÈTRE : **un paquet `model` par semaine**, et jamais les E2E ni la suite du réessai réseau
# côté tests. Chaque décision est mesurée, pas supposée (#2768) :
#
#   - le dépôt ENTIER n'a jamais fini : 1 h 54 sans aboutir, 19 expirations ;
#   - les paquets `model` d'un coup n'ont pas fini non plus : **tué à 300 minutes pile**, après avoir
#     traité 335 unités sur ~4 657 mutants. Ce n'est pas la lenteur d'un test qui l'a tué, c'est le
#     VOLUME - 4 657 mutants à quelques secondes chacun font cinq heures quelle que soit la finesse ;
#   - une feature à la fois, en revanche, aboutit : la mesure IHM a rendu 561 mutants en 51 minutes.
#
# D'où la rotation ci-dessous : la mesure est **complète sur un cycle, pas sur une semaine**. Même patron
# que `mutation-ihm.yml`, sans état à écrire ni relire - la semaine ISO choisit.
#
#   - un E2E est **large en couverture et pauvre en jugement**. `ParcoursDepotE2ETest` couvre à lui seul
#     8 539 blocs : PIT le retient comme test candidat pour des mutants situés dans des centaines de
#     classes, et rejoue le parcours entier - des minutes de TestFX - pour apprendre ce qu'un test
#     unitaire dit en millisecondes. Le premier passage sur le dépôt entier a produit 19 expirations en
#     une heure, toutes autour de ce parcours ;
#   - les exclure ne **cache** rien. Un mutant que seul un E2E tuerait est, par définition, un mutant
#     qu'aucun test unitaire ne détecte : il ressort désormais en SURVIVANT, c'est-à-dire en question
#     posée à un humain. C'est ce que ce rapport doit produire.
#
# Les classes de **vue** ont leur propre mesure : `mutation-ihm.yml`. Elles ne sont pas oubliées, elles
# sont mesurées ailleurs, avec des tests qui les jugent.
#
# ⚠️ `commun.api` est écarté côté TESTS, et c'est une nuance qui compte : ce n'est pas une classe mutée,
# c'est la suite du **réessai gradué** (#2354), la plus lente du dépôt (5,5 s). Son sujet est l'attente :
# tout mutant qui fait boucler le réessai une fois de plus dépasse le butoir de PIT (~11 s ici), et
# l'expiration y est un **effet du sujet**, pas un défaut d'outillage. Les 16 expirations du run tué
# pointaient vers elle. Ce qu'elle couvre au passage est mieux jugé par ses propres tests que par un
# rapport de mutation qui la fait expirer.
#
# NON BLOQUANT, comme le rapport ADR dont ce workflow est le calque : ici on observe, on ne juge pas.
#
# ⚠️ Un bilan quotidien que personne ne lit vaut moins qu'un bilan hebdomadaire qu'on lit : la fréquence
# ne crée pas l'attention. Le résumé du job reste le seul canal, délibérément - le rendre bloquant ferait
# cocher au hasard, et le pousser ailleurs demanderait de décider qui le reçoit.
#
# ⚠️ Le `test-compile` avant le but n'est pas une commodité : sans phase, `@{jacocoArgLine}` et
# `${net.bytebuddy:byte-buddy-agent:jar}` restent littérales dans l'argLine héritée de surefire, le
# minion reçoit un `-javaagent` inexistant et meurt sur un `MINION_DIED` muet. Ce piège a fait conclure
# une fois que PIT était incompatible avec ce dépôt (#2605).

name: mutation-model

on:
  schedule:
    # Chaque nuit à 3 h UTC, aux heures creuses. Le fichier s'appelait `mutation-hebdo` : un nom de
    # cadence devient faux dès qu'on change la cadence, d'où le renommage sur ce que la mesure PORTE.
    #
    # Pourquoi quotidien plutôt qu'hebdomadaire : la rotation par paquet rendait le cycle complet en
    # **17 semaines**, soit quatre mois pendant lesquels un trou de test pouvait vivre sans être vu.
    # Le même cycle en quotidien prend **17 jours**. Le dépôt est public, donc les minutes d'Actions
    # sont illimitées sur les runners standard : la fréquence ne coûte que du temps machine.
    #
    # Ce que le quotidien NE fait pas : cibler ce qui vient de changer. La rotation est aveugle au diff,
    # elle avance d'un paquet par jour quoi qu'on ait touché. Elle mesure plus souvent, pas plus juste.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      feature:
        description: "Feature dont le paquet model est muté (vide = celle du tour, déduite du jour)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mesurer:
    name: Mutation sur le dépôt
    runs-on: ubuntu-latest
    # Un paquet moyen tient sans peine : `saison.model` (4 classes, 86 mutants) a pris 12 minutes en
    # local, sans expiration, 97 % de détection.
    #
    # Et le plus gros aussi : `commun.model` (96 classes) a pris **2 h 35** en CI, 746 mutants, 92 % de
    # détection. L'extrapolation depuis `saison` annonçait 4 h 45 - pessimiste d'un facteur deux, parce
    # que le coût se compte en MUTANTS et non en classes.
    #
    # La borne reste donc un garde-fou d'interblocage, avec le double de la pire durée observée. Seul
    # `passage` (93 classes) n'a pas encore eu son tour ; il devrait suivre `commun`.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          check-latest: false
          cache: maven

      - name: Choisir le paquet du tour
        id: tour
        env:
          DEMANDEE: ${{ inputs.feature }}
        run: |
          set -euo pipefail
          # Les features possédant un paquet `model`, par poids décroissant. Les plus lourdes passent en
          # tête : ce sont elles dont les survivants coûtent le plus cher, et il vaut mieux les mesurer
          # tôt dans le cycle.
          FEATURES=(commun passage validation importation lot sites audit analyse diagnostic \
                    qualification multisite saison maj bibliotheque cli recherche connexion)
          if [ -n "${DEMANDEE}" ]; then
            FEATURE="${DEMANDEE}"
          else
            # Rotation sans état : le JOUR choisit, compté en jours depuis l'époque. Le tour complet prend
            # 17 jours. Le compte absolu évite la bascule d'année, qui ferait sauter ou répéter un paquet
            # avec un numéro de jour remis à 1.
            JOUR=$(( $(date -u +%s) / 86400 ))
            INDEX=$(( JOUR % ${#FEATURES[@]} ))
            FEATURE="${FEATURES[$INDEX]}"
          fi
          if [ ! -d "src/main/java/fr/univ_amu/iut/${FEATURE}/model" ]; then
            echo "::error::Feature « ${FEATURE} » sans paquet model : rien à mesurer."
            exit 1
          fi
          echo "feature=${FEATURE}" >> "$GITHUB_OUTPUT"
          echo "Paquet du tour : fr.univ_amu.iut.${FEATURE}.model"

      - name: Mesurer
        id: mesure
        env:
          PERIMETRE: fr.univ_amu.iut.${{ steps.tour.outputs.feature }}.model.*
        run: |
          set -euo pipefail
          # Headless : les propriétés vivent dans le profil `mutation` du pom (le minion n'hérite pas
          # des systemPropertyVariables de surefire). Ne pas les repasser ici - `-DjvmArgs` REMPLACE
          # la liste du profil au lieu de s'y ajouter.
          #
          # ⚠️ PAS d'analyse incrémentale. `historyInputFile`/`historyOutputFile` existent bien dans le
          # descripteur du greffon Maven - c'est ce qui avait été vérifié - mais depuis PIT 1.25.x le
          # STOCKAGE de l'historique est un greffon **commercial** (arcmutate). Les passer sans lui ne
          # les fait pas ignorer : PIT **refuse de démarrer** sur « History has been enabled but no
          # history plugin has been installed/activated », et le job entier échoue en 25 secondes.
          # Reproductible en local sur une seule classe. Conséquence (mesure intégrale chaque lundi) : #2768.
          ./mvnw -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage \
            -DtargetClasses="$PERIMETRE" \
            -DtargetTests="fr.univ_amu.iut.*" \
            -DexcludedTestClasses="fr.univ_amu.iut.e2e.*,fr.univ_amu.iut.commun.api.*"

      - name: Publier le bilan dans le résumé du job
        if: always()
        env:
          FEATURE: ${{ steps.tour.outputs.feature }}
        run: |
          set -uo pipefail
          # Volontairement sans `-e` : ce job OBSERVE. Un bilan manquant se dit, il ne se solde pas par
          # un job rouge - sans quoi « non bloquant » ne serait vrai que les bonnes semaines.
          echo "## Mutation du modèle : paquet \`${FEATURE}.model\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if python3 scripts/qualite/rapport_mutation.py --markdown >> "$GITHUB_STEP_SUMMARY"; then
            exit 0
          fi
          # Un bilan absent ou illisible serait lu comme « zéro survivant ». On le dit, plutôt que de
          # laisser un résumé vide passer pour une bonne nouvelle.
          {
            echo "## Mutation (PIT)"
            echo
            echo "La mesure n'a pas abouti : aucun rapport lisible cette semaine."
            echo
            echo "Ce n'est **pas** « zéro survivant » : c'est une absence de mesure."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Bilan de mutation absent ou illisible - une absence de mesure, pas un dépôt sain."

      # Le rapport HTML permet de descendre au mutant, ligne par ligne, quand le résumé pose une
      # question qui mérite qu'on l'ouvre.
      - name: Conserver le rapport détaillé
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-reports-model-${{ steps.tour.outputs.feature }}
          path: target/pit-reports/
          retention-days: 30
          if-no-files-found: ignore
