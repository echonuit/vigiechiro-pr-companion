# Éprouver qu'un runner PILOTE réellement un test filmé, et pas seulement qu'il l'exécute.
#
# ## Pourquoi ce workflow existe
#
# `lance-test-filme.sh` (#3696) réunit les cinq conditions d'un lancement filmé. Deux d'entre
# elles ne sont pas des propriétés Maven et dépendent de la MACHINE : un gestionnaire de fenêtres
# doit tourner sur le DISPLAY visé, et `WAYLAND_DISPLAY` doit être absent.
#
# ⚠️ Sans gestionnaire de fenêtres, le pointeur ne bouge pas - même pour `xdotool` - et pourtant
# les tests s'EXÉCUTENT sans erreur. Ils passent ou échouent pour de mauvaises raisons. Pire,
# certains passent avec un robot mort : `annuler_ne_transmet_rien` affirme qu'une valeur reste
# « intact », ce qui est vrai si l'on ne clique nulle part. Se fier au verdict de Maven ne suffit
# donc pas, et c'est tout l'objet de ce workflow.
#
# ## Ce qui fait foi ici
#
# Le pas de vérification du lanceur, qui teste le COMPORTEMENT du pointeur et non la présence
# d'un gestionnaire. Un gestionnaire installé mais inopérant passerait un contrôle de présence.
#
# ## Déclenchement
#
# Manuel seulement, pour l'instant. Le branchement sur la publication viendra avec le harnais de
# recette (EPIC #3667) : brancher un dispositif avant d'avoir ce qu'il doit garder n'apporterait
# qu'un vert de plus.

name: recette filmée

on:
  workflow_dispatch:
    inputs:
      classe:
        description: Classe de test à filmer
        type: string
        default: EditeurCommentaireTest
      sans_gestionnaire_de_fenetres:
        description: "Témoin : ne PAS installer le gestionnaire de fenêtres, le lancement doit alors être refusé"
        type: boolean
        default: false
      publier_les_clips:
        description: "Filmer TOUTES les classes citantes et publier les clips sur la pré-version « clips-recette »"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  filmer:
    name: Le runner pilote-t-il vraiment ?
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache des .deb (le dépaquetage, lui, se refait)
        # ⚠️ Ce cache-ci porte sur les `.deb`, pas sur l'état installé : `dpkg` tourne donc à chaque
        # run, et avec lui les scripts post-installation - `fc-cache` compris. On perd le temps du
        # dépaquetage ; on garde des polices réellement enregistrées.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          key: apt-${{ runner.os }}-recette-filmee

      - name: Installer de quoi afficher et filmer
        # ⚠️ Cache de l'état INSTALLÉ, pas des `.deb` : il saute aussi le dépaquetage. Convient ici
        # parce que ces paquets ne sont que des fichiers ; les polices et flatpak gardent
        # `installer-paquets.sh`, dont le post-install fait foi.
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: |
          bash .github/scripts/installer-paquets.sh --avec-recommandations xvfb xdotool ffmpeg x11-utils

      - name: Installer le gestionnaire de fenêtres
        # Le gestionnaire de fenêtres est posé À PART, pour que le témoin puisse s'en passer : c'est
        # tout l'objet de `sans_gestionnaire_de_fenetres`, qui vérifie que le lancement filmé REFUSE
        # quand il manque.
        #
        # ⚠️ openbox, et non matchbox (#3788). matchbox MAXIMISE tout ce qu'il affiche - c'est son
        # parti pris, il est fait pour de petits écrans - si bien que la modale de connexion
        # occupait 1280 × 900 sur le film, contenu tassé en haut. Deux conséquences, et la seconde
        # est la grave : les tests de croissance de fenêtre ne pouvaient pas passer (une fenêtre
        # déjà maximisée ne grandit pas), et surtout les clips de #3774 ne montraient PAS la mise
        # en page livrée - donc qui les jugeait jugeait autre chose.
        if: inputs.sans_gestionnaire_de_fenetres != 'true'
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: |
          bash .github/scripts/installer-paquets.sh --avec-recommandations openbox

      - name: Annoncer le témoin sans gestionnaire de fenêtres
        if: inputs.sans_gestionnaire_de_fenetres == 'true'
        # ⚠️ Bloc littéral : la chaîne contient « : », que YAML lirait comme une association si elle
        # était nue.
        run: |
          echo "::warning::TÉMOIN : aucun gestionnaire de fenêtres, le lancement DOIT être refusé."

      - name: Filmer le test
        id: film
        # ⚠️ Deux modes, et un seul dispositif. `--planche` dérive la liste des classes qui citent un
        # cas (`CorrespondanceRecetteTest`), les filme d'une traite et découpe un clip par test. Le
        # mode à une classe reste ce qu'il était : c'est lui le témoin, et c'est lui que
        # `sans_gestionnaire_de_fenetres` inverse.
        run: |
          set -euo pipefail
          chmod +x .github/scripts/lance-test-filme.sh
          if [ "${{ inputs.publier_les_clips }}" = "true" ]; then
            cible=(--planche)
          else
            cible=("${{ inputs.classe }}")
          fi
          if .github/scripts/lance-test-filme.sh "${cible[@]}"; then
            echo "verdict=vert" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=rouge" >> "$GITHUB_OUTPUT"
          fi

      - name: Remuxer les clips en mp4, pour qu'un navigateur les lise
        # ⚠️ Le banc produit du `.mkv`, qu'aucun navigateur ne lit de façon fiable. Le flux est déjà
        # du H.264 : `-c copy` change le conteneur sans ré-encoder, donc sans perte ni délai. Sans
        # cette étape, la page de la doc dev afficherait un lecteur vide - le défaut que
        # `check-doc-videos.sh --site` garde déjà pour les films de documentation.
        if: inputs.publier_les_clips == 'true'
        run: |
          set -euo pipefail
          compte=0
          for clip in target/recette/clips/*.mkv; do
            [ -e "$clip" ] || continue
            ffmpeg -nostdin -loglevel error -i "$clip" -c copy -y "${clip%.mkv}.mp4"
            compte=$((compte + 1))
          done
          [ "$compte" -gt 0 ] || { echo "::error::Aucun clip à remuxer : la planche n'a rien produit."; exit 1; }
          echo "$compte clip(s) remuxé(s) en mp4."

      # Le témoin inverse le verdict : dans ce mode, un succès est un ÉCHEC du dispositif.
      - name: Juger, témoin compris
        run: |
          set -euo pipefail
          verdict="${{ steps.film.outputs.verdict }}"
          temoin="${{ inputs.sans_gestionnaire_de_fenetres }}"
          if [ "$temoin" = "true" ]; then
            if [ "$verdict" = "vert" ]; then
              echo "::error::Le lancement a RÉUSSI sans gestionnaire de fenêtres : la vérification"
              echo "::error::du pointeur ne garde donc rien, et ce workflow rendrait un vert creux."
              exit 1
            fi
            echo "Témoin concluant : sans gestionnaire de fenêtres, le lancement est refusé."
            exit 0
          fi
          [ "$verdict" = "vert" ] || { echo "::error::Le lancement filmé a échoué."; exit 1; }
          echo "Le runner pilote : les cinq conditions sont réunies et le test a tourné filmé."

      - name: Conserver la vidéo et les repères
        if: always() && inputs.sans_gestionnaire_de_fenetres != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # ⚠️ Le nom porte le MODE, pas seulement la classe : le job de publication reprend cet
          # artefact par son nom, et « recette-filmee-EditeurCommentaireTest » ne lui dirait pas
          # qu'il s'agit de la planche entière.
          name: recette-filmee-${{ inputs.publier_les_clips == 'true' && 'planche' || inputs.classe }}
          # Le journal de repères part avec le film (#3774). Sans lui, la vidéo est un bloc dont
          # personne ne saura où regarder pour trancher un cas donné - et surtout, il est le seul
          # moyen de constater DEPUIS LA CI que l'extension a bien été chargée : un journal absent
          # ou vide dit que le câblage a lâché, là où le film, lui, sortirait pareil.
          path: |
            target/recette/*.mkv
            target/recette/clips/
            target/recette-filmee/reperes.tsv
          # Rétention bornée, décidée en séance : la vidéo se revoit un temps, puis s'efface.
          # Rien ne part dans git.
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------------
  # La publication des clips, dans un job SÉPARÉ.
  #
  # ⚠️ Pourquoi séparé, et non deux étapes de plus dans le job précédent. Publier demande
  # `contents: write` ; le job qui filme exécute les tests du produit, donc du code qui change à
  # chaque PR. Lui donner le droit d'écrire dans le dépôt élargirait la surface pour une commodité.
  # Ce job-ci ne fait qu'une chose : reprendre l'artefact et le verser sur la pré-version.
  #
  # ⚠️ Une pré-version ROULANTE, `clips-recette`, et non une version par tournage. Les URL doivent
  # être stables : la page `dev-docs/recette/clips.md` les écrit en dur, et une adresse qui change à
  # chaque tournage rendrait la page fausse le lendemain. `--clobber` remplace en place.
  #
  # Une pièce jointe de publication ne pèse RIEN dans l'historique git : les 459 Mio attachés à
  # v2.185.0 n'y laissent aucun blob. C'est ce qui permet de ranger des vidéos sans faire grossir le
  # dépôt, dont 79 % du poids sont déjà des PNG de captures.
  publier:
    name: Verser les clips sur la pré-version roulante
    needs: filmer
    if: inputs.publier_les_clips == 'true' && inputs.sans_gestionnaire_de_fenetres != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reprendre les clips du tournage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: recette-filmee-planche
          path: repris

      - name: Ouvrir la pré-version si elle n'existe pas encore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view clips-recette >/dev/null 2>&1; then
            echo "La pré-version « clips-recette » existe déjà : les pièces seront remplacées."
          else
            gh release create clips-recette \
              --prerelease \
              --title "Clips de recette (roulant)" \
              --notes "Les clips du dernier tournage complet. Cette pré-version est ROULANTE : ses pièces jointes sont remplacées à chaque tournage, et leurs adresses ne changent pas. Elle ne marque aucune version du produit ; voir la page « Regarder les clips de recette » de la documentation développeur."
          fi

      - name: Verser les clips et leur index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fichiers=(repris/clips/*.mp4 repris/clips/index.md)
          [ -e "${fichiers[0]}" ] || { echo "::error::Aucun clip mp4 dans l'artefact repris."; exit 1; }
          gh release upload clips-recette "${fichiers[@]}" --clobber
          echo "$(ls repris/clips/*.mp4 | wc -l) clip(s) versé(s) sur « clips-recette »."
