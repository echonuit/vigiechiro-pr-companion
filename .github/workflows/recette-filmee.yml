# Éprouver qu'un runner PILOTE réellement un test filmé, et pas seulement qu'il l'exécute.
#
# ## Pourquoi ce workflow existe
#
# `lance-test-filme.sh` (#3696) réunit les cinq conditions d'un lancement filmé. Deux d'entre
# elles ne sont pas des propriétés Maven et dépendent de la MACHINE : un gestionnaire de fenêtres
# doit tourner sur le DISPLAY visé, et `WAYLAND_DISPLAY` doit être absent.
#
# Sans gestionnaire de fenêtres, le pointeur ne bouge pas - même pour `xdotool` - et pourtant
# les tests s'EXÉCUTENT sans erreur. Ils passent ou échouent pour de mauvaises raisons. Pire,
# certains passent avec un robot mort : `annuler_ne_transmet_rien` affirme qu'une valeur reste
# « intact », ce qui est vrai si l'on ne clique nulle part. Se fier au verdict de Maven ne suffit
# donc pas, et c'est tout l'objet de ce workflow.
#
# ## Ce qui fait foi ici
#
# Le pas de vérification du lanceur, qui teste le COMPORTEMENT du pointeur et non la présence
# d'un gestionnaire. Un gestionnaire installé mais inopérant passerait un contrôle de présence.
#
# ## Déclenchement
#
# Manuel seulement, pour l'instant. Le branchement sur la publication viendra avec le harnais de
# recette (EPIC #3667) : brancher un dispositif avant d'avoir ce qu'il doit garder n'apporterait
# qu'un vert de plus.

name: recette filmée

on:
  workflow_dispatch:
    inputs:
      classe:
        description: Classe de test à filmer
        type: string
        default: EditeurCommentaireTest
      sans_gestionnaire_de_fenetres:
        description: "Témoin : ne PAS installer le gestionnaire de fenêtres, le lancement doit alors être refusé"
        type: boolean
        default: false
      publier_les_clips:
        description: "Filmer TOUTES les classes citantes et publier les clips sur la pré-version « clips-recette »"
        type: boolean
        default: false

  # APPELÉ PAR LE TRAIN, après que la Release a cessé d'être un brouillon (#4111).
  #
  # L'en-tête de ce fichier disait « manuel seulement, POUR L'INSTANT : le branchement sur la
  # publication viendra avec le harnais de recette (EPIC #3667) ». Cette condition est levée -
  # l'EPIC est clos, et `CorrespondanceRecetteTest` lit 11 sessions et 403 cas. Il y a désormais
  # quelque chose à garder.
  #
  # Après `publish`, et non la veille ni le matin. Les clips servent à jouer la recette d'UNE
  # version : tournés à date fixe, ils montreraient `main` à cette heure-là, c'est-à-dire un état
  # qui n'existe nulle part ailleurs. Le 2026-08-21, douze commits ont fusionné dans la journée -
  # « la veille » aurait filmé autre chose que ce qui est publié.
  workflow_call:
    inputs:
      classe:
        description: Classe de test à filmer
        type: string
        default: EditeurCommentaireTest
      sans_gestionnaire_de_fenetres:
        type: boolean
        default: false
      publier_les_clips:
        description: "Filmer TOUTES les classes citantes et publier les clips"
        type: boolean
        default: true
      version:
        description: "Version que ce tournage montre, écrite dans la pré-version (vide en tournage manuel)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  filmer:
    name: Le runner pilote-t-il vraiment ?
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Le verdict sort du job pour que le versement sur le TAG puisse l'écrire dans l'index : sur une
    # pièce immuable, celui qui la relira dans six mois doit savoir si les tests étaient verts ce
    # jour-là. La publication n'en dépend pas pour autant - un cas qui rougit produit son clip, et
    # c'est celui-là qu'on veut regarder.
    outputs:
      verdict: ${{ steps.film.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache des .deb (le dépaquetage, lui, se refait)
        # Ce cache-ci porte sur les `.deb`, pas sur l'état installé : `dpkg` tourne donc à chaque
        # run, et avec lui les scripts post-installation - `fc-cache` compris. On perd le temps du
        # dépaquetage ; on garde des polices réellement enregistrées.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          key: apt-${{ runner.os }}-recette-filmee

      - name: Installer de quoi afficher et filmer
        # Cache de l'état INSTALLÉ, pas des `.deb` : il saute aussi le dépaquetage. Convient ici
        # parce que ces paquets ne sont que des fichiers ; les polices et flatpak gardent
        # `installer_paquets.py`, dont le post-install fait foi.
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: |
          python3 .github/scripts/installer_paquets.py --avec-recommandations xvfb xdotool ffmpeg x11-utils

      # `${{ !inputs.x }}`, et JAMAIS `inputs.x != 'true'`. Une entrée `type: boolean` de
      # `workflow_dispatch` arrive comme un VRAI booléen, et comparer un booléen à une chaîne casse
      # les deux en nombres : `'true'` n'est pas un nombre, donc toute comparaison est fausse.
      # `!= 'true'` vaut donc TOUJOURS vrai, et `== 'true'` TOUJOURS faux.
      #
      # Conséquence mesurée sur le run 32395513266 : le témoin « sans gestionnaire de fenêtres »
      # installait quand même openbox, et son avertissement ne paraissait jamais. La garde qui prouve
      # que la vérification du pointeur garde quelque chose ne gardait donc rien elle-même.
      #
      # L'interpolation shell, elle, marche : `"${{ inputs.x }}"` rend le texte `true`. C'est ce qui a
      # rendu le défaut invisible - les étapes en `run:` se comportaient comme attendu.
      #
      # `verifie_conditions_booleennes.py` refuse désormais cette forme.
      - name: Installer le gestionnaire de fenêtres
        # Le gestionnaire de fenêtres est posé À PART, pour que le témoin puisse s'en passer : c'est
        # tout l'objet de `sans_gestionnaire_de_fenetres`, qui vérifie que le lancement filmé REFUSE
        # quand il manque.
        #
        # openbox, et non matchbox (#3788). matchbox MAXIMISE tout ce qu'il affiche - c'est son
        # parti pris, il est fait pour de petits écrans - si bien que la modale de connexion
        # occupait 1280 × 900 sur le film, contenu tassé en haut. Deux conséquences, et la seconde
        # est la grave : les tests de croissance de fenêtre ne pouvaient pas passer (une fenêtre
        # déjà maximisée ne grandit pas), et surtout les clips de #3774 ne montraient PAS la mise
        # en page livrée - donc qui les jugeait jugeait autre chose.
        if: ${{ !inputs.sans_gestionnaire_de_fenetres }}
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: |
          python3 .github/scripts/installer_paquets.py --avec-recommandations openbox

      - name: Annoncer le témoin sans gestionnaire de fenêtres
        if: ${{ inputs.sans_gestionnaire_de_fenetres }}
        # Bloc littéral : la chaîne contient « : », que YAML lirait comme une association si elle
        # était nue.
        run: |
          echo "::warning::TÉMOIN : aucun gestionnaire de fenêtres, le lancement DOIT être refusé."

      - name: Filmer le test
        id: film
        # Deux modes, et un seul dispositif. `--planche` dérive la liste des classes qui citent un
        # cas (`CorrespondanceRecetteTest`), les filme d'une traite et découpe un clip par test. Le
        # mode à une classe reste ce qu'il était : c'est lui le témoin, et c'est lui que
        # `sans_gestionnaire_de_fenetres` inverse.
        run: |
          set -euo pipefail
          chmod +x .github/scripts/lance-test-filme.sh
          if [ "${{ inputs.publier_les_clips }}" = "true" ]; then
            cible=(--planche)
          else
            cible=("${{ inputs.classe }}")
          fi
          if .github/scripts/lance-test-filme.sh "${cible[@]}"; then
            echo "verdict=vert" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=rouge" >> "$GITHUB_OUTPUT"
          fi

      - name: Remuxer les clips en mp4, pour qu'un navigateur les lise
        # Le banc produit du `.mkv`, qu'aucun navigateur ne lit de façon fiable. Le flux est déjà
        # du H.264 : `-c copy` change le conteneur sans ré-encoder, donc sans perte ni délai. Sans
        # cette étape, la page de la doc dev afficherait un lecteur vide - le défaut que
        # `check_doc_videos.py --site` garde déjà pour les films de documentation.
        # `always()` : cette étape est la CONDITION de la publication, pas sa conséquence. Sans
        # elle, une étape précédente qui rougit la saute, et le tournage rend un artefact sans mp4 -
        # une absence qui se lit comme « le banc n'a rien filmé » alors qu'il a tout filmé.
        if: ${{ always() && inputs.publier_les_clips }}
        run: |
          set -euo pipefail
          compte=0
          for clip in target/recette/clips/*.mkv; do
            [ -e "$clip" ] || continue
            ffmpeg -nostdin -loglevel error -i "$clip" -c copy -y "${clip%.mkv}.mp4"
            compte=$((compte + 1))
          done
          [ "$compte" -gt 0 ] || { echo "::error::Aucun clip à remuxer : la planche n'a rien produit."; exit 1; }
          echo "$compte clip(s) remuxé(s) en mp4."

      # Le témoin inverse le verdict : dans ce mode, un succès est un ÉCHEC du dispositif.
      - name: Juger, témoin compris
        # Le jugement dépend du MODE, parce que les deux modes ne répondent pas à la même question.
        #
        # En témoin, la question est « le runner pilote-t-il ? », et sa réponse est un verdict : un
        # test rouge fait échouer le job, c'est tout l'objet du workflow.
        #
        # En planche, la question est « a-t-on les clips ? », et un test rouge n'y répond pas. Un cas
        # qui rougit produit son clip comme les autres, et c'est même celui-là qu'on veut regarder :
        # subordonner la publication au vert de cent vingt-huit tests rendrait les clips otages d'une
        # condition sans rapport. Le premier tournage complet l'a montré - quatorze rouges, aucun
        # clip publié, alors que le film existait.
        #
        # Le rouge n'est pas tu pour autant : il est annoncé, compté, et écrit au résumé du job. Ce
        # qui fait échouer la planche, c'est l'absence de clips, et c'est l'étape de remuxage qui le
        # dit - la seule condition dont la publication dépende vraiment.
        run: |
          set -euo pipefail
          verdict="${{ steps.film.outputs.verdict }}"
          temoin="${{ inputs.sans_gestionnaire_de_fenetres }}"
          if [ "$temoin" = "true" ]; then
            if [ "$verdict" = "vert" ]; then
              echo "::error::Le lancement a RÉUSSI sans gestionnaire de fenêtres : la vérification"
              echo "::error::du pointeur ne garde donc rien, et ce workflow rendrait un vert creux."
              exit 1
            fi
            echo "Témoin concluant : sans gestionnaire de fenêtres, le lancement est refusé."
            exit 0
          fi
          if [ "${{ inputs.publier_les_clips }}" = "true" ]; then
            if [ "$verdict" = "vert" ]; then
              echo "Planche entière : tous les tests filmés sont verts."
              echo "Planche entière : tous les tests filmés sont verts." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Des tests ont rougi SOUS FILMAGE. Les clips sont produits quand même,"
              echo "::warning::et un cas qui rougit est précisément celui qu'il faut regarder."
              {
                echo "### Planche entière : des tests ont rougi sous filmage"
                echo
                echo "Les clips sont publiés : un cas rouge produit son clip, et c'est celui-là qu'on regarde."
                echo "Le verdict des tests appartient à l'intégration ordinaire, pas à ce tournage."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          [ "$verdict" = "vert" ] || { echo "::error::Le lancement filmé a échoué."; exit 1; }
          echo "Le runner pilote : les cinq conditions sont réunies et le test a tourné filmé."

      - name: Conserver la vidéo et les repères
        if: ${{ always() && !inputs.sans_gestionnaire_de_fenetres }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Le nom porte le MODE, pas seulement la classe : le job de publication reprend cet
          # artefact par son nom, et « recette-filmee-EditeurCommentaireTest » ne lui dirait pas
          # qu'il s'agit de la planche entière.
          name: recette-filmee-${{ inputs.publier_les_clips && 'planche' || inputs.classe }}
          # Le journal de repères part avec le film (#3774). Sans lui, la vidéo est un bloc dont
          # personne ne saura où regarder pour trancher un cas donné - et surtout, il est le seul
          # moyen de constater DEPUIS LA CI que l'extension a bien été chargée : un journal absent
          # ou vide dit que le câblage a lâché, là où le film, lui, sortirait pareil.
          path: |
            target/recette/*.mkv
            target/recette/clips/
            target/recette-filmee/reperes.tsv
          # Rétention bornée, décidée en séance : la vidéo se revoit un temps, puis s'efface.
          # Rien ne part dans git.
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------------
  # La publication des clips, dans un job SÉPARÉ.
  #
  # Pourquoi séparé, et non deux étapes de plus dans le job précédent. Publier demande
  # `contents: write` ; le job qui filme exécute les tests du produit, donc du code qui change à
  # chaque PR. Lui donner le droit d'écrire dans le dépôt élargirait la surface pour une commodité.
  # Ce job-ci ne fait qu'une chose : reprendre l'artefact et le verser sur la pré-version.
  #
  # Une pré-version ROULANTE, `clips-recette`, et non une version par tournage. Les URL doivent
  # être stables : la page `dev-docs/recette/clips.md` les écrit en dur, et une adresse qui change à
  # chaque tournage rendrait la page fausse le lendemain. `--clobber` remplace en place.
  #
  # Une pièce jointe de publication ne pèse RIEN dans l'historique git : les 459 Mio attachés à
  # v2.185.0 n'y laissent aucun blob. C'est ce qui permet de ranger des vidéos sans faire grossir le
  # dépôt, dont 79 % du poids sont déjà des PNG de captures.
  publier:
    name: Verser les clips sur la pré-version roulante
    needs: filmer
    if: ${{ inputs.publier_les_clips && !inputs.sans_gestionnaire_de_fenetres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reprendre les clips du tournage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recette-filmee-planche
          path: repris

      - name: Ouvrir la pré-version, et dire CE QU'ELLE MONTRE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        # Le corps se réécrit à CHAQUE tournage, et pas seulement à la création. La pré-version
        # annonçait « elle ne marque aucune version du produit » : c'était exact tant que le tournage
        # était manuel, et ça devient faux depuis que le train l'appelle sur la version qu'il vient de
        # publier (#4111). Celui qui joue une session doit savoir si ce qu'il regarde est bien ce
        # qu'il valide - sans quoi les clips ont l'air justes quelle que soit leur ancienneté.
        run: |
          set -euo pipefail
          if [ -n "${VERSION}" ]; then
            montre="Ces clips montrent la **${VERSION}**, tournée juste après sa publication."
          else
            montre="Tournage **manuel** du $(git rev-parse --short HEAD) : ces clips ne correspondent à aucune version publiée."
          fi
          corps="${montre}

          Pré-version **roulante** : ses pièces jointes sont remplacées à chaque tournage, et leurs adresses ne changent pas.

          Voir la page « Regarder les clips de recette » de la documentation développeur.

          _Tourné le $(date -u +%F) à $(date -u +%H:%M) UTC._"

          if gh release view clips-recette >/dev/null 2>&1; then
            gh release edit clips-recette --notes "${corps}"
            echo "La pré-version existe : corps réécrit, les pièces seront remplacées."
          else
            gh release create clips-recette \
              --prerelease \
              --title "Clips de recette (roulant)" \
              --notes "${corps}"
          fi

      - name: Verser les clips et leur index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `recette/clips/`, et non `clips/`. L'action d'envoi range les fichiers sous leur plus
          # petit ancêtre commun : les trois chemins téléversés vivent sous `target/`, donc l'archive
          # contient `recette/…` et `recette-filmee/…`. Vérifié sur un artefact rapatrié, pas déduit.
          clips=(repris/recette/clips/*.mp4)
          [ -e "${clips[0]}" ] || {
            echo "::error::Aucun clip mp4 dans l'artefact repris. Arborescence trouvée :"
            find repris -type f | head -20
            exit 1
          }
          gh release upload clips-recette "${clips[@]}" repris/recette/clips/index.md --clobber
          echo "${#clips[@]} clip(s) versé(s) sur « clips-recette »."

      # La pré-version roulante garde son rôle : des adresses STABLES, que les pages écrivent en dur.
      # Le tag de la version en reçoit une COPIE, pour une raison différente : un tag ne bouge JAMAIS,
      # donc ces adresses-là sont immuables, et la suite des versions forme un historique du produit
      # que rien ne reconstituera après coup (#4258).
      #
      # Ce n'est pas une hypothèse : en cherchant un « avant » pour l'artefact visuel de la clôture de
      # #4133, aucun clip antérieur au calque des gestes n'a été retrouvé. Les pièces de la
      # pré-version du spike avaient été reversées par-dessus, et sa date de publication ne dit rien
      # de la date de son contenu.
      #
      # Le PRÉFIXE n'est pas décoratif. Les deux bancs nomment leurs pièces à l'identique - 50 noms
      # communs sur 51, mesuré - et les verser tous deux sur un même tag les ferait s'écraser EN
      # SILENCE. Le préfixe réserve la place du banc Java avant qu'il en ait besoin.
      #
      # Ce qu'on ne sait pas encore vérifier : qu'AUCUN cas ne manque. Un tag est immuable, donc un
      # tournage amputé y resterait, et un clip manquant se lit comme « ce cas n'existait pas ». Le
      # garde qui compte les CAS vit dans `tournage-recette.yml` ; ici, l'artefact n'emporte pas
      # `classes-citantes.txt`, donc le compte attendu n'est pas connu de ce job. En attendant, le
      # dépôt se DÉCRIT : l'index versé porte en tête la version, la date et le nombre de clips, si
      # bien qu'un trou se constate au lieu de se deviner.
      - name: Verser aussi les clips sur le tag de la version
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          VERDICT: ${{ needs.filmer.outputs.verdict }}
        run: |
          set -euo pipefail
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "::error::La version ${VERSION} n'a pas de release : rien à quoi attacher les clips."
            exit 1
          fi

          rm -rf versionnes && mkdir -p versionnes
          compte=0
          for clip in repris/recette/clips/*.mp4; do
            cp "$clip" "versionnes/bash-$(basename "$clip")"
            compte=$((compte + 1))
          done

          {
            echo "> Clips du banc **bash** pour la **${VERSION}**, tournés le $(date -u +%F) à $(date -u +%H:%M) UTC."
            echo ">"
            echo "> **${compte} clips**, verdict des tests sous filmage : **${VERDICT:-inconnu}**."
            echo ">"
            echo "> Un cas absent de cette table n'a pas été filmé pour cette version."
            echo
          } > versionnes/bash-index.md
          cat repris/recette/clips/index.md >> versionnes/bash-index.md

          gh release upload "${VERSION}" versionnes/* --clobber
          echo "${compte} clip(s) versé(s) sur « ${VERSION} », préfixés « bash- »."

      # `--clobber` remplace et ajoute ; il ne retire rien. Un cas renommé ou supprimé laissait donc
      # son clip en ligne, montrant un comportement que le produit n'a plus - constaté après #4099.
      #
      # Le calcul vit dans un script à part parce que sa sortie SUPPRIME : une orientation inversée
      # ne rend pas une erreur, elle rend la liste de ce qu'il fallait garder. `clips_orphelins.py`
      # refuse par ailleurs un dossier de tournage vide, et son auto-test garde les deux cas.
      - name: Retirer les clips dont le cas a disparu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/clips_orphelins.py
          orphelins=$(gh release view clips-recette --json assets --jq '.assets[].name' \
            | python3 .github/scripts/clips_orphelins.py repris/recette/clips)
          if [ -z "$orphelins" ]; then
            echo "Aucun clip orphelin : la pré-version ne porte que des cas qui existent."
            exit 0
          fi
          while IFS= read -r nom; do
            [ -n "$nom" ] || continue
            echo "Retrait de « $nom » : aucun cas de recette ne porte plus ce nom."
            gh release delete-asset clips-recette "$nom" --yes
          done <<< "$orphelins"
