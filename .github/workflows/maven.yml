# Build Java : sur chaque PR et sur les pushes vers la branche par défaut.
#
# DEUX jobs parallèles, séparés par ce dont ils dépendent (#2106) :
#
# - `build`  : compilation, suite de tests, seuil de couverture JaCoCo bloquant. C'est la seule
#              exécution des tests en CI ; lint.yml ne fait que l'analyse statique (Spotless,
#              captures, PMD).
# - `paquet` : tout ce qui dépend de ce qu'on EMBALLE et non de ce qu'on teste - smoke-test du
#              fat-jar, idempotence du packaging, app-image, puis les E2E CLI `bats`. Ces étapes n'ont
#              besoin ni de la suite de tests ni de la couverture.
#              Les E2E viennent APRÈS l'app-image depuis #4071, parce qu'ils visent désormais son
#              lanceur `bin/vigiechiro` et non plus `java -cp <fat-jar>` : ils n'attendent donc plus un
#              simple `package`. Rien n'a changé de job pour autant - l'app-image était déjà construite
#              ici, et le coût est le même.
#
# Pourquoi les séparer. Elles étaient auparavant quatre étapes à la file dans un seul job, ce qui
# avait deux coûts. Le premier, mesuré sur le run 29728409116 : 449 s de tests + 148 s de bats + 9 s
# d'idempotence en série, soit ~10 min avant le moindre verdict. Le second, plus gênant, est une
# DÉPENDANCE fausse : les étapes de packaging ne s'exécutaient qu'après le succès des tests, donc une
# suite rouge cachait l'état du packaging et on ne l'apprenait qu'au tour suivant. Séparés, les deux
# rendent leur verdict indépendamment, et le chemin critique se ramène au plus long des deux.
#
# Ce qui NE gagne rien à être déplacé : l'installation de bats coûte 9 s, pas plus (vérifié) ; les
# ~140 s du harnais sont les tests eux-mêmes, qui lancent chacun un JVM sur le fat-jar. Inutile
# d'y chercher un cache apt.
#
# `solution` est conservée pendant la transition (avant la consolidation en `main`).
name: Java CI with Maven

on:
  push:
    branches: [solution, main]
  pull_request:
  workflow_dispatch: {}

# Annule un run encore en cours sur la même ref (pushes/PR rapprochés).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          # JDK Temurin standard (sans JavaFX) : JavaFX 26 vient des dépendances Maven
          # org.openjfx. La Headless Platform (glass.platform=Headless) est 100 % logicielle,
          # donc pas besoin du runtime natif jdk+fx.
          check-latest: false
          cache: maven

      - name: Ce que /tmp portait avant la suite
        # Le compte est DIFFÉRENTIEL (ADR 4859) : sans ce relevé, le pas suivant compterait le total et
        # accuserait ce que le runner porte déjà. Il refuse d'ailleurs de conclure sans lui.
        run: python3 scripts/methode/compte-les-reliquats.py --avant

      - name: Build + tests + couverture (headless)
        # Tests UI en headless via la Headless Platform JavaFX 26 (glass.platform=Headless,
        # cf. pom.xml) : aucun display X11 requis, plus besoin de xvfb.
        # jacoco.haltOnFailure=true rend le seuil de couverture bloquant (valeurs et
        # justification dans pom.xml, seule source) : les tests ne s'exécutant que dans ce
        # job, le gate de couverture doit vivre ici et non dans lint.yml.
        run: ./mvnw -B verify -Djacoco.haltOnFailure=true --file pom.xml

      - name: Ce que la suite a laissé dans /tmp (bloquant, ADR 4859)
        # La propriété ne s'observe QU'ICI : un test tourne pendant, il ne voit ni les forks voisins ni
        # ce qui suit. `if: always()` parce qu'une suite rouge laisse elle aussi ses répertoires, et
        # c'est même là qu'elle en laisse le plus.
        if: always()
        run: python3 scripts/methode/compte-les-reliquats.py --apres

  # Rejoue TOUTE la suite sous un second fuseau (#3450). Ce n'est pas une redite du job `build` :
  # c'est le seul dispositif qui tienne la propriété « ce que le produit calcule pour une nuit ne
  # dépend pas du fuseau de la machine ».
  #
  # ## Pourquoi il existe
  #
  # Le produit datait les nuits d'écoute avec `ZoneId.systemDefault()`, donc avec le fuseau du poste
  # qui dépouille. La MÊME nuit partait à la plateforme nationale à 19:00, 21:00 ou - depuis Cayenne -
  # LE LENDEMAIN (ADR 3406). Le correctif est fait ; rien n'empêchait qu'il revienne.
  #
  # ## Pourquoi pas un garde textuel, comme les quatre autres de ce dépôt
  #
  # Il a été écrit, puis jeté : vérifié contre les lignes fautives d'origine, il aurait manqué les
  # DEUX moitiés du défaut. L'écriture portait `.atZone(ZoneId.systemDefault())` deux lignes après ses
  # types locaux, hors de portée d'une détection ligne à ligne ; et la lecture écrivait
  # `.atZoneSameInstant(...)`, qui a l'air juste - ça l'est partout ailleurs. Un garde qui ne voit ni
  # l'un ni l'autre est pire que pas de garde : il fait croire la propriété tenue (ADR 2748).
  #
  # La propriété est donc COMPORTEMENTALE, pas syntaxique. Ce qui a effectivement mordu, c'est la CI
  # - parce que son fuseau n'est pas celui du poste de développement, où `systemDefault()` EST
  # `Europe/Paris` : les deux moitiés du code y parlaient le même fuseau par accident, et aucune
  # reproduction locale n'était possible.
  #
  # ## Pourquoi toute la suite, et pas une liste de classes sensibles
  #
  # Une liste ne voit que ce qu'on y a mis, et se démode en silence. Le garde porte sur la forme du
  # défaut, jamais sur les cas connus au moment de l'écrire (ADR 3412). Ici, la « forme » est le fuseau
  # lui-même : toute classe qui en dépendra rougira, y compris celles qui n'existent pas encore.
  #
  # ## Pourquoi America/Cayenne
  #
  # Trois propriétés qu'aucun autre choix ne réunit : c'est un territoire français, donc un cas RÉEL du
  # produit (#3442) ; l'écart avec Europe/Paris franchit MINUIT, donc un défaut y change la DATE et pas
  # seulement l'heure ; et il n'observe PAS l'heure d'été, là où Europe/Paris l'observe - un décalage
  # fixe se comporte autrement qu'un décalage saisonnier.
  #
  # Ce que ce job NE voit pas : un défaut qui donnerait le même résultat sous les deux fuseaux.
  # Il compare deux points, il ne balaie pas l'espace des fuseaux.
  fuseau-alternatif:
    name: fuseau-alternatif
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      - name: Rejouer la suite sous America/Cayenne
        # Le fuseau passe par l'ENVIRONNEMENT, pas par `-Duser.timezone` sur la ligne Maven : surefire
        # fabrique ses propres JVM (`forkCount=1C`), et une propriété donnée à Maven ne descend pas
        # forcément dedans. L'environnement, lui, est hérité par les forks. Une première version de ce
        # job employait `-D` : elle aurait pu être VERTE avec toute la suite tournant sous le fuseau du
        # runner, c'est-à-dire sans rien vérifier du tout.
        #
        # `VC_FUSEAU_ATTENDU` arme `FuseauDExecutionTest`, qui vérifie DEPUIS L'INTÉRIEUR de la suite
        # que la JVM tourne bien sous ce fuseau. Sans lui, ce job ne prouverait pas ce qu'il annonce -
        # et un dispositif cassé se présenterait ici sous la forme d'un succès.
        env:
          TZ: America/Cayenne
          VC_FUSEAU_ATTENDU: America/Cayenne
        run: |
          echo "Fuseau du shell : $(date +%Z' (%z)')"
          ./mvnw -B test --file pom.xml

  # Rejoue TOUTE la suite dans UN SEUL fork, en ordre inverse (#1967). Ce n'est pas une redite du job
  # `build` : c'est le seul dispositif qui tienne la propriété « une classe de test rend le harnais
  # comme elle l'a trouvé ».
  #
  # ## Pourquoi il existe
  #
  # TestFX RÉUTILISE le Stage primaire d'une classe de test à l'autre dans un même fork. Une classe qui
  # le laisse modifié fait échouer les SUIVANTES, sur des noeuds « invisibles » ou des tailles absurdes,
  # très loin de leur cause. Trois occurrences, toutes vertes en CI le jour de leur fusion :
  #
  # | Ce qui fuyait | Découvert par |
  # |---|---|
  # | `setWidth`/`setHeight` dans `Modales` (#1940) | une classe sans rapport, au hasard des forks |
  # | les tailles minimales posées par `App.start` (#3607) | la modale de la classe suivante |
  # | `setWidth`/`setHeight` dans `AppTest` (#3452) | `LotDepotConnecteViewTest`, puis deux E2E |
  #
  # Chaque fois, `main` était VERT - par chance de répartition des classes entre forks. #1967 avait
  # prédit le retour du défaut et proposé ce job ; il avait raison sur les deux.
  #
  # ## Pourquoi un seul fork
  #
  # `forkCount=1C` répartit les classes sur autant de JVM que de coeurs : deux classes qui se marchent
  # dessus n'y atterrissent ensemble que par hasard, et ce hasard change avec la machine, le nombre de
  # classes, et l'ordre. Un fork unique met TOUTES les classes dans le même harnais : la fuite n'a plus
  # nulle part où se cacher. C'est aussi ce qui rend ce job lent, et pourquoi il vit à part de `build`.
  #
  # ## Pourquoi toute la suite, et pas une liste de classes sensibles
  #
  # Même raison que pour `fuseau-alternatif` : une liste ne voit que ce qu'on y a mis, et se démode en
  # silence. Le garde porte sur la FORME du défaut (un harnais partagé qu'on ne rend pas intact), jamais
  # sur les cas connus au moment de l'écrire (ADR 3412). Les classes qui n'existent pas encore sont
  # couvertes.
  #
  # ## Pourquoi l'ordre inverse en plus
  #
  # Un fork unique en ordre NORMAL ne prouve qu'un ordre. Les trois fuites ci-dessus étaient
  # directionnelles : A casse B, mais B ne casse pas A. Inverser expose l'autre sens, et c'est
  # effectivement dans ce sens-là que la deuxième a été trouvée.
  #
  # Ce que ce job NE voit pas : une fuite qui ne mord que dans l'ordre NORMAL à fork unique, et une
  # fuite entre deux classes qu'aucun des deux ordres ne met dans cette séquence. Il éprouve deux
  # ordres, il ne balaie pas leurs permutations.
  ordre-alternatif:
    name: ordre-alternatif
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      - name: Rejouer la suite dans un fork unique, en ordre inverse
        # Les deux propriétés sont celles de surefire, et elles ont été éprouvées à la main avant
        # d'atterrir ici : c'est avec elles que les trois fuites du tableau ci-dessus se reproduisent
        # de façon déterministe en local, et sans elles qu'aucune ne se reproduit. Un job qui poserait
        # un nom de propriété inexact tournerait dans la configuration par défaut et serait VERT sans
        # rien vérifier - un dispositif cassé se présentant sous la forme d'un succès (ADR 2748).
        run: ./mvnw -B test --file pom.xml -Dsurefire.forkCount=1 -Dsurefire.runOrder=reversealphabetical

  second-compilateur:
    name: analyser-ecj
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      - name: Recompiler tout avec le compilateur Eclipse
        # Ni les tests ni la couverture : seule la COMPILATION est rejouee, et par un autre
        # compilateur conforme. #3228 a coute une heure de diagnostic sur une lambda visant
        # `com.google.inject.Provider`, que javac accepte et qu'ecj refuse ; le balayage textuel
        # d'alors en avait trouve cinq, et ce second compilateur en a trouve DEUX de plus qu'il
        # avait manquees, plus deux divergences d'inference d'une famille que personne n'avait
        # nommee (#3366).
        #
        # On ne bloque QUE sur les erreurs. Les 1293 avertissements d'ecj sur ce depot ne sont pas
        # des defauts : un job qui rougirait dessus serait desactive en trois semaines, et on
        # serait revenu au point de depart en ayant paye le trajet.
        run: |
          set -euo pipefail
          ./mvnw -B -Pecj clean test-compile --file pom.xml | tee /tmp/ecj.log

          # Sans ce controle, une faute dans le profil ferait retomber le build sur JAVAC et le
          # job resterait VERT en n'ayant rien compare. C'est la panne que #3345 a apprise ici :
          # un vert qui ne dit pas qu'il n'a rien verifie.
          passes=$(grep -c "Compiling with eclipse" /tmp/ecj.log || true)
          if [ "$passes" -lt 2 ]; then
            echo "::error::ecj n'a pas compile les deux jeux de sources ($passes passe(s) vue(s) sur 2 attendues) : ce vert ne comparerait rien."
            exit 1
          fi
          echo "Second compilateur : $passes passes ecj (sources et tests), aucune erreur."

  paquet:
    name: paquet
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      - name: Assembler le fat-jar (sans les tests)
        # `-DskipTests` (et non `-Dmaven.test.skip`) : les tests ne s'EXÉCUTENT pas ici - c'est le
        # travail du job `build` - mais ils se COMPILENT quand même, ce qui garde ce job sensible à
        # une rupture d'API côté test. Le shade est bindé sur `package`, d'où l'absence de `verify`.
        run: ./mvnw -B -DskipTests package --file pom.xml

      - name: Smoke-test du fat-jar (démarrage depuis le jar packagé)
        # Le profil `installer` (jpackage) empaquette ce fat-jar shadé. Les tests unitaires tournent
        # sur le classpath Maven, jamais sur le jar assemblé : ce smoke-test lance le CLI DEPUIS le
        # jar shadé (même jar, entrée headless) pour prouver que l'assemblage démarre (Guice +
        # picocli + services fusionnés + natif SQLite), sans ClassNotFound ni module-info cassé.
        # Détecte les régressions de shade que la compilation ne voit pas.
        run: |
          set -euo pipefail
          jar=$(ls target/vigiechiro-*-shaded.jar | head -1)
          echo "Fat-jar : $jar"
          java --enable-native-access=ALL-UNNAMED -cp "$jar" fr.univ_amu.iut.cli.Cli --help | tee sortie-smoke.txt
          grep -q "Usage: vigiechiro" sortie-smoke.txt

      - name: Idempotence du packaging (2e build sans clean)
        # Le packaging doit être reproductible : un 2e `package` SANS `clean` ne doit pas re-shader le
        # fat-jar. Garde-fou contre une régression de la séparation thin/fat (#1188/#1189) : sans elle,
        # le shade consommait sa propre sortie (`original-*.jar` gonflé, fat-jar qui grossit). On vérifie :
        # taille du fat-jar stable, aucun `original-*.jar`, jar principal resté MINCE.
        run: |
          set -euo pipefail
          fat=$(ls target/vigiechiro-*-shaded.jar | head -1)
          mince=$(ls target/vigiechiro-*.jar | grep -v shaded | head -1)
          avant=$(stat -c%s "$fat")
          ./mvnw -q -B -DskipTests package --file pom.xml
          apres=$(stat -c%s "$fat")
          tailleMince=$(stat -c%s "$mince")
          echo "fat-jar : ${avant} -> ${apres} o | jar mince : ${tailleMince} o"
          test "${avant}" = "${apres}"                          # fat-jar stable (pas de double-shade)
          if ls target/original-*.jar >/dev/null 2>&1; then
            echo "original-*.jar présent : shade a remplacé l'artefact principal !" && exit 1
          fi
          # « Mince » se dit PAR RAPPORT au gras. Le seuil absolu de #1201 (6 Mo) s'est périmé en
          # grossissant avec le code : il ne restait plus que 620 o de marge, et le prochain commit
          # venu l'aurait franchi sans qu'aucune régression thin/fat ait eu lieu (#5101). Le rapport,
          # lui, reste vrai : ~18 % aujourd'hui, et 100 % si le shade reprenait l'artefact principal.
          part=$(( tailleMince * 100 / apres ))
          echo "jar mince = ${part} % du fat-jar"
          test "${part}" -lt 33                                 # le jar principal doit rester mince

      - name: "Garde-fou app-image (jpackage --type app-image, #2256)"
        # release.yml construit l'app-image APRÈS l'installeur, mais ce build n'était exercé sur AUCUNE
        # PR : la régression #2215 (options d'installeur invalides pour --type app-image) a cassé 6
        # releases sans qu'un seul check ne rougisse. On l'exerce donc ici, avec la MÊME désactivation
        # de profil OS que release.yml, pour attraper toute rupture au plus tôt (le trou de test qui a
        # laissé passer la panne). Linux uniquement (le runner du job) : suffit à couvrir la forme.
        run: |
          set -euo pipefail
          ./mvnw -q -B -Pinstaller,'!jpackage-linux' -Djpackage.type=app-image \
            -Djpackage.appVersion=0.0.0 -Dapp.version=0.0.0 \
            -DskipTests -Dpmd.skip=true -Djacoco.skip=true verify
          test -x target/dist/VigieChiroCompanion/bin/VigieChiroCompanion
          test -x target/dist/VigieChiroCompanion/bin/vigiechiro
          echo "app-image construite : $(ls -d target/dist/VigieChiroCompanion)"

      - name: Installer bats
        # Cache de l'état INSTALLÉ, pas des `.deb` : il saute aussi le dépaquetage. Convient ici
        # parce que ces paquets ne sont que des fichiers ; les polices et flatpak gardent
        # `installer-paquets.sh`, dont le post-install fait foi.
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: bats
          version: vigiechiro-1

      - name: E2E CLI (bats) sur le LANCEUR empaqueté (#4071)
        # Tests bout-en-bout au niveau SHELL : arguments picocli, codes de sortie et refus métier d'un
        # VRAI processus - ce que les tests Java in-process (CliTest & co.) ne voient pas. Amorce du
        # harnais (#1572, chantier #1565).
        #
        # Ils visaient `java -cp <fat-jar> …cli.Cli`, c'est-à-dire un chemin qu'AUCUN utilisateur
        # n'emprunte : les 66 commandes étaient éprouvées à côté de la porte par laquelle on entre. Ils
        # visent maintenant le lanceur de l'app-image construite juste au-dessus, donc le runtime jlink
        # réellement livré - celui où #2299 avait laissé partir un paquet incapable de démarrer.
        #
        # C'est pour cela que cette étape a été déplacée APRÈS le garde-fou app-image : elle a besoin de
        # ce qu'il produit. Rien n'a changé de job ni de coût - l'app-image était déjà construite ici.
        #
        # Le fat-jar reste éprouvé par le smoke-test plus haut, qui le lance et vérifie son usage.
        run: |
          set -euo pipefail
          export VIGIECHIRO_LANCEUR="${PWD}/target/dist/VigieChiroCompanion/bin/vigiechiro"
          test -x "${VIGIECHIRO_LANCEUR}"
          bats src/test/bats

      - name: "Démarrage réel du paquet (runtime jlink, #2299)"
        # Le pas précédent vérifiait que le lanceur EXISTE. Il ne l'exécutait pas, et c'est très
        # exactement ce qui a laissé partir v2.32.3 : l'application démarrait puis mourait sur
        # NoClassDefFoundError java/net/http/HttpClient, module absent du runtime composé par jlink.
        # Le smoke-test du fat-jar plus haut ne pouvait pas l'attraper : il tourne sur le JDK COMPLET
        # du runner, où tous les modules existent. Seul le paquet expose le runtime réellement livré.
        # Sous Windows le symptôme était le message générique « Failed to launch JVM » : le lanceur
        # jpackage affiche cela pour TOUT code de retour non nul, application plantée comprise, et
        # n'ayant pas de console il n'en montre jamais la cause.
        # Deux conditions, pas une : le processus doit tenir debout, ET la sortie doit être exempte
        # d'erreur de chargement. Une exception sur un fil de fond ne tue pas le processus - s'en
        # tenir à la survie fabriquerait un vert creux.
        # La logique vit dans un script depuis #3617 : elle sert aussi aux EMBALLAGES, vérifiés dans
        # `release.yml`, qu'aucune PR ne traverse. Une étape écrite là-bas peut être fusionnée cassée
        # et ne se découvrir qu'au train suivant, en bloquant la publication. Ici, elle est exercée
        # pour de vrai à chaque PR.
        run: |
          set -euo pipefail
          chmod +x .github/scripts/verifie_demarrage_emballage.py
          python3 .github/scripts/verifie_demarrage_emballage.py \
            target/dist/VigieChiroCompanion/bin/VigieChiroCompanion \
            --secondes 45 --libelle "app-image (runtime jlink)" \
            --cli target/dist/VigieChiroCompanion/bin/vigiechiro

      - name: L'archive portable survit-elle à son emballage ? (#3617)
        # L'app-image ci-dessus démarre : c'est la CHARGE UTILE. L'archive portable en est
        # l'ENVELOPPE, et `tar.gz` a été choisi pour une raison précise - il préserve le bit
        # exécutable du lanceur. Cette propriété n'était vérifiée nulle part.
        #
        # On empaquette, on ré-extrait AILLEURS (pas par-dessus l'original, qui masquerait une perte
        # de permission), et on relance depuis l'extraction. C'est le trajet réel de l'utilisateur.
        run: |
          set -euo pipefail
          bac=$(mktemp -d)
          tar -czf "$bac/portable.tar.gz" -C target/dist VigieChiroCompanion
          tar -xzf "$bac/portable.tar.gz" -C "$bac"
          python3 .github/scripts/verifie_demarrage_emballage.py \
            "$bac/VigieChiroCompanion/bin/VigieChiroCompanion" \
            --secondes 30 --libelle "archive portable (tar.gz ré-extraite)" \
            --cli "$bac/VigieChiroCompanion/bin/vigiechiro"
          rm -rf "$bac"

  # Surveille l'ALLONGEMENT du portail, que rien ne mesurait (#3508). Il AVERTIT, il ne bloque pas :
  # un rouge se relève, un avertissement qui porte la comparaison en clair s'instruit.
  #
  # `needs: build` sans condition de branche, donc exercé par CHAQUE PR. Une étape réservée à
  # `main` n'est jamais jouée avant sa fusion, et peut être fusionnée cassée - le dépôt l'a déjà payé.
  # Rien n'est écrit ici, donc rien n'exige d'être réservé à `main` : la série lue est de toute façon
  # celle de `main`, et une PR y lit la même tendance que lui.
  duree-du-portail:
    name: duree-du-portail
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Le portail met-il plus de temps qu'avant ?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/scripts/mesure_duree_portail.py
          python3 .github/scripts/mesure_duree_portail.py "${{ github.repository }}" maven.yml

  # Le contrat de SYSTÈME DE FICHIERS sur les trois plateformes livrées (#3525). Le produit part en
  # MSI, DMG et DEB ; ses tests ne tournaient que sous Linux - 21 jobs contre un, et ce dernier lance
  # `msiexec`, pas la suite. Le premier contact du code avec Windows avait donc lieu APRÈS la fusion.
  #
  # Ciblé, et non la suite entière : le gate dure onze minutes, et les minutes Windows coûtent le
  # double, macOS dix fois. Ce qui mérite les trois plateformes, c'est ce qui touche le disque -
  # renommage atomique, verrou, ZIP, copie entre volumes, emplacement de la configuration -, pas l'IHM
  # ni le domaine.
  #
  # Il s'exécute sur CHAQUE PR et décide lui-même s'il a quelque chose à vérifier. Un filtre
  # `paths:` l'aurait rendu ABSENT du récapitulatif la plupart du temps - et dans un dépôt sans
  # protection de branche, un job absent se lit exactement comme un job vert (ADR 2748). Ici son
  # silence est explicite : il le dit et il finit vert.
  contrat-fichiers:
    name: contrat-fichiers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # ⟨profondeur⟩ Plus de `fetch-depth: 0`. Le clone integral ne servait qu au `merge-base` du
        # script de portee, qui lit desormais le SHA de base que GitHub fournit. Il partait en vrille
        # jusqu a epuiser les vingt minutes du job - 1 199 s et 1 200 s le meme jour, sur ubuntu ET
        # macos, quand l etape prend 3 s a profondeur 1 (#4440). Le butoir d etape nomme la cause.
        timeout-minutes: 5

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      - name: Ce diff touche-t-il le contrat de système de fichiers ?
        id: portee
        shell: bash
        env:
          # Le SHA de base de la PR, que GitHub connait deja : il evite le `merge-base`, donc le
          # clone integral. Vide hors PR, et le script verifie alors TOUT plutot que conclure.
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./.github/scripts/porte-sur-le-contrat-de-fichiers.sh

      - name: Le contrat tient-il sur cette plateforme ?
        if: steps.portee.outputs.concerne == 'oui'
        shell: bash
        run: |
          ./mvnw -B test --file pom.xml -Dglass.platform=Headless \
            -Dsurefire.forkCount=1 \
            -Dtest='EcritureAtomiqueTest,VerrouWorkspaceTest,ExtracteurZipTest,ExtracteurZipQuotasTest,BornesExtractionTest,RestaurationCompleteTest,ArborescenceFichiersTest,ConfigurationAmorcageTest'
