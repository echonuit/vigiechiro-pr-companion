# Mise à jour automatique du manifeste Flatpak, après vérification qu'il démarre.
#
# POURQUOI CE WORKFLOW EXISTE
#
# Le manifeste épingle un `.deb` publié : son URL, son empreinte SHA-256 et
# l'entrée <release> du fichier AppStream doivent suivre chaque publication.
# Ces trois faits ont dérivé sur huit versions (#2247) : le manifeste pointait
# une version retirée, et l'AppStream annonçait une version encore plus vieille.
#
# Le manifeste porte pourtant DÉJÀ la description de cette mise à jour, dans son
# bloc `x-checker-data`, lu par `flatpak-external-data-checker`. Rien ne
# l'exécute automatiquement contre notre dépôt auto-hébergé : ce workflow est
# donc l'exécutant, et il fait tourner cet outil ici, directement, avant de
# rien proposer.
#
# QUATRE PARTIS PRIS
#
# 1. `--edit-only` plutôt que de laisser l'outil ouvrir la PR lui-même. On veut
#    CONSTRUIRE et DÉMARRER le Flatpak avant de proposer quoi que ce soit. Une
#    mise à jour automatique qui propose un paquet incapable de démarrer serait
#    pire que pas d'automatisation : elle donnerait l'illusion du contrôle. C'est
#    exactement le piège de #2299, où un paquet mort a été publié parce que la CI
#    vérifiait la présence du lanceur sans jamais l'exécuter.
#
# 2. La vérification a lieu ICI, pas dans un job `pull_request`. Une PR ouverte
#    avec le GITHUB_TOKEN ne déclenche AUCUN autre workflow (garde-fou anti-boucle
#    de GitHub) : la PR arriverait donc sans le moindre check. Reporter la
#    vérification à la PR reviendrait à ne pas vérifier du tout.
#
# 3. La PR est ouverte PUIS fusionnée dans la foulée, comme capture-vues.yml le fait
#    pour la galerie d'aperçus : `main` impose le passage par une PR, la PR n'est donc
#    pas un point de relecture mais le seul transport disponible. Ce qui autorise cette
#    fusion sans regard humain, c'est que le paquet vient d'être construit et DÉMARRÉ :
#    la mise à jour est dérivée d'une release, pas une décision de conception.
#
# 4. L'entrée `forcer` existe parce que la construction et le démarrage n'étaient
#    atteignables QUE par une montée de version : leurs pas sont gardés par
#    `steps.diff.outputs.change`. Un changement de manifeste qui n'aligne pas une
#    version - épingler une extension du SDK, corriger une permission, changer le
#    lanceur - traversait donc ce workflow sans que rien ne soit construit ni
#    démarré, et en rendait un vert. Ce vert-là ne disait pas « le paquet marche »,
#    il disait « il n'y avait pas de version à aligner », ce qui n'est pas la même
#    chose. `forcer` ouvre la porte de l'épreuve sans qu'il y ait de version à
#    suivre. Le pas qui PROPOSE, lui, reste gardé par le changement : quand rien n'a
#    bougé, il n'y a rien à proposer.

name: flatpak

on:
  # DÉCLENCHEMENT MANUEL, comme la publication winget et pour les mêmes deux raisons.
  #
  # Ce workflow portait `release: released`, qui ne s'est JAMAIS déclenché : la
  # release est dé-brouillonnée par release.yml avec le GITHUB_TOKEN, et GitHub ne
  # déclenche aucun workflow pour un événement produit avec ce jeton. Le vérifier :
  # `gh run list --event release` ne renvoie rien, sur tout l'historique du dépôt.
  #
  # Et le rebrancher aurait coûté cher : ce dépôt publie entre 3 et 37 fois par
  # jour, soit autant de constructions complètes du SDK et autant de commits de
  # mise à jour sur main, pour un manifeste qui ne change pas à chaque publication.
  #
  # Ce workflow reste donc le seul mécanisme de mise à jour du dépôt Flatpak : il
  # construit, démarre et publie à la demande, et attend `forcer` ou une montée
  # de version pour agir.
  workflow_dispatch:
    inputs:
      forcer:
        description: Construire et démarrer même sans montée de version
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # `checks: write` sert à publier le check `titre` sur la PR de mise à jour, pour la
  # même raison qu'en 2. : rien ne se déclenche sur une PR ouverte au GITHUB_TOKEN,
  # donc titre-pr.yml ne peut pas s'y exécuter. Même mécanisme que capture-vues.yml.
  checks: write

jobs:
  mettre-a-jour:
    name: Aligner le manifeste, après l'avoir éprouvé
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ID: fr.echonuit.VigieChiroCompanion
      MANIFESTE: flatpak/fr.echonuit.VigieChiroCompanion.yml
      # Clé publique de signature du dépôt Flatpak auto-hébergé. Non sensible : la
      # partie publique se distribue par construction (elle vit aussi dans tout
      # trousseau qui a ajouté le dépôt). Générée hors CI le 2026-08-15. La partie
      # PRIVÉE correspondante ne vit que dans le secret FLATPAK_GPG_KEY, jamais ici.
      FLATPAK_GPG_KEY_ID: 1BA6A82DA9213B177B160E56CD450A9383707B17
      FLATPAK_GPG_PUBLIC_KEY_B64: 
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      # Met à jour l'URL, l'empreinte et l'entrée <release> AppStream d'après le
      # bloc x-checker-data. `--edit-only` : modifie les fichiers, ne commite pas,
      # n'ouvre pas de PR. La suite du job décide si ça mérite d'être proposé.
      - name: Recalculer le manifeste depuis la dernière release
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker@sha256:58cbad601261c2ebaae2e18b6f639c09aa5809ef941dcff7284f68928ebb790d  # :latest du 2026-08-04
        with:
          args: --update --edit-only flatpak/fr.echonuit.VigieChiroCompanion.yml

      - name: Y a-t-il quelque chose à proposer ?
        id: diff
        run: |
          set -euo pipefail
          # Le conteneur tourne en root : les fichiers qu'il réécrit lui
          # appartiennent, et la suite du job ne pourrait plus les modifier.
          sudo chown -R "$(id -u):$(id -g)" flatpak/
          if git diff --quiet -- flatpak/; then
            echo "change=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Le manifeste Flatpak est déjà à jour."
          else
            echo "change=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- flatpak/
          fi

      - name: Installer flatpak et son constructeur
        if: steps.diff.outputs.change == 'true' || inputs.forcer
        run: |
          set -euo pipefail
          # xvfb et xdotool : le démarrage se fait désormais sur un VRAI serveur X,
          # et l'on exige qu'une fenêtre soit mappée. Cf. le pas « Démarrage réel ».
          bash .github/scripts/installer-paquets.sh --avec-recommandations flatpak flatpak-builder xvfb xdotool gnupg
          flatpak remote-add --if-not-exists --user \
            runtimes https://dl.flathub.org/repo/flathub.flatpakrepo

      # Dormant tant que FLATPAK_GPG_KEY n'est pas posé : la construction et la
      # publication qui suivent restent alors non signées (NoGpgVerify=true côté
      # .flatpakrepo). Même patron d'inertie que le secret FLATPAK_DEPLOY_TOKEN,
      # plus bas. La clé privée, elle, ne transite jamais par un commit, un journal
      # de build ou une conversation : uniquement par ce secret GitHub.
      - name: Vérifier la présence du secret FLATPAK_GPG_KEY
        id: garde-flatpak-signature
        if: steps.diff.outputs.change == 'true' || inputs.forcer
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLATPAK_GPG_KEY absent : le dépôt auto-hébergé sera publié non signé."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Importer la clé de signature GPG
        if: (steps.diff.outputs.change == 'true' || inputs.forcer) && steps.garde-flatpak-signature.outputs.present == 'true'
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        # allow-loopback-pinentry / pinentry-mode loopback : sans ça, la signature
        # ostree plus bas (flatpak-builder --gpg-sign) tente d'ouvrir un pinentry
        # interactif et plante avec « Pinentry: Inappropriate ioctl for device »,
        # ce runner n'ayant pas de terminal de contrôle.
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          echo "$FLATPAK_GPG_KEY" | base64 -d -i | gpg --batch --import
          gpgconf --homedir "$GNUPGHOME" --kill gpg-agent

      - name: Construire le Flatpak
        if: steps.diff.outputs.change == 'true' || inputs.forcer
        working-directory: flatpak
        # --disable-rofiles-fuse : le runner n'expose pas FUSE.
        # --install-deps-from : tire la Platform, le SDK et l'extension openjdk.
        # Répertoire de sortie ET répertoire d'état hors du dépôt : par défaut,
        # flatpak-builder écrit `builddir/` et `.flatpak-builder/` dans le dossier
        # courant, soit des centaines de Mo au milieu des sources versionnées. Le
        # premier essai a fini en push rejeté par GitHub (objet de 147 Mo).
        #
        # --repo : exporte la construction vers un dépôt ostree, EN PLUS de
        # l'installer localement. flatpak-builder installe alors depuis ce même
        # dépôt plutôt que depuis un état intermédiaire : le pas « Démarrage réel »
        # qui suit éprouve donc exactement ce que « Publier le dépôt Flatpak
        # auto-hébergé », plus bas, s'apprête à publier - jamais un artefact distinct
        # qui aurait pu diverger.
        #
        # --gpg-sign / --gpg-homedir : ajoutés seulement si la clé a pu être
        # importée juste au-dessus (garde-flatpak-signature). Sans ça, l'export
        # reste NON signé - le pas « Générer le .flatpakrepo » plus bas s'accorde
        # sur le même indicateur pour ne jamais annoncer une signature absente.
        run: |
          set -euo pipefail
          args=(--disable-rofiles-fuse --install-deps-from=runtimes
                --state-dir="${RUNNER_TEMP}/flatpak-etat"
                --repo="${RUNNER_TEMP}/flatpak-repo"
                --user --install --force-clean)
          if [ "${{ steps.garde-flatpak-signature.outputs.present }}" = "true" ]; then
            args+=(--gpg-sign="${FLATPAK_GPG_KEY_ID}" --gpg-homedir="${RUNNER_TEMP}/gnupg")
          fi
          flatpak-builder "${args[@]}" "${RUNNER_TEMP}/flatpak-build" "${APP_ID}.yml"

      - name: Démarrage réel du Flatpak
        if: steps.diff.outputs.change == 'true' || inputs.forcer
        # TROIS conditions : tenir debout, n'avoir levé aucune erreur de chargement,
        # et surtout AVOIR OUVERT UNE FENÊTRE.
        #
        # Ce pas tournait avec `-Dglass.platform=Headless`, c'est-à-dire SANS
        # affichage. Il attestait donc « le paquet se charge », jamais « le paquet
        # s'affiche », et il ne pouvait pas voir que le manifeste ne démarrait sur
        # aucun bureau Wayland (#2191). Un vert qui ne portait pas sur la propriété
        # qui a cassé.
        #
        # Il tourne maintenant sur un VRAI serveur X, et exige une fenêtre mappée.
        #
        # ⚠️ Ce qu'il ne prouve toujours PAS : le runner n'a pas de session Wayland,
        # donc `fallback-x11` y accorderait X11 et le manifeste fautif passerait ici.
        # C'est `verifie-affichage-flatpak.sh` (lint.yml) qui garde ce cas-là, sur la
        # politique déclarée. Les deux sont complémentaires, aucun ne suffit.
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x900x24 -nolisten tcp >/dev/null 2>&1 &
          xvfb=$!
          trap 'kill "$xvfb" 2>/dev/null || true' EXIT
          sleep 3

          journal=$(mktemp)
          # DISPLAY posé sur l'HÔTE, et non via --env : flatpak monte dans le bac à
          # sable la socket X correspondant au DISPLAY de l'hôte au lancement. Avec
          # `--env=DISPLAY=:99` seul, le bac ne reçoit que X0 et l'application démarre
          # sans jamais mapper de fenêtre, SANS la moindre erreur au journal.
          DISPLAY=:99 flatpak run "$APP_ID" >"$journal" 2>&1 &
          appli=$!

          fenetre=""
          for _ in $(seq 1 40); do
            sleep 2
            fenetre=$(DISPLAY=:99 xdotool search --onlyvisible --name . 2>/dev/null | head -1) || true
            [ -n "$fenetre" ] && break
            kill -0 "$appli" 2>/dev/null || break
          done

          if ! kill -0 "$appli" 2>/dev/null; then
            wait "$appli" || true
            echo "::error::Le Flatpak s'est arrêté seul : il ne démarre pas."
            sed -n '1,120p' "$journal"
            exit 1
          fi

          if [ -z "$fenetre" ]; then
            echo "::error::Le Flatpak reste en vie mais n'a ouvert AUCUNE fenêtre en 80 s."
            sed -n '1,120p' "$journal"
            kill "$appli" 2>/dev/null || true
            exit 1
          fi

          if grep -qE 'NoClassDefFoundError|ClassNotFoundException|Unable to open DISPLAY|Exception in Application start method' "$journal"; then
            echo "::error::Une fenêtre existe, mais le démarrage a levé une erreur."
            sed -n '1,120p' "$journal"
            kill "$appli" 2>/dev/null || true
            exit 1
          fi

          titre=$(DISPLAY=:99 xdotool getwindowname "$fenetre" 2>/dev/null || echo '?')
          kill "$appli" 2>/dev/null || true
          echo "Le Flatpak démarre et ouvre une fenêtre « ${titre} », sans erreur."

      # Dépôt Flatpak auto-hébergé : seul canal de distribution Flatpak du projet (#2111).
      #
      # Dormant tant que ENABLE_FLATPAK_REPO != 'true' OU que FLATPAK_DEPLOY_TOKEN
      # n'est pas posé : même garde-fou d'inertie que docs.yml pour companion/
      # companion-dev/brief, pour la même raison : ce changement peut être fusionné
      # avant que le dépôt de publication, le domaine et le jeton existent, et la
      # publication démarrera d'elle-même le jour où ils sont posés.
      #
      # SIGNÉ dès que FLATPAK_GPG_KEY est posé (cf. garde-flatpak-signature et
      # « Importer la clé de signature GPG », plus haut) ; NON signé sinon
      # (`NoGpgVerify=true`) : c'est le même indicateur qui décide dans les deux
      # pas, pour ne jamais annoncer un .flatpakrepo signé sur un export qui ne
      # l'était pas.
      - name: Vérifier la présence du secret FLATPAK_DEPLOY_TOKEN
        id: garde-flatpak-repo
        env:
          FLATPAK_DEPLOY_TOKEN: ${{ secrets.FLATPAK_DEPLOY_TOKEN }}
        run: |
          if [ -z "$FLATPAK_DEPLOY_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLATPAK_DEPLOY_TOKEN absent : publication du dépôt Flatpak auto-hébergé ignorée."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Générer le .flatpakrepo
        if: (steps.diff.outputs.change == 'true' || inputs.forcer) && vars.ENABLE_FLATPAK_REPO == 'true' && steps.garde-flatpak-repo.outputs.present == 'true'
        run: |
          set -euo pipefail
          fichier="${RUNNER_TEMP}/flatpak-repo/${APP_ID}.flatpakrepo"
          {
            echo "[Flatpak Repo]"
            echo "Title=VigieChiro Companion (dépôt auto-hébergé)"
            echo "Url=https://flatpak.echonuit.fr/"
            echo "Homepage=https://companion.echonuit.fr/"
            echo "Comment=Dépôt Flatpak officiel du projet VigieChiro Companion"
            if [ "${{ steps.garde-flatpak-signature.outputs.present }}" = "true" ]; then
              echo "Description=Publié depuis ce dépôt à chaque montée de version. Signé (clé ${FLATPAK_GPG_KEY_ID})."
              echo "GPGKey=${FLATPAK_GPG_PUBLIC_KEY_B64}"
            else
              echo "Description=Publié depuis ce dépôt à chaque montée de version. Non signé pour l'instant : ajouté avec --no-gpg-verify."
              echo "NoGpgVerify=true"
            fi
          } > "$fichier"

      - name: Publier le dépôt Flatpak auto-hébergé (flatpak.echonuit.fr)
        if: (steps.diff.outputs.change == 'true' || inputs.forcer) && vars.ENABLE_FLATPAK_REPO == 'true' && steps.garde-flatpak-repo.outputs.present == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          personal_token: ${{ secrets.FLATPAK_DEPLOY_TOKEN }}
          external_repository: echonuit/flatpak
          publish_branch: gh-pages
          publish_dir: ${{ runner.temp }}/flatpak-repo
          cname: flatpak.echonuit.fr
          full_commit_message: "build(flatpak): republier le dépôt depuis ${{ github.sha }}"

      # Volontairement SANS `|| inputs.forcer` : forcer sert à ÉPROUVER, pas à
      # proposer. Quand le manifeste n'a pas bougé, il n'y a rien à committer, et
      # une PR vide échouerait au push.
      - name: Proposer la mise à jour, puis la fusionner
        if: steps.diff.outputs.change == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's|.*/download/v\([^/]*\)/.*|\1|p' "$MANIFESTE" | head -1)
          branche="flatpak/maj-${version}"

          if git ls-remote --exit-code --heads origin "$branche" >/dev/null 2>&1; then
            echo "::notice::La branche ${branche} existe déjà : mise à jour déjà proposée."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branche"
          # Les deux fichiers nommément, jamais `git add flatpak/` : la
          # construction a lieu avant ce pas, et un ajout du dossier entier
          # embarquerait ses artefacts. Ce qu'on propose ici, ce sont exactement
          # les deux fichiers que le vérificateur a réécrits.
          git add flatpak/fr.echonuit.VigieChiroCompanion.yml \
                  flatpak/fr.echonuit.VigieChiroCompanion.metainfo.xml
          git commit \
            -m "build(flatpak): aligner le manifeste sur la v${version}" \
            -m "Mise à jour produite par flatpak-external-data-checker depuis le bloc x-checker-data du manifeste, puis éprouvée : le Flatpak a été construit et démarré (45 s debout, sans erreur de chargement) avant d'être proposé." \
            -m "Refs #2247"
          git push origin "$branche"

          corps=$(mktemp)
          {
            echo "Mise à jour automatique du manifeste Flatpak vers la **v${version}**."
            echo
            echo "Produite par \`flatpak-external-data-checker\`, exécuté directement dans ce workflow, à partir du bloc \`x-checker-data\` du manifeste."
            echo
            echo "Le paquet a été **construit et démarré** avant l'ouverture de cette PR : 45 s debout, sans erreur de chargement."
            echo
            echo "La vérification a lieu dans le workflow et non sur cette PR, car une PR ouverte avec le \`GITHUB_TOKEN\` ne déclenche aucun autre workflow. PR ouverte par le bot car \`main\` impose le passage par une PR ; squash-mergée automatiquement."
            echo
            echo "Refs #2247"
          } > "$corps"

          titre="build(flatpak): aligner le manifeste sur la v${version}"
          gh pr create --base main --head "$branche" --title "$titre" --body-file "$corps"

          # Valider le titre et publier le résultat comme check `titre`, exactement
          # comme le fait capture-vues.yml : titre-pr.yml ne peut PAS s'exécuter sur
          # cette PR (aucun workflow n'est déclenché par un événement produit avec le
          # GITHUB_TOKEN), donc sans ce passage elle ne serait validée par rien. On
          # exécute le MÊME script : seul le transport du résultat change. Publier un
          # succès en dur reviendrait à faire croire à une vérification inexistante.
          chmod +x .github/scripts/verifie-titre-pr.sh
          if ./.github/scripts/verifie-titre-pr.sh "$titre"; then
            verdict=success
            resume="Titre conforme à Conventional Commits."
          else
            verdict=failure
            resume="Titre non conforme : la PR de mise à jour ne sera pas fusionnée."
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=titre \
            -f head_sha="$(git rev-parse HEAD)" \
            -f status=completed \
            -f conclusion="$verdict" \
            -f 'output[title]=Titre de PR' \
            -f "output[summary]=${resume}" >/dev/null

          if [ "$verdict" != "success" ]; then
            echo "::error::${resume}"
            exit 1
          fi

          # Merge LINÉAIRE (compatible required_linear_history) : squash si autorisé,
          # sinon rebase. Retry : l'état « mergeable » est parfois calculé en asynchrone
          # juste après l'ouverture. `[skip ci]` sur le sujet du squash : un changement
          # de manifeste Flatpak n'a pas de code à valider sur main, et le paquet vient
          # d'être construit ET démarré quelques pas plus haut.
          for i in 1 2 3 4 5; do
            if gh pr merge "$branche" --squash --delete-branch --subject "$titre [skip ci]" --body "" 2>/dev/null \
               || gh pr merge "$branche" --rebase --delete-branch 2>/dev/null; then
              echo "Mise à jour Flatpak fusionnée."
              exit 0
            fi
            echo "Merge pas encore possible (tentative $i/5), nouvelle tentative dans 5 s..."
            sleep 5
          done
          echo "::error::Échec du merge de la PR de mise à jour Flatpak après 5 tentatives."
          exit 1
