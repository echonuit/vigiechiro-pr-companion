# Dit ce qui a changé entre DEUX tournages de recette.
#
# ## Pourquoi à la demande, et non committé
#
# La comparaison « dernière version contre tournante » change dès que l'un des deux bouge : une page
# committée serait périmée au prochain tournage manuel. Le résultat vit donc dans le résumé du job et
# dans un artefact, toujours frais, et `dev-docs/recette/comparer-deux-tournages.md` dit comment le
# lire (#4274).
#
# ## Pourquoi il faut normaliser les noms
#
# Sur un tag de version, les pièces portent le préfixe de leur banc - `bash-` ou `java-` - parce que
# les deux bancs nomment leurs clips à l'identique et s'écraseraient sinon (#4258). Sur la pré-version
# roulante, elles n'en portent pas. Comparer les deux demande donc de retirer le préfixe après
# téléchargement, sans quoi aucun cas ne se retrouverait des deux côtés et l'outil annoncerait
# cinquante cas « apparus » et cinquante « disparus ».
#
# ## Une branche se compare à `main` avant fusion
#
# Chaque côté est une version publiée OU un numéro d'exécution de `tournage-recette.yml` (#5930,
# ADR 5930). Une valeur purement numérique est une exécution : aucun tag de ce dépôt ne l'est. On
# tourne la branche, on tourne `main`, et on donne les deux numéros.
#
# L'ADR 5854 avait écarté cette entrée : c'est une seconde voie de reprise, à garder en parité avec
# celle de `mesurer-les-planchers.yml`, et un artefact expire. Les deux objections ont leur réponse
# ici. Les refus sont ceux de la mesure, par les mêmes phrases, et le garde
# `verifie_decisions_du_tournage_connecte.py` les exige des deux ateliers face au même leurre. Et un
# artefact expiré se dit, au lieu d'échouer au téléchargement.
#
# Un seul refus de la mesure ne se reprend pas, celui du « même commit ». Il est juste pour un
# plancher, qui est le bruit entre deux tournages identiques. Ici, deux commits sont l'objet.
name: comparer deux tournages

run-name: "comparaison ${{ inputs.avant }} → ${{ inputs.apres }} (banc ${{ inputs.banc }})"

on:
  workflow_dispatch:
    inputs:
      avant:
        description: "Ce à quoi on compare : un tag de version, « clips-recette », « clips-plateforme-de-test-precedent », ou un numéro d'exécution de tournage"
        type: string
        required: true
      apres:
        description: "Ce qu'on regarde : un tag de version, « clips-recette », « clips-plateforme-de-test », ou un numéro d'exécution de tournage"
        type: string
        default: "clips-recette"
      banc:
        description: "Quel banc, sur les tags de version (sans effet sur une exécution)"
        type: choice
        default: "bash"
        options:
          - "bash"
          - "java"
      tolerance:
        description: "Tolérance de couleur, en %. 5 absorbe l'anticrénelage sans rendre aveugle."
        type: string
        default: "5"

# Lire les artefacts d'une autre exécution demande `actions: read`. Rien d'autre.
permissions:
  contents: read
  actions: read

jobs:
  comparer:
    name: Comparer les deux tournages
    runs-on: ubuntu-latest
    # Un butoir, comme tout job : le téléchargement de cent clips peut pendre sur un miroir.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reprendre les clips des deux tournages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AVANT: ${{ inputs.avant }}
          APRES: ${{ inputs.apres }}
          BANC: ${{ inputs.banc }}
        run: |
          set -euo pipefail

          # Ce que chaque côté EST, écrit en tête du résumé. Un index qui ne dit pas quels commits il
          # met côte à côte se relit trois jours plus tard sans qu'on sache ce qu'il a jugé.
          annoncer() { # <dossier> <phrase>
            echo "$2"
            echo "- **$1** : $2" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }

          # Une exécution de `tournage-recette.yml` (#5930). Les refus sont ceux de
          # `mesurer-les-planchers.yml`, par les mêmes phrases : le garde les exige des deux ateliers.
          reprendre_une_execution() { # <numéro d'exécution> <dossier>
            local n="$1" dossier="$2" lu sha branche fin liste nom perime compte
            if ! lu=$(gh run view "$n" --json headSha,headBranch,conclusion \
              --jq '.headSha + " " + .headBranch + " " + (.conclusion // "")'); then
              echo "::error::L'exécution $n ne se lit pas : ni son commit ni sa conclusion."
              exit 1
            fi
            read -r sha branche fin <<< "$lu"
            # Un tournage amputé ne se compare pas : il lui manque des clips, et ceux qu'il porte
            # peuvent s'être arrêtés avant leur fin.
            if [ "$fin" != "success" ]; then
              echo "::error::L'exécution $n n'a pas conclu en succès (« ${fin:-en cours} »)."
              exit 1
            fi
            # AUCUN refus du « même commit », à dessein : deux commits sont l'objet d'une
            # comparaison. C'est le seul refus de la mesure qui ne se reprend pas.

            # UN artefact de clips, et un seul. Une exécution relancée en porte un par tentative, et
            # reprendre « les clips » mêlerait deux tournages sous le même numéro (#5797).
            liste=$(gh api "repos/${GH_REPO}/actions/runs/${n}/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | startswith("clips-")) | "\(.name) \(.expired)"')
            if [ -z "$liste" ] || [ "$(printf '%s\n' "$liste" | wc -l)" -ne 1 ]; then
              echo "::error::L'exécution $n ne porte pas UN artefact de clips, mais : « ${liste//$'\n'/, } »."
              # Passé son délai, un artefact disparaît de la liste : une exécution du 4 septembre
              # 2026 n'en rendait plus aucun le 6 octobre. Le vide a donc deux lectures.
              echo "::error::Un artefact de clips est gardé quatorze jours : passé ce délai, l'exécution n'en liste plus."
              exit 1
            fi
            read -r nom perime <<< "$liste"
            if [ "$perime" = "true" ]; then
              echo "::error::L'artefact de clips de l'exécution $n a expiré : il est gardé quatorze jours."
              echo "::error::Relancer un tournage du commit ${sha:0:9}, et comparer à celui-là."
              exit 1
            fi
            gh run download "$n" --name "$nom" --dir "repris/$n"
            find "repris/$n" -name '*.mp4' -exec mv -t "$dossier" {} +
            compte=$(find "$dossier" -name '*.mp4' | wc -l)
            if [ "$compte" -eq 0 ]; then
              echo "::error::Aucun clip repris de l'exécution $n. Un dossier vide n'est pas « rien n'a changé »."
              exit 1
            fi
            annoncer "$dossier" "Exécution $n (${sha:0:9}, branche ${branche}) : ${compte} clip(s)."
          }

          reprendre() { # <source> <dossier>
            local source="$1" dossier="$2" clip nu
            mkdir -p "$dossier"
            # `clips-connectes` est REFUSÉE, et pas parce qu'elle serait introuvable : elle existe,
            # et c'est précisément le piège. Ses clips sont tournés contre la vraie plateforme, donc
            # leur écran dépend de données vivantes. Deux tournages du même commit y diffèrent parce
            # qu'une nuit a été traitée entre les deux, et le plancher de bruit mesuré en #4287
            # mesurerait alors la plateforme au lieu du rendu.
            #
            # Le refus vaut mieux que le chiffre : un outil qui accepte une source dont il ne sait
            # rien conclure rend un résultat qui A L'AIR juste (#4306).
            if [ "$source" = "clips-connectes" ]; then
              echo "::error::« clips-connectes » ne se compare pas. Ses clips sont tournés contre la vraie"
              echo "::error::plateforme : leur écran suit des données vivantes, et le plancher de bruit y"
              echo "::error::mesurerait la plateforme plutôt que le produit. Les regarder, pas les comparer."
              exit 1
            fi
            # Un nombre est une EXÉCUTION, jamais une version : aucun tag de ce dépôt n'est purement
            # numérique. Il ne se cherche donc pas parmi les versions, et une exécution inconnue se
            # dit illisible au lieu de s'annoncer comme un tag introuvable.
            if [[ "$source" =~ ^[0-9]+$ ]]; then
              reprendre_une_execution "$source" "$dossier"
              return
            fi
            if ! gh release view "$source" >/dev/null 2>&1; then
              echo "::error::« $source » n'est ni un tag de version ni une pré-version de ce dépôt."
              exit 1
            fi
            # Le banc demandé D'ABORD. Le motif général n'est qu'un REPLI, et il ne se déclenche que
            # si le premier n'a rien ramené - le cas d'une pré-version roulante, dont les pièces ne
            # portent aucun préfixe.
            #
            # Enchaîner les deux inconditionnellement ramènerait, sur un tag qui porte les DEUX
            # bancs, les clips de l'autre banc par-dessus. La normalisation qui suit les renommerait
            # tous pareil, et « bash-Truc.mp4 » puis « java-Truc.mp4 » deviendraient le même fichier :
            # une comparaison qui mélange les deux bancs en ayant l'air juste.
            gh release download "$source" --dir "$dossier" --pattern "${BANC}-*.mp4" --clobber 2>/dev/null || true
            if [ "$(find "$dossier" -name "*.mp4" | wc -l)" -eq 0 ]; then
              echo "« $source » ne porte aucune pièce « ${BANC}- » : repli sur les pièces sans préfixe."
              gh release download "$source" --dir "$dossier" --pattern "*.mp4" --clobber 2>/dev/null || true
            fi

            # La normalisation. Sans elle, `bash-Truc.mp4` et `Truc.mp4` sont deux cas différents,
            # et la comparaison annoncerait tout le monde apparu et tout le monde disparu.
            for clip in "$dossier"/*.mp4; do
              [ -e "$clip" ] || continue
              nu=$(basename "$clip"); nu=${nu#bash-}; nu=${nu#java-}
              [ "$(basename "$clip")" = "$nu" ] || mv -f "$clip" "$dossier/$nu"
            done

            local compte
            compte=$(find "$dossier" -name '*.mp4' | wc -l)
            annoncer "$dossier" "« $source » : ${compte} clip(s)."
            [ "$compte" -gt 0 ] || {
              echo "::error::Aucun clip repris de « $source ». Un dossier vide n'est pas « rien n'a changé »."
              exit 1
            }
          }

          reprendre "$AVANT" avant
          reprendre "$APRES" apres
          # Une ligne vide, pour que l'index qui suit ne se colle pas à la liste des deux côtés.
          echo >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Cache des paquets APT (ffmpeg, imagemagick)
        # Ce cache porte sur les `.deb`, pas sur l'état installé : `dpkg` tourne donc à chaque run,
        # et avec lui les scripts post-installation. On perd le dépaquetage, on garde le
        # téléchargement.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          # La clé NOMME ce qu'elle contient : ajouter un paquet sans la changer servirait un cache
          # d'avant, et le manque n'apparaîtrait qu'au second passage.
          key: apt-${{ runner.os }}-comparer-tournages-ffmpeg-imagemagick

      - name: Installer de quoi lire les clips et comparer les images
        # Cette étape manquait, et le workflow rendait quand même un job VERT. `compare` était
        # introuvable, la part de pixels valait « ? », et les cinquante cas d'un vrai tournage se
        # rangeaient en « mesure impossible » (run 32640637929). Le compteur de mesures impossibles
        # l'a dit ; sans lui, le résumé aurait annoncé « aucun cas ne bouge ».
        #
        # « L'image `ubuntu-latest` ne fournit AUCUN ImageMagick », comme le dit déjà
        # `capture-vues.yml`, et `--avec-recommandations` parce que le paquet ne tire ses binaires
        # que par ses recommandations. ffmpeg s'installe sans, comme dans `lint.yml`.
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: |
          set -euo pipefail
          python3 .github/scripts/installer_paquets.py ffmpeg
          python3 .github/scripts/installer_paquets.py --avec-recommandations imagemagick

      - name: Comparer, et écrire ce qu'on doit regarder
        env:
          TOLERANCE: ${{ inputs.tolerance }}
        run: |
          set -euo pipefail
          chmod +x .github/assets/compare_tournages.py
          # Un écart se lit contre le bruit de SON cas, pas contre zéro (#4287). Le fichier est
          # versionné, et `mesurer-les-planchers.yml` le remplit avec l'instrument de ce runner.
          #
          # L'outil confronte cet instrument à celui que le fichier déclare, et REFUSE de comparer
          # s'ils diffèrent : le même clip rend 0,020 % sur un poste et 0,134 % ici, et un index
          # classé contre le mauvais sol a l'air aussi juste que l'autre (#5885). Le jour où l'image
          # du runner change de version, ce pas rougit en nommant les deux, et c'est le signal qu'il
          # faut remesurer.
          #
          # L'index va au résumé QUE L'OUTIL AIT REFUSÉ OU NON, puis ce pas rend son code. Deux sources
          # sans aucun cas commun font sortir l'outil en 1 (#5934) : il écrit quand même l'index, et
          # la liste des cas apparus et disparus y est tout ce qu'il reste à lire. Versé après l'appel
          # sous `set -e`, le résumé restait vide précisément sur ce refus.
          code=0
          python3 .github/assets/compare_tournages.py avant apres comparaison "${TOLERANCE}" \
            .github/assets/planchers-tournages.tsv || code=$?
          if [ -f comparaison/index.md ]; then
            cat comparaison/index.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${code}"

      - name: Garder les images de la comparaison
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: comparaison-${{ inputs.avant }}-${{ inputs.apres }}
          path: comparaison/
          retention-days: 14
          if-no-files-found: error
