# Dit ce qui a changé entre DEUX tournages de recette.
#
# ## Pourquoi à la demande, et non committé
#
# La comparaison « dernière version contre tournante » change dès que l'un des deux bouge : une page
# committée serait périmée au prochain tournage manuel. Le résultat vit donc dans le résumé du job et
# dans un artefact, toujours frais, et `dev-docs/recette/comparer-deux-tournages.md` dit comment le
# lire (#4274).
#
# ## Pourquoi il faut normaliser les noms
#
# Sur un tag de version, les pièces portent le préfixe de leur banc - `bash-` ou `java-` - parce que
# les deux bancs nomment leurs clips à l'identique et s'écraseraient sinon (#4258). Sur la pré-version
# roulante, elles n'en portent pas. Comparer les deux demande donc de retirer le préfixe après
# téléchargement, sans quoi aucun cas ne se retrouverait des deux côtés et l'outil annoncerait
# cinquante cas « apparus » et cinquante « disparus ».
name: comparer deux tournages

run-name: "comparaison ${{ inputs.avant }} → ${{ inputs.apres }} (banc ${{ inputs.banc }})"

on:
  workflow_dispatch:
    inputs:
      avant:
        description: "Ce à quoi on compare : un tag de version, ou « clips-recette »"
        type: string
        required: true
      apres:
        description: "Ce qu'on regarde : un tag de version, ou « clips-recette »"
        type: string
        default: "clips-recette"
      banc:
        description: "Quel banc, sur les tags de version"
        type: choice
        default: "bash"
        options:
          - "bash"
          - "java"
      tolerance:
        description: "Tolérance de couleur, en %. 5 absorbe l'anticrénelage sans rendre aveugle."
        type: string
        default: "5"

permissions:
  contents: read

jobs:
  comparer:
    name: Comparer les deux tournages
    runs-on: ubuntu-latest
    # Un butoir, comme tout job : le téléchargement de cent clips peut pendre sur un miroir.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reprendre les clips des deux tournages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AVANT: ${{ inputs.avant }}
          APRES: ${{ inputs.apres }}
          BANC: ${{ inputs.banc }}
        run: |
          set -euo pipefail

          reprendre() { # <source> <dossier>
            local source="$1" dossier="$2" clip nu
            mkdir -p "$dossier"
            # `clips-connectes` est REFUSÉE, et pas parce qu'elle serait introuvable : elle existe,
            # et c'est précisément le piège. Ses clips sont tournés contre la vraie plateforme, donc
            # leur écran dépend de données vivantes. Deux tournages du même commit y diffèrent parce
            # qu'une nuit a été traitée entre les deux, et le plancher de bruit mesuré en #4287
            # mesurerait alors la plateforme au lieu du rendu.
            #
            # Le refus vaut mieux que le chiffre : un outil qui accepte une source dont il ne sait
            # rien conclure rend un résultat qui A L'AIR juste (#4306).
            if [ "$source" = "clips-connectes" ]; then
              echo "::error::« clips-connectes » ne se compare pas. Ses clips sont tournés contre la vraie"
              echo "::error::plateforme : leur écran suit des données vivantes, et le plancher de bruit y"
              echo "::error::mesurerait la plateforme plutôt que le produit. Les regarder, pas les comparer."
              exit 1
            fi
            if ! gh release view "$source" >/dev/null 2>&1; then
              echo "::error::« $source » n'est ni un tag de version ni une pré-version de ce dépôt."
              exit 1
            fi
            # Le banc demandé D'ABORD. Le motif général n'est qu'un REPLI, et il ne se déclenche que
            # si le premier n'a rien ramené - le cas d'une pré-version roulante, dont les pièces ne
            # portent aucun préfixe.
            #
            # Enchaîner les deux inconditionnellement ramènerait, sur un tag qui porte les DEUX
            # bancs, les clips de l'autre banc par-dessus. La normalisation qui suit les renommerait
            # tous pareil, et « bash-Truc.mp4 » puis « java-Truc.mp4 » deviendraient le même fichier :
            # une comparaison qui mélange les deux bancs en ayant l'air juste.
            gh release download "$source" --dir "$dossier" --pattern "${BANC}-*.mp4" --clobber 2>/dev/null || true
            if [ "$(find "$dossier" -name "*.mp4" | wc -l)" -eq 0 ]; then
              echo "« $source » ne porte aucune pièce « ${BANC}- » : repli sur les pièces sans préfixe."
              gh release download "$source" --dir "$dossier" --pattern "*.mp4" --clobber 2>/dev/null || true
            fi

            # La normalisation. Sans elle, `bash-Truc.mp4` et `Truc.mp4` sont deux cas différents,
            # et la comparaison annoncerait tout le monde apparu et tout le monde disparu.
            for clip in "$dossier"/*.mp4; do
              [ -e "$clip" ] || continue
              nu=$(basename "$clip"); nu=${nu#bash-}; nu=${nu#java-}
              [ "$(basename "$clip")" = "$nu" ] || mv -f "$clip" "$dossier/$nu"
            done

            local compte
            compte=$(find "$dossier" -name '*.mp4' | wc -l)
            echo "« $source » : ${compte} clip(s)."
            [ "$compte" -gt 0 ] || {
              echo "::error::Aucun clip repris de « $source ». Un dossier vide n'est pas « rien n'a changé »."
              exit 1
            }
          }

          reprendre "$AVANT" avant
          reprendre "$APRES" apres

      - name: Cache des paquets APT (ffmpeg, imagemagick)
        # Ce cache porte sur les `.deb`, pas sur l'état installé : `dpkg` tourne donc à chaque run,
        # et avec lui les scripts post-installation. On perd le dépaquetage, on garde le
        # téléchargement.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-vigiechiro
          # La clé NOMME ce qu'elle contient : ajouter un paquet sans la changer servirait un cache
          # d'avant, et le manque n'apparaîtrait qu'au second passage.
          key: apt-${{ runner.os }}-comparer-tournages-ffmpeg-imagemagick

      - name: Installer de quoi lire les clips et comparer les images
        # Cette étape manquait, et le workflow rendait quand même un job VERT. `compare` était
        # introuvable, la part de pixels valait « ? », et les cinquante cas d'un vrai tournage se
        # rangeaient en « mesure impossible » (run 32640637929). Le compteur de mesures impossibles
        # l'a dit ; sans lui, le résumé aurait annoncé « aucun cas ne bouge ».
        #
        # « L'image `ubuntu-latest` ne fournit AUCUN ImageMagick », comme le dit déjà
        # `capture-vues.yml`, et `--avec-recommandations` parce que le paquet ne tire ses binaires
        # que par ses recommandations. ffmpeg s'installe sans, comme dans `lint.yml`.
        env:
          APT_CACHE: ${{ runner.temp }}/apt-vigiechiro
        run: |
          set -euo pipefail
          python3 .github/scripts/installer_paquets.py ffmpeg
          python3 .github/scripts/installer_paquets.py --avec-recommandations imagemagick

      - name: Comparer, et écrire ce qu'on doit regarder
        env:
          TOLERANCE: ${{ inputs.tolerance }}
        run: |
          set -euo pipefail
          chmod +x .github/assets/compare_tournages.py
          # Les planchers mesurés sur runner : un écart se lit contre le bruit de SON cas, pas
          # contre zéro (#4287). Le fichier est versionné, et `--plancher` l'enrichit paire après
          # paire.
          python3 .github/assets/compare_tournages.py avant apres comparaison "${TOLERANCE}" \
            .github/assets/planchers-tournages.tsv
          cat comparaison/index.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Garder les images de la comparaison
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: comparaison-${{ inputs.avant }}-${{ inputs.apres }}
          path: comparaison/
          retention-days: 14
          if-no-files-found: error
