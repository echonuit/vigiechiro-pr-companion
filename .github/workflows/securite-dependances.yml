# Inventaire et surveillance des dépendances livrées (#2740, lot 3 du chantier #2720).
#
# Ce que ce workflow répond, et que personne ne pouvait affirmer avant lui : « qu'est-ce que le
# fat-jar embarque, et l'une de ces bibliothèques porte-t-elle une vulnérabilité connue ? »
#
# Trois déclenchements, pour trois questions différentes :
# - `schedule` : une vulnérabilité publiée cette nuit concerne du code que nous n'avons pas touché.
#   C'est le seul déclenchement qui la trouve.
# - `pull_request` sur le pom : ne pas INTRODUIRE une dépendance vulnérable.
# - `workflow_dispatch` : vérifier à la demande, avant une release par exemple.
name: Sécurité des dépendances

on:
  schedule:
    # Lundi 6 h UTC : le rapport est là au début de la semaine, pas au milieu d'une soirée de travail.
    - cron: "0 6 * * 1"
  # ⟨aucun `paths:` ici, et c'est une décision⟩ Un atelier filtré par chemins ne se déclenche pas,
  # donc ses jobs sont ABSENTS du récapitulatif d'une demande. Ni verts, ni sautés : absents. Or
  # `verifie_verdict_avant_fusion.py` compte ce qui est présent, si bien qu'il déclarait un verdict
  # complet sans eux (ADR 2748, ADR 4571, chantier #5294, issue #5379). Les deux jobs tournent donc
  # toujours, et c'est une ÉTAPE qui décide - le patron des neuf autres jobs du dépôt.
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventaire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ⟨portee⟩ Chantier #5294, issue #5379. Ce job juge ce que le fat-jar EMBARQUE : quand rien de
      # ce qui resout les dependances ne bouge, il n a rien a dire. Le job tourne quand meme et
      # conclut « sans objet », plutot que d etre absent du recapitulatif.
      - name: "Ce diff change-t-il ce que nous embarquons (#5379)"
        id: portee
        shell: bash
        # ⟨butoir⟩ L etape fait un `git fetch` reseau, comme les neuf autres portees.
        timeout-minutes: 3
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/porte_du_job.py inventaire

      - name: Set up JDK 25
        if: steps.portee.outputs.concerne == 'oui'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: false
          cache: maven

      - name: Produire le SBOM CycloneDX
        if: steps.portee.outputs.concerne == 'oui'
        # `makeBom` seul : l'inventaire vient de la RÉSOLUTION Maven, il n'a pas besoin que le
        # fat-jar soit construit ni que les tests tournent.
        run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:makeBom

      - name: Ce que le SBOM déclare
        if: steps.portee.outputs.concerne == 'oui'
        # Une ligne lisible dans le journal : un inventaire qu'on ne lit jamais ne sert à personne.
        run: |
          python3 - <<'FIN'
          import json
          bom = json.load(open('target/sbom.json'))
          composants = bom['components']
          uniques = {(c.get('group', ''), c['name'], c.get('version', '')) for c in composants}
          print(f"{len(uniques)} composant(s) livré(s), format {bom['bomFormat']} {bom['specVersion']}")
          for groupe, nom, version in sorted(uniques):
              print(f"  {groupe}:{nom} {version}")
          FIN

      - name: Scanner le SBOM
        if: steps.portee.outputs.concerne == 'oui'
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: target/sbom.json
          # Le seuil est strict PARCE QUE la mesure du jour est zéro : au moment où l'inventaire est
          # propre, être strict ne coûte rien, et c'est le seul moment où on peut l'être sans avoir à
          # trier une dette existante. Un seuil posé au-dessus d'un lot d'alertes déjà là ne bloque
          # jamais rien.
          severity-cutoff: high
          fail-build: true
          output-format: table

      - name: Conserver le rapport
        # Même quand le scan échoue : c'est là qu'on en a le plus besoin. Mais pas quand la portée a
        # dit non : il n'y a alors aucun SBOM à conserver, et `always()` seul ferait chercher un
        # fichier que rien n'a produit.
        if: always() && steps.portee.outputs.concerne == 'oui'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-et-scan
          path: |
            target/sbom.json
            ${{ steps.scan.outputs.sarif }}
          if-no-files-found: warn
          retention-days: 30

  # La seconde chaîne d'approvisionnement : celle qui CONSTRUIT et PUBLIE (#3382).
  #
  # Le job ci-dessus répond de ce que le fat-jar embarque. Celui-ci répond des actions GitHub qui le
  # fabriquent, le signent et le publient - un autre approvisionnement, aussi capable de vieillir.
  #
  # `verifie_epinglage.py` (lint.yml) garde leur COHÉRENCE : tout figé par SHA, aucune divergence.
  # C'est vrai indéfiniment, y compris quand l'amont a pris une majeure d'avance. Mesuré au
  # 2026-08-06 : `attest-build-provenance` était sur v3.0.0 (août 2025) quand l'amont en était à
  # v4.1.1, sur l'action qui SIGNE la provenance des binaires livrés. Rien n'avait rougi, et
  # Dependabot - actif, proposant d'autres montées la semaine même - ne l'avait jamais proposée.
  fraicheur-des-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ⟨portee⟩ Chantier #5294, issue #5379. Ce job juge les actions qui CONSTRUISENT et PUBLIENT.
      # Il ne tourne pour de vrai que le lundi, par `schedule`, ou la portee n a pas de base et rend
      # `oui`. Sur une demande, il conclut « sans objet » plutot que d etre absent du recapitulatif.
      - name: "Ce diff touche-t-il le garde de fraîcheur ou son atelier (#5379)"
        id: portee
        shell: bash
        timeout-minutes: 3
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/porte_du_job.py fraicheur-des-actions

      - name: Les actions épinglées ont-elles pris du retard ?
        if: steps.portee.outputs.concerne == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/verifie_fraicheur_actions.py

          # Trois tentatives, parce que l'API bafouille. Vu en local : un appel qui rend la liste
          # attendue, rejoué à l'identique trente secondes plus tard, revient vide. Sans reprise, ce
          # hoquet se lirait « version indéterminée », donc ROUGE, et un garde qui rougit au hasard
          # s'apprend à ignorer aussi vite qu'un garde qui se tait.
          #
          # Un échec qui PERSISTE, lui, reste rouge, et c'est voulu : un SHA qui ne porte plus aucun
          # tag est en soi une nouvelle - le tag a été déplacé ou supprimé en amont.
          insiste() {
            local essai
            for essai in 1 2 3; do
              resultat=$(gh api "$@" 2>/dev/null || true)
              [ -n "$resultat" ] && { printf '%s' "$resultat"; return 0; }
              [ "$essai" -lt 3 ] && sleep 3
            done
            return 1
          }

          # Pour chaque action épinglée : le tag que porte NOTRE SHA, et la dernière release amont.
          mesure=$(mktemp)
          while IFS=$'\t' read -r depot sha commentaire; do
            [ -n "$depot" ] || continue
            tags=$(insiste "repos/$depot/tags" --paginate \
                     --jq ".[] | select(.commit.sha==\"$sha\") | .name" || true)
            # On préfère le tag précis (vX.Y.Z) au tag flottant de majeure (vX), que certaines
            # actions sont seules à porter. Sans ce repli, elles seraient déclarées « indéterminées ».
            #
            # `|| true` : un `grep` qui ne trouve rien rend 1, et sous `set -e` il tuerait le job
            # AVANT le jugement. Le cas se produit vraiment - `winget-releaser` ne porte que `v2`.
            # Vu en rejouant ce bloc en local, où il sortait sans afficher une seule ligne.
            epingle=$(printf '%s\n' "$tags" | grep -E '^v?[0-9]+\.[0-9]+' | head -1 || true)
            [ -n "$epingle" ] || epingle=$(printf '%s\n' "$tags" | grep -E '^v?[0-9]' | head -1 || true)
            amont=$(insiste "repos/$depot/releases/latest" --jq .tag_name || true)

            # L'ÂGE du commit épinglé face au HEAD amont. C'est ce que la comparaison de tags ne
            # peut pas voir : `winget-releaser` ne porte qu'un tag `v2`, immobile depuis novembre
            # 2024, si bien que « tag épinglé = tag amont » annonçait « à jour » sur vingt et un
            # mois de retard réel (#2213). Un tag qui ne bouge jamais rend la mesure par tags muette.
            d_pin=$(insiste "repos/$depot/commits/$sha" --jq .commit.author.date || true)
            branche=$(insiste "repos/$depot" --jq .default_branch || true)
            d_head=""
            [ -n "$branche" ] && d_head=$(insiste "repos/$depot/commits/$branche" --jq .commit.author.date || true)
            retard="?"
            if [ -n "$d_pin" ] && [ -n "$d_head" ]; then
              retard=$(( ( $(date -d "${d_head%%T*}" +%s) - $(date -d "${d_pin%%T*}" +%s) ) / 86400 ))
              [ "$retard" -lt 0 ] && retard=0
            fi

            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$depot" "${epingle:-?}" "${amont:-?}" "$retard" "${commentaire:-}" >> "$mesure"
          done < <(python3 .github/scripts/verifie_fraicheur_actions.py --inventaire)

          verdict=$(python3 .github/scripts/verifie_fraicheur_actions.py < "$mesure") && frais=0 || frais=1
          printf '%s\n' "$verdict"

          {
            echo "## Fraîcheur des actions épinglées"
            echo
            printf '%s\n' "$verdict" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$frais"
