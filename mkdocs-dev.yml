markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: fr

# Redessine le bandeau des ADR depuis leur en-tete OKF (#4336). Sans lui, le statut, le chantier et
# la verification cessent d etre visibles : ils sont passes des puces au frontmatter, que MkDocs
# retire du corps rendu.
hooks:
  - scripts/mkdocs/bandeau_adr.py
  - scripts/mkdocs/expose_constitution.py

extra_css:
  - stylesheets/extra.css

# Validation des liens (#2887). MkDocs vérifie par défaut que le FICHIER cité existe, mais pas que
# l'ANCRE y existe : un `#titre-renomme` passait donc en silence, y compris en `--strict`. Mesuré, le
# dépôt en portait quatre, toutes écrites à la main en gardant les accents que le slug retire.
validation:
  anchors: warn
