# Les dépendances Python du dépôt, épinglées et groupées par usage (issue #5008).
#
# Pourquoi ce fichier existe. Neuf gardes de CI portaient `import yaml` sans que rien ne déclare
# PyYAML : en CI ils ne marchaient que parce que l'image `ubuntu-latest` le fournit, et le job
# `lint` n'installe rien. En local, six des neuf plantaient nu sur `ModuleNotFoundError`, erreur qui
# ressemble à un défaut du changement en cours.
#
# L'asymétrie n'avait jamais été argumentée : 36 dépendances déclarées dans `pom.xml` pour tester le
# Java, un fichier pour construire la doc, et rien pour les gardes.
#
# Installation, la même en CI et sur un poste :
#   pip install --group gardes    # ce dont les gardes ont besoin
#   pip install --group doc       # ce dont la documentation a besoin
#
# `uv sync --group <nom>` fait la même chose pour qui l'a. Aucune des deux n'est un prérequis du
# dépôt : `pip` suffit, et il est là par construction avec `actions/setup-python`.

[project]
name = "vigiechiro-outillage"
version = "0"
description = "Les dépendances de l'outillage du dépôt : ses gardes et sa documentation."
requires-python = ">=3.12"

[dependency-groups]
# Ce que les GARDES lisent. Ne porte que ce qui est UTILISÉ : déclarer une dépendance dont rien ne
# se sert est ce que `dependency:analyze-only` refuse côté Java, et il n'y a pas de raison d'être
# plus permissif ici. `pytest`, `mutmut` et `coverage.py` entreront avec le lot qui les emploie.
#
# `tree-sitter-language-pack` porte la GRAMMAIRE que `scripts/_commun/arbre.py` interroge, et il est
# ici plutot que dans `recherche` parce qu'un cliquet l'importe EN CI (chantier #5402). Trois choses
# se disent sur son épinglage :
#
#  - la version fixe la GRAMMAIRE, pas seulement l'outil. Les noms de nœuds lui appartiennent, et un
#    relèvement pourrait déplacer une population sans que rien ne rougisse. `verifie_grammaire()`
#    dans `arbre.py` tient l'autre moitié : il confronte ces noms à une source témoin, si bien qu'un
#    relèvement devient un acte qu'on relit plutôt qu'une dérive qu'on subit. Mesuré entre 1.14.3 et
#    1.16.1 : 229 types de nœuds, 14 781 `method_declaration`, identiques ;
#  - le paquet est **abi3**, donc une seule roue couvre les versions futures de Python. Sa dépendance
#    `tree-sitter`, elle, publie une roue PAR version : c'est ce qui rend #5401 nécessaire, puisque
#    `python-version: "3.x"` flotte au niveau mineur dans cinq ateliers ;
#  - il apporte neuf grammaires pour le prix d'une, dont `markdown`. Le dépôt porte 604 fichiers
#    `.md` contre 2 125 `.java`, et aucun n'a d'analyseur aujourd'hui.
gardes = ["PyYAML==6.0.2", "ruff==0.16.5", "tree-sitter-language-pack==1.16.1"]

# Ce que la DOCUMENTATION construit. Ces deux versions se tiennent : mkdocs-material < 9.7.0 exige
# `pymdown-extensions~=10.2`, soit « >= 10.2 et < 11 ». Monter pymdown-extensions en 11 sans monter
# mkdocs-material rend l'installation insoluble. Les faire bouger ensemble, ou pas du tout.
doc = ["mkdocs-material==9.7.7", "pymdown-extensions==11.0.1"]

# Ce qu'on installe pour CHERCHER dans le dépôt, et que la CI n'installe pas. `lint.yml` lance
# `pip install --group gardes` en trois endroits : y mettre ces outils-ci les poserait sur un runner
# qui ne s'en sert pas. Ils vivent dans le venv d'outils du poste, `~/.venv-outils` (#4849).
recherche = ["semgrep"]

# Le nom de la DISTRIBUTION n'est pas celui du MODULE : `PyYAML` répond à `import yaml`, et
# `mkdocs-material` fournit `mkdocs` et `material`. Deviner la correspondance exigerait d'interroger
# ce qui est déjà INSTALLÉ, donc de rendre un verdict qui dépend de la machine. Elle se déclare ici,
# et `scripts/methode/verifie-dependances-declarees.py` la lit.
[tool.vigiechiro.modules]
PyYAML = ["yaml"]
# `ruff` ne s'importe pas : il s'appelle en ligne de commande.
ruff = []
mkdocs-material = ["mkdocs", "material"]
# Les tirets deviennent des soulignés : `pip install tree-sitter-language-pack` répond à
# `import tree_sitter_language_pack`. C'est l'écart de `PyYAML` / `yaml`, en moins visible, parce
# qu'ici les deux noms se ressemblent assez pour qu'on croie n'avoir rien à déclarer.
tree-sitter-language-pack = ["tree_sitter_language_pack"]

# Les COMMANDES que la méthode prescrit, et la distribution qui les installe (issue #4849).
#
# Table SÉPARÉE de `modules` ci-dessus, et non une colonne de plus : celle-là dit ce qu'un `import`
# trouve, celle-ci ce qu'un shell trouve. Les fondre demanderait de renommer une table qu'un garde
# lit déjà, pour un gain nul.
#
# **Pourquoi elle existe.** `AGENTS.md`, `CONTRIBUTING.md` et `dev-docs/chercher-dans-le-depot.md`
# prescrivent `graphify` sans nommer une seule fois ce qui l'installe. Or `pip install graphify`
# n'existe pas, et `npm i -g graphify` installe **un autre paquet** - un générateur de graphes
# aléatoires publié par un tiers. Le piège est celui de `PyYAML` / `yaml`, en plus coûteux : ici on
# n'obtient pas une erreur, on obtient le mauvais outil.
#
# Ces distributions ne sont dans AUCUN groupe ci-dessus, et c'est délibéré : `lint.yml` lance
# `pip install --group gardes` en trois endroits, et `graphify` n'a pas à être installé sur un
# runner. Le workflow l'écrit déjà - « `graphify` n'est pas installé sur le runner ».
[tool.vigiechiro.commandes]
# S'installe par `uv tool install graphifyy`, ou `pipx install graphifyy`, ou `pip install graphifyy`.
# Pose DEUX exécutables, mesuré le 2026-09-06.
#
# **L'extra `[sql]` compte ici** : le dépôt porte 45 fichiers `.sql` sous
# `src/main/resources/db/migration/`, que le graphe ne voit pas sans lui. La forme complète est donc
# `pip install "graphifyy[sql]"` - les guillemets ne sont pas décoratifs, le shell mangerait les
# crochets.
graphifyy = ["graphify", "graphify-mcp"]

# Le formateur et le linter du Python du dépôt (issue #5022). Le Java avait Spotless et PMD, le
# shell avait shellcheck, et 13 965 lignes de Python n'avaient rien : c'est la couche qui juge tout
# le reste qui n'était jugée par personne.
[tool.ruff]
# 100 colonnes, parce que c'est ce que ce dépôt ÉCRIT : centile 95 de ses lignes Python, centile 99 à
# 105. Le défaut de ruff est 88, étranger à ce code : il toucherait 5 431 lignes au lieu de 3 718, en
# éclatant en multiligne chaque appel un peu long. La norme suit le code, elle ne lui est pas imposée.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Le jeu de règles est celui que ruff active PAR DÉFAUT, et c'est un choix : le contrôle est la
# VERSION ÉPINGLÉE ci-dessus, exactement comme `pom.xml` épingle PMD et hérite de son jeu. Une montée
# de version change donc le jeu, et devient un acte délibéré qu'on relit.
ignore = [
  # `re.S` plutôt que `re.DOTALL`, 63 fois. C'est une préférence de nommage, pas un défaut évité : le
  # dépôt emploie les alias courts uniformément, et les renommer ne rendrait aucun garde plus juste.
  # Un signalement qui crie sur du bon travail est un signalement qu'on apprend à ignorer (ADR 4002).
  "FURB167",
]
